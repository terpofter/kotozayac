<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>АРЕНА</title>
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a0f;
    touch-action:none;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;position:fixed;inset:0;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

// ====================== КАНВАС ======================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let VW = 1, VH = 1;

function resize() {
  VW = window.innerWidth;
  VH = window.innerHeight;
  canvas.width  = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  canvas.style.width  = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ====================== СОСТОЯНИЕ ======================
const player = {
  x: 0, y: 0, r: 15, angle: 0,
  hp: 100, maxHp: 100, speed: 265,
  fireCd: 0, fireRate: 0.105, hurtCd: 0
};

const cam = { x: 0, y: 0 };

const bullets   = [];
const enemies   = [];
const particles = [];
const pickups   = [];

const game = {
  state: 'play',       // 'play' | 'over'
  score: 0,
  wave: 1,
  toSpawn: 0,
  spawnTimer: 0,
  waveTimer: 0,
  shake: 0,
  overTime: 0,
  bannerText: '',
  bannerT: 0
};

// ====================== УПРАВЛЕНИЕ ======================
const moveStick = { active:false, id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0, mag:0 };
const aimStick  = { active:false, id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0, mag:0 };

const keys = {};
const mouse = { x: 0, y: 0 };
let mouseDown = false;
let usingMouse = false;

const STICK_R = 64;

function stickUpdate(s, x, y) {
  let dx = x - s.ox, dy = y - s.oy;
  const d = Math.hypot(dx, dy);
  if (d > STICK_R) { dx = dx / d * STICK_R; dy = dy / d * STICK_R; }
  s.x = s.ox + dx;
  s.y = s.oy + dy;
  s.dx = dx / STICK_R;
  s.dy = dy / STICK_R;
  s.mag = Math.min(1, d / STICK_R);
}

function stickStart(s, id, x, y) {
  s.active = true; s.id = id;
  s.ox = x; s.oy = y; s.x = x; s.y = y;
  s.dx = 0; s.dy = 0; s.mag = 0;
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  usingMouse = false;

  if (game.state === 'over') {
    if (performance.now() - game.overTime > 800) resetGame();
    return;
  }

  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (x < VW * 0.5) {
      if (!moveStick.active) stickStart(moveStick, t.identifier, x, y);
    } else {
      if (!aimStick.active) stickStart(aimStick, t.identifier, x, y);
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (moveStick.active && t.identifier === moveStick.id) stickUpdate(moveStick, t.clientX, t.clientY);
    else if (aimStick.active && t.identifier === aimStick.id) stickUpdate(aimStick, t.clientX, t.clientY);
  }
}, { passive: false });

function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (moveStick.active && t.identifier === moveStick.id) moveStick.active = false;
    else if (aimStick.active && t.identifier === aimStick.id) aimStick.active = false;
  }
}
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });

// --- десктоп ---
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (game.state === 'over' && performance.now() - game.overTime > 600) resetGame();
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  usingMouse = true;
});
canvas.addEventListener('mousedown', (e) => {
  if (game.state === 'over') {
    if (performance.now() - game.overTime > 600) resetGame();
    return;
  }
  mouseDown = true; usingMouse = true;
  mouse.x = e.clientX; mouse.y = e.clientY;
});
window.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ====================== ХЕЛПЕРЫ ======================
function rand(a, b) { return a + Math.random() * (b - a); }

function burst(x, y, n, color, speed, size, life) {
  if (particles.length > 320) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.25 + Math.random());
    const l = life * (0.6 + Math.random() * 0.8);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: l, maxLife: l,
      color, r: size * (0.5 + Math.random())
    });
  }
}

function banner(text) {
  game.bannerText = text;
  game.bannerT = 1.6;
}

// ====================== СБРОС / ВОЛНЫ ======================
function resetGame() {
  game.state = 'play';
  game.score = 0;
  game.wave = 1;
  game.toSpawn = 5;
  game.spawnTimer = 0.7;
  game.waveTimer = 0;
  game.shake = 0;
  game.overTime = 0;

  player.x = 0; player.y = 0;
  player.hp = player.maxHp;
  player.angle = 0;
  player.fireCd = 0;
  player.hurtCd = 0;

  bullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  pickups.length = 0;

  cam.x = player.x - VW / 2;
  cam.y = player.y - VH / 2;

  moveStick.active = false;
  aimStick.active = false;

  banner('ВОЛНА 1');
}

function nextWave() {
  game.wave++;
  game.toSpawn = Math.min(4 + game.wave * 2, 26);
  game.spawnTimer = 0.7;
  game.waveTimer = 0;
  banner('ВОЛНА ' + game.wave);
}

function spawnEnemy() {
  const ang = Math.random() * Math.PI * 2;
  const dist = Math.max(VW, VH) * 0.72 + 120;

  const hp = Math.min(6, 2 + Math.floor(game.wave / 2));
  const speed = Math.min(195, 55 + game.wave * 7 + rand(0, 25));

  enemies.push({
    x: player.x + Math.cos(ang) * dist,
    y: player.y + Math.sin(ang) * dist,
    r: 14,
    hp, maxHp: hp,
    speed,
    flash: 0,
    atkCd: 0,
    wob: Math.random() * 10
  });
}

// ====================== ОБНОВЛЕНИЕ ======================
function update(dt) {
  // тряска
  if (game.shake > 0) {
    game.shake = Math.max(0, game.shake - 55 * dt);
  }
  if (game.bannerT > 0) game.bannerT -= dt;

  // частицы живут всегда
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
  }

  if (game.state !== 'play') return;

  // ---------- движение игрока ----------
  let mvx = 0, mvy = 0;
  if (moveStick.active) { mvx = moveStick.dx; mvy = moveStick.dy; }
  if (keys['w'] || keys['arrowup']    || keys['ц']) mvy -= 1;
  if (keys['s'] || keys['arrowdown']  || keys['ы']) mvy += 1;
  if (keys['a'] || keys['arrowleft']  || keys['ф']) mvx -= 1;
  if (keys['d'] || keys['arrowright'] || keys['в']) mvx += 1;

  const mag = Math.hypot(mvx, mvy);
  if (mag > 1) { mvx /= mag; mvy /= mag; }

  player.x += mvx * player.speed * dt;
  player.y += mvy * player.speed * dt;

  if (player.hurtCd > 0) player.hurtCd -= dt;
  if (player.fireCd > 0) player.fireCd -= dt;

  // ---------- прицел ----------
  let aimAngle = player.angle;
  let firing = false;

  if (aimStick.active && aimStick.mag > 0.18) {
    aimAngle = Math.atan2(aimStick.dy, aimStick.dx);
    firing = true;
  } else if (usingMouse) {
    const psx = player.x - cam.x;
    const psy = player.y - cam.y;
    aimAngle = Math.atan2(mouse.y - psy, mouse.x - psx);
    firing = mouseDown;
  } else if (mag > 0.15) {
    aimAngle = Math.atan2(mvy, mvx);
  }
  player.angle = aimAngle;

  // ---------- стрельба ----------
  if (firing && player.fireCd <= 0) {
    player.fireCd = player.fireRate;
    const a = aimAngle + rand(-0.045, 0.045);
    const mx = player.x + Math.cos(a) * 24;
    const my = player.y + Math.sin(a) * 24;
    bullets.push({
      x: mx, y: my,
      vx: Math.cos(a) * 950,
      vy: Math.sin(a) * 950,
      life: 0.9, dmg: 1
    });
    burst(mx, my, 2, '#ffd45e', 130, 2.2, 0.16);
    game.shake = Math.max(game.shake, 1.6);
  }

  // ---------- пули ----------
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0) { bullets.splice(i, 1); continue; }

    let hit = false;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      const dx = e.x - b.x, dy = e.y - b.y;
      if (dx * dx + dy * dy < (e.r + 4) * (e.r + 4)) {
        e.hp -= b.dmg;
        e.flash = 0.09;
        burst(b.x, b.y, 4, '#ff9b5e', 190, 2.6, 0.28);
        if (e.hp <= 0) {
          burst(e.x, e.y, 14, '#ff5a5a', 260, 3.4, 0.55);
          game.score += 10 + game.wave * 2;
          game.shake = Math.max(game.shake, 4);
          if (Math.random() < 0.09) {
            pickups.push({ x: e.x, y: e.y, r: 11, t: 0 });
          }
          enemies.splice(j, 1);
        }
        hit = true;
        break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }

  // ---------- враги ----------
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.flash > 0) e.flash -= dt;
    if (e.atkCd > 0) e.atkCd -= dt;

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;

    e.wob += dt * 6;
    const perpX = -dy / d, perpY = dx / d;
    const wob = Math.sin(e.wob) * 0.35;

    e.x += (dx / d + perpX * wob) * e.speed * dt;
    e.y += (dy / d + perpY * wob) * e.speed * dt;

    // контактный урон
    if (d < e.r + player.r && e.atkCd <= 0 && player.hurtCd <= 0) {
      e.atkCd = 0.75;
      player.hp -= 12;
      player.hurtCd = 0.45;
      game.shake = Math.max(game.shake, 8);
      burst(player.x, player.y, 8, '#ff4d4d', 220, 3, 0.4);
      if (player.hp <= 0) {
        player.hp = 0;
        game.state = 'over';
        game.overTime = performance.now();
        burst(player.x, player.y, 30, '#7dd3fc', 320, 4, 0.9);
      }
    }
  }

  // расталкивание врагов
  for (let i = 0; i < enemies.length; i++) {
    for (let j = i + 1; j < enemies.length; j++) {
      const a = enemies[i], b = enemies[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const minD = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 < minD * minD && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const push = (minD - d) * 0.5;
        dx /= d; dy /= d;
        a.x -= dx * push; a.y -= dy * push;
        b.x += dx * push; b.y += dy * push;
      }
    }
  }

  // ---------- аптечки ----------
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t += dt;
    const dx = player.x - p.x, dy = player.y - p.y;
    if (dx * dx + dy * dy < (p.r + player.r) * (p.r + player.r)) {
      player.hp = Math.min(player.maxHp, player.hp + 25);
      burst(p.x, p.y, 10, '#4ade80', 180, 3, 0.5);
      pickups.splice(i, 1);
      continue;
    }
    if (p.t > 20) pickups.splice(i, 1);
  }

  // ---------- волны ----------
  if (game.toSpawn > 0) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      spawnEnemy();
      game.toSpawn--;
      game.spawnTimer = Math.max(0.14, 0.85 - game.wave * 0.05);
    }
  } else if (enemies.length === 0) {
    if (game.waveTimer <= 0) game.waveTimer = 2.0;
    game.waveTimer -= dt;
    if (game.waveTimer <= 0) nextWave();
  }

  // ---------- камера ----------
  const k = 1 - Math.exp(-9 * dt);
  cam.x += (player.x - VW / 2 - cam.x) * k;
  cam.y += (player.y - VH / 2 - cam.y) * k;
}

// ====================== РЕНДЕР ======================
function render() {
  // фон
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, VW, VH);

  const shakeX = game.shake > 0 ? rand(-game.shake, game.shake) : 0;
  const shakeY = game.shake > 0 ? rand(-game.shake, game.shake) : 0;

  ctx.save();
  ctx.translate(-cam.x + shakeX, -cam.y + shakeY);

  // сетка
  const GS = 80;
  ctx.strokeStyle = '#14141f';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const x0 = Math.floor(cam.x / GS) * GS;
  const y0 = Math.floor(cam.y / GS) * GS;
  for (let x = x0; x < cam.x + VW + GS; x += GS) {
    ctx.moveTo(x, cam.y - GS);
    ctx.lineTo(x, cam.y + VH + GS);
  }
  for (let y = y0; y < cam.y + VH + GS; y += GS) {
    ctx.moveTo(cam.x - GS, y);
    ctx.lineTo(cam.x + VW + GS, y);
  }
  ctx.stroke();

  // аптечки
  for (const p of pickups) {
    const pulse = 1 + Math.sin(p.t * 6) * 0.12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(74,222,128,0.25)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 0.55 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#4ade80';
    ctx.fill();
  }

  // пули
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.014, b.y - b.vy * 0.014);
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 3.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff8d0';
    ctx.fill();
  }

  // враги
  for (const e of enemies) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#e04848';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = e.flash > 0 ? '#ffffff' : '#8f1f1f';
    ctx.stroke();

    // «глаза» в сторону игрока
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.beginPath();
    ctx.arc(e.x + Math.cos(a) * 6, e.y + Math.sin(a) * 6, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#2b0a0a';
    ctx.fill();

    // хп-бар
    if (e.hp < e.maxHp) {
      const w = 30;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w, 4);
      ctx.fillStyle = '#ffb454';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w * (e.hp / e.maxHp), 4);
    }
  }

  // игрок
  if (game.state === 'play') {
    const hurt = player.hurtCd > 0;

    // тело
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fillStyle = hurt ? '#ffffff' : '#3ddc84';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = hurt ? '#ffffff' : '#1b7a4a';
    ctx.stroke();

    // пушка
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = '#9fb3c8';
    ctx.fillRect(6, -4.5, 24, 9);
    ctx.fillStyle = '#5b6b7d';
    ctx.fillRect(20, -3, 12, 6);
    ctx.restore();

    // блик
    ctx.beginPath();
    ctx.arc(player.x - 4, player.y - 5, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
  }

  // частицы
  for (const p of particles) {
    const t = p.life / p.maxLife;
    ctx.globalAlpha = Math.max(0, t);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + t * 0.9), 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // ====================== HUD ======================
  drawHUD();
  drawSticks();

  if (game.state === 'over') drawGameOver();
}

function drawHUD() {
  // HP
  const bw = Math.min(230, VW * 0.52), bh = 16;
  const bx = 16, by = 16;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);

  const f = Math.max(0, player.hp / player.maxHp);
  ctx.fillStyle = f > 0.5 ? '#4ade80' : f > 0.25 ? '#facc15' : '#ef4444';
  ctx.fillRect(bx, by, bw * f, bh);

  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bx - 0.5, by - 0.5, bw + 1, bh + 1);

  ctx.font = 'bold 12px system-ui,-apple-system,Segoe UI,sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.ceil(player.hp) + ' HP', bx + 8, by + bh / 2 + 0.5);

  // счёт
  ctx.textAlign = 'right';
  ctx.font = 'bold 20px system-ui,-apple-system,Segoe UI,sans-serif';
  ctx.fillStyle = '#ffd45e';
  ctx.fillText('СЧЁТ ' + game.score, VW - 16, 26);

  // волна
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px system-ui,-apple-system,Segoe UI,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('ВОЛНА ' + game.wave, VW / 2, 26);

  // остаток врагов
  if (game.state === 'play') {
    const left = enemies.length + game.toSpawn;
    ctx.font = 'bold 13px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillStyle = 'rgba(255,120,120,0.85)';
    ctx.fillText('ВРАГОВ: ' + left, VW / 2, 48);
  }

  // баннер волны
  if (game.bannerT > 0 && game.state === 'play') {
    const a = Math.min(1, game.bannerT / 0.5);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(game.bannerText, VW / 2, VH * 0.32);
    ctx.globalAlpha = 1;
  }
}

function drawSticks() {
  // подсказки для тача
  if (isTouch) {
    if (!moveStick.active) hintCircle(90, VH - 110, 'ДВИЖЕНИЕ');
    if (!aimStick.active)  hintCircle(VW - 90, VH - 110, 'ОГОНЬ');
  }
  drawStick(moveStick, 'rgba(120,200,255,');
  drawStick(aimStick,  'rgba(255,140,120,');
}

function hintCircle(x, y, label) {
  ctx.beginPath();
  ctx.arc(x, y, 52, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 9px system-ui,-apple-system,Segoe UI,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y);
}

function drawStick(s, colorPrefix) {
  if (!s.active) return;

  ctx.beginPath();
  ctx.arc(s.ox, s.oy, STICK_R, 0, Math.PI * 2);
  ctx.fillStyle = colorPrefix + '0.05)';
  ctx.fill();
  ctx.strokeStyle = colorPrefix + '0.22)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(s.x, s.y, 26, 0, Math.PI * 2);
  ctx.fillStyle = colorPrefix + '0.30)';
  ctx.fill();
  ctx.strokeStyle = colorPrefix + '0.75)';
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(6,6,12,0.82)';
  ctx.fillRect(0, 0, VW, VH);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 44px system-ui,-apple-system,Segoe UI,sans-serif';
  ctx.fillStyle = '#ef4444';
  ctx.fillText('ИГРА ОКОНЧЕНА', VW / 2, VH / 2 - 80);

  ctx.font = 'bold 26px system-ui,-apple-system,Segoe UI,sans-serif';
  ctx.fillStyle = '#ffd45e';
  ctx.fillText('СЧЁТ: ' + game.score, VW / 2, VH / 2 - 20);

  ctx.font = 'bold 18px system-ui,-apple-system,Segoe UI,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Волна ' + game.wave, VW / 2, VH / 2 + 20);

  if (Math.floor(performance.now() / 500) % 2 === 0) {
    ctx.font = 'bold 20px system-ui,-apple-system,Segoe UI,sans-serif';
    ctx.fillStyle = '#7dd3fc';
    ctx.fillText(isTouch ? 'КОСНИСЬ, ЧТОБЫ ЗАНОВО' : 'НАЖМИ, ЧТОБЫ ЗАНОВО', VW / 2, VH / 2 + 100);
  }
}

// ====================== ЦИКЛ ======================
let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);

})();
</script>
