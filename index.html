<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Котозаяц: Прыжок в Кубы</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ffcc; --bg: #0f0f13; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden; touch-action: none; user-select: none;
            background-image: radial-gradient(circle at 50% 50%, #1e1e28 0%, #0f0f13 100%);
        }
        #game-container {
            position: relative; width: 800px; height: 600px;
            max-width: 100%; max-height: 100%; aspect-ratio: 4/3;
            border: 4px solid #333; border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2), 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden; background: #87CEEB;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; align-items: center; gap: 10px; z-index: 10;
            pointer-events: none;
        }
        .hud-item {
            background: rgba(15, 15, 25, 0.85); padding: 10px 14px; border-radius: 10px;
            color: white; font-size: 14px; display: flex; align-items: center; gap: 8px;
            border: 2px solid rgba(0, 255, 204, 0.3); backdrop-filter: blur(8px);
        }
        .hud-icon { width: 20px; height: 20px; fill: currentColor; }
        .icon-carrot { color: #FF8C00; }
        .icon-heart { color: #ff4444; }
        .icon-trophy { color: #FFD700; }
        
        .hud-btn {
            background: rgba(15, 15, 25, 0.85); border: 2px solid rgba(0, 255, 204, 0.3);
            color: var(--neon); width: 44px; height: 44px; border-radius: 10px;
            cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); transition: all 0.2s; pointer-events: auto;
        }
        .hud-btn:active { transform: scale(0.9); }

        /* Оверлеи */
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 10, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; backdrop-filter: blur(10px);
        }
        .overlay.hidden { display: none !important; }
        h1 { color: var(--neon); font-size: 36px; text-shadow: 0 0 10px var(--neon); margin-bottom: 15px; text-align: center; }
        h2 { color: #fff; font-size: 24px; text-shadow: 0 0 10px #fff; margin-bottom: 20px; }
        .subtitle { color: #888; font-size: 12px; margin-bottom: 40px; }
        
        .btn {
            background: linear-gradient(180deg, #00ffcc, #00b38f); color: #000;
            border: none; border-radius: 8px; padding: 16px 36px; font-size: 16px; 
            font-family: inherit; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 0 #005a47; transition: transform 0.1s; margin: 8px; text-align: center;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #005a47; }
        .btn-secondary { background: linear-gradient(180deg, #555, #333); color: #fff; box-shadow: 0 6px 0 #111; font-size: 12px; padding: 14px 24px; }
        .btn-secondary:active { box-shadow: 0 0 0 #111; }

        .slider-wrap { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 10px; margin: 6px 0; width: 280px; }
        .slider-wrap label { color: #fff; font-size: 10px; flex: 0 0 50px; }
        .slider-wrap input[type=range] { flex: 1; accent-color: var(--neon); }

        /* Мобильное управление */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 25px;
            z-index: 15; pointer-events: none; gap: 15px;
        }
        .control-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(0, 255, 204, 0.15); border: 3px solid rgba(0, 255, 204, 0.6);
            color: var(--neon); font-size: 28px; display: flex; justify-content: center; align-items: center;
            pointer-events: auto; user-select: none; backdrop-filter: blur(5px);
        }
        .control-btn:active { background: rgba(0, 255, 204, 0.5); }
        .control-btn.jump { background: rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.6); color: #FFD700; }
        .control-btn.jump:active { background: rgba(255, 215, 0, 0.5); }
        #mobile-controls.visible { display: flex; }

        #photo-preview { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: none; border: 2px solid var(--neon); }

        /* Терминал */
        #game-over-screen { background: #000 !important; justify-content: flex-start !important; align-items: flex-start !important; padding: 40px 30px; }
        #terminal { font-family: 'Courier New', monospace; font-size: 16px; line-height: 1.8; color: #00ff41; text-shadow: 0 0 8px currentColor; animation: hueShift 6s linear infinite; width: 100%; }
        @keyframes hueShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .term-line { margin: 0; min-height: 1.8em; white-space: pre-wrap; }
        .term-btn-group { margin-top: 30px; display: flex; gap: 15px; }
        .term-btn { background: rgba(0, 255, 65, 0.1); border: 2px solid #00ff41; color: #00ff41; padding: 12px 24px; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
            <div class="hud-item">
                <svg class="hud-icon icon-carrot" viewBox="0 0 24 24"><path d="M17.7,2.7c-0.8-0.8-2-0.8-2.8,0L9,8.6C7.8,9.8,7,11.3,6.6,13l-2.2,8.3c-0.1,0.6,0.4,1.1,1,1l8.3-2.2 c1.7-0.4,3.2-1.2,4.4-2.4l5.9-5.9c0.8-0.8,0.8-2,0-2.8L17.7,2.7z M5.1,19.3l1.4-5.4c0.2-0.9,0.7-1.7,1.3-2.4l4.8-4.8 l3.3,3.3l-4.8,4.8c-0.7,0.7-1.5,1.1-2.4,1.3L5.1,19.3z M8.5,2.5c1.4-0.4,2.9-0.4,4.3,0l-3,3C9.3,4.2,8.7,3.4,8.5,2.5z M21.5,15.5c-0.4,1.4-0.4,2.9,0,4.3l-3-3C19.3,16.3,20.1,15.7,21.5,15.5z"/></svg>
                <span id="score">0</span>
            </div>
            <div class="hud-item">
                <svg class="hud-icon icon-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span id="lives">3</span>
            </div>
            <div class="hud-item">
                <svg class="hud-icon icon-trophy" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
                <span id="best">0</span>
            </div>
            <div style="flex:1"></div>
            <img id="photo-preview" alt="Фото">
            <button id="btn-mute" class="hud-btn">🔊</button>
            <button id="btn-photo" class="hud-btn">📷</button>
            <button id="btn-pause" class="hud-btn">⏸</button>
        </div>

        <div id="start-screen" class="overlay">
            <h1>КОТОЗАЯЦ</h1>
            <div class="subtitle">ПРЫЖОК В КУБЫ</div>
            <button id="start-btn" class="btn">ИГРАТЬ</button>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h2>ПАУЗА</h2>
            <div class="slider-wrap"><label>SFX</label><input type="range" id="slider-sfx" min="0" max="100" value="70"></div>
            <div class="slider-wrap"><label>MUSIC</label><input type="range" id="slider-music" min="0" max="100" value="35"></div>
            <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
            <button id="menu-btn-pause" class="btn btn-secondary">В ГЛАВНОЕ МЕНЮ</button>
            <button id="reset-photo-btn" class="btn btn-secondary">СБРОСИТЬ ФОТО</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <div id="terminal">
                <div id="term-lines"></div>
                <div class="term-btn-group" id="term-buttons" style="display:none;">
                    <button class="term-btn" id="term-restart-btn">Заново</button>
                    <button class="term-btn" id="term-menu-btn">В меню</button>
                </div>
            </div>
        </div>

        <div id="mobile-controls">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn jump" id="btn-jump">▲</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>

        <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <script>
        // Звук
        const Sound = {
            ctx: null, muted: false, musicVolume: 0.35, sfxVolume: 0.7, BPM: 115,
            init() {
                if (this.ctx) return;
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
                if(!this.ctx) return;
                this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(this.ctx.destination);
                this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = this.musicVolume; this.musicGain.connect(this.master);
                this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVolume; this.sfxGain.connect(this.master);
                const sr = this.ctx.sampleRate; this.noiseBuffer = this.ctx.createBuffer(1, sr * 0.5, sr);
                const data = this.noiseBuffer.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            },
            resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
            setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 1; },
            tone({freq, type='sine', dur=0.2, vol=0.1, slideTo=null, delay=0, attack=0.005, filter=null}) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, t);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                let node = osc;
                if (filter) { const f = this.ctx.createBiquadFilter(); f.type = filter.type; f.frequency.setValueAtTime(filter.freq, t); if (filter.freqTo) f.frequency.exponentialRampToValueAtTime(filter.freqTo, t + dur); f.Q.value = filter.q || 1; osc.connect(f); node = f; }
                node.connect(g).connect(this.sfxGain); osc.start(t); osc.stop(t + dur + 0.02);
            },
            noise({dur=0.1, vol=0.1, type='highpass', freq=2000, delay=0}) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay, src = this.ctx.createBufferSource(); src.buffer = this.noiseBuffer;
                const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = this.ctx.createGain();
                g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                src.connect(f).connect(g).connect(this.sfxGain); src.start(t); src.stop(t + dur + 0.01);
            },
            sfxJump() { this.tone({freq: 250, type: 'square', dur: 0.16, vol: 0.1, slideTo: 780}); this.tone({freq: 500, type: 'triangle', dur: 0.12, vol: 0.05, slideTo: 1200, delay: 0.02}); },
            sfxBoost() { this.tone({freq: 200, type: 'sawtooth', dur: 0.5, vol: 0.1, slideTo: 2000, filter: {type: 'bandpass', freq: 500, freqTo: 3500, q: 4}}); },
            sfxHit() { this.tone({freq: 2093, type: 'sine', dur: 0.11, vol: 0.20}); this.noise({dur: 0.008, vol: 0.08, type: 'highpass', freq: 6000}); },
            sfxPowerup() { this.tone({freq: 440, type: 'square', dur: 0.1, vol: 0.1}); this.tone({freq: 554, type: 'square', dur: 0.1, vol: 0.1, delay: 0.1}); this.tone({freq: 880, type: 'square', dur: 0.3, vol: 0.12, delay: 0.2}); },
            sfxClick() { this.noise({dur: 0.025, vol: 0.14, type: 'highpass', freq: 3200}); this.tone({freq: 2200, type: 'square', dur: 0.02, vol: 0.06, slideTo: 1600}); },
            sfxGameover() { this.tone({freq: 220, type: 'sine', dur: 1.6, vol: 0.07}); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance('Геймовер'); u.lang = 'ru-RU'; u.rate = 0.85; u.pitch = 0.7; speechSynthesis.speak(u); } } catch(e) {} }
        };

        // Игра
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

        const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'), bestEl = document.getElementById('best');
        if (isTouch) document.getElementById('mobile-controls').classList.add('visible');

        let gameState = 'start', score = 0, lives = 3, bestScore = 0, frames = 0, difficulty = 1, prevDifficulty = 1;
        let combo = 0, carrotsCollected = 0, carrotsMissed = 0, objectSpawnCount = 0, spawnTimer = 0;
        let objects = [], particles = [], clouds = [], hills = [];
        let screenShake = 0, flash = 0, btnLeft = false, btnRight = false, termGeneration = 0;

        try { bestScore = parseInt(localStorage.getItem('kotozayac_best') || '0', 10) || 0; } catch(e) {}
        bestEl.innerText = bestScore;

        const GROUND_Y = H - 150, GRAVITY = 0.85, JUMP_V = -16;
        const player = { x: W/2 - 40, y: GROUND_Y, width: 80, height: 80, speed: 7, vy: 0, onGround: true, squash: 1, stretch: 1, dustTimer: 0 };

        let customPlayerImg = new Image(); let hasCustomImg = false;
        try {
            const saved = localStorage.getItem('kotozayac_img');
            if (saved) {
                customPlayerImg.onload = () => { hasCustomImg = true; document.getElementById('photo-preview').src = saved; document.getElementById('photo-preview').style.display = 'block'; };
                customPlayerImg.src = saved;
            }
        } catch(e) {}

        document.getElementById('btn-photo').addEventListener('click', () => { Sound.init(); Sound.sfxClick(); document.getElementById('fileInput').click(); });
        document.getElementById('fileInput').addEventListener('change', e => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                customPlayerImg.onload = () => {
                    hasCustomImg = true; document.getElementById('photo-preview').src = ev.target.result; document.getElementById('photo-preview').style.display = 'block';
                    try { localStorage.setItem('kotozayac_img', ev.target.result); } catch(e) {}
                };
                customPlayerImg.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });
        document.getElementById('reset-photo-btn').addEventListener('click', () => {
            Sound.sfxClick(); hasCustomImg = false; try { localStorage.removeItem('kotozayac_img'); } catch(e){}
            document.getElementById('photo-preview').style.display = 'none'; document.getElementById('photo-preview').src = '';
        });

        for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 20 + Math.random() * 150, speed: 10 + Math.random() * 20, scale: 0.4 + Math.random() * 0.6 });
        for (let i = 0; i < 5; i++) hills.push({ x: i * 250 - 100, y: GROUND_Y, w: 300 + Math.random() * 200, h: 150 + Math.random() * 100, speed: 2 });

        const keys = {};
        window.addEventListener('keydown', e => {
            Sound.init(); Sound.resume(); keys[e.code] = true;
            if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') tryJump();
            if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
            if (gameState === 'gameover') {
                if (e.code === 'KeyR' || e.code === 'Enter') restartGame();
                if (e.code === 'KeyM') goToMainMenu();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('blur', () => { btnLeft = btnRight = false; for (const k in keys) keys[k] = false; });

        canvas.addEventListener('pointerdown', () => { Sound.init(); Sound.resume(); });
        canvas.addEventListener('pointermove', e => {
            if (isTouch || gameState !== 'playing') return;
            const r = canvas.getBoundingClientRect();
            player.x = (e.clientX - r.left) * (W / r.width) - player.width / 2; clampPlayer();
        });

        function bindBtn(el, setter) {
            el.addEventListener('pointerdown', e => { e.preventDefault(); setter(true); el.setPointerCapture(e.pointerId); });
            el.addEventListener('pointerup', () => setter(false)); el.addEventListener('pointercancel', () => setter(false)); el.addEventListener('pointerleave', () => setter(false));
        }
        bindBtn(document.getElementById('btn-left'), v => btnLeft = v);
        bindBtn(document.getElementById('btn-right'), v => btnRight = v);
        document.getElementById('btn-jump').addEventListener('pointerdown', e => { e.preventDefault(); tryJump(); });

        function tryJump() {
            if (gameState !== 'playing') return;
            if (player.onGround) {
                player.vy = JUMP_V; player.onGround = false; Sound.sfxJump();
                for(let i=0; i<5; i++) particles.push({ x: player.x + player.width/2, y: player.y + player.height, vx: (Math.random()-0.
