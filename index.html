<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Котозаяц: Прыжок в Кубы</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4CAF50; 
            --neon: #00ffcc; 
            --bg: #0f0f13; 
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden; touch-action: none;
            -webkit-user-select: none; user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background-image: radial-gradient(circle at 50% 50%, #1e1e28 0%, #0f0f13 100%);
        }
        #game-container {
            position: relative; width: 800px; height: 600px;
            max-width: 100%; max-height: 100%; aspect-ratio: 4/3;
            border: 4px solid #333; border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2), 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden; background: #87CEEB;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* Стильный HUD */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; align-items: center; gap: 10px; z-index: 10;
            pointer-events: none;
        }
        .hud-item {
            background: rgba(15, 15, 25, 0.7);
            padding: 10px 14px; border-radius: 10px;
            color: white; font-size: 14px; display: flex; align-items: center; gap: 8px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1), inset 0 0 10px rgba(0, 255, 204, 0.1);
            backdrop-filter: blur(8px);
        }
        .hud-btn {
            background: rgba(15, 15, 25, 0.7); border: 2px solid rgba(0, 255, 204, 0.3);
            color: var(--neon); width: 44px; height: 44px; border-radius: 10px;
            cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); transition: all 0.2s;
            pointer-events: auto; font-family: inherit;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }
        .hud-btn:active { transform: scale(0.9); box-shadow: 0 0 20px rgba(0, 255, 204, 0.5); }
        .hud-btn:hover { border-color: var(--neon); color: #fff; }

        /* Оверлеи */
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 10, 0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
            backdrop-filter: blur(10px); transition: opacity 0.3s;
        }
        .overlay.hidden { display: none; opacity: 0; pointer-events: none; }
        h1 { color: var(--neon); font-size: 36px;
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon), 4px 4px 0 #000;
            margin-bottom: 15px; text-align: center; line-height: 1.4; }
        h2 { color: #fff; font-size: 24px; text-shadow: 0 0 10px #fff; margin-bottom: 20px; }
        .subtitle { color: #888; font-size: 12px; margin-bottom: 40px; text-shadow: 2px 2px 0 #000; }
        .btn {
            background: linear-gradient(180deg, #00ffcc, #00b38f); color: #000;
            border: none; border-radius: 8px;
            padding: 16px 36px; font-size: 16px; font-family: inherit; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 0 #005a47, 0 10px 20px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s, box-shadow 0.1s; 
            margin: 8px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #005a47, 0 2px 10px rgba(0, 255, 204, 0.4); }
        .btn-secondary {
            background: linear-gradient(180deg, #444, #222); color: #fff;
            box-shadow: 0 6px 0 #111, 0 8px 10px rgba(0,0,0,0.5);
            font-size: 12px; padding: 14px 24px;
        }

        .slider-wrap { display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.05); padding: 10px 16px; border-radius: 10px;
            margin: 6px 0; width: 280px; border: 1px solid rgba(255,255,255,0.1); }
        .slider-wrap label { color: #fff; font-size: 10px; flex: 0 0 50px; }
        .slider-wrap input[type=range] { flex: 1; accent-color: var(--neon); }

        /* Мобильное управление */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 25px;
            z-index: 15; pointer-events: none; gap: 15px;
        }
        .control-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(0, 255, 204, 0.1); border: 3px solid rgba(0, 255, 204, 0.5);
            color: var(--neon); font-size: 28px; display: flex; justify-content: center; align-items: center;
            pointer-events: auto; touch-action: none; user-select: none;
            backdrop-filter: blur(5px); transition: all 0.1s;
            font-family: inherit; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .control-btn:active { background: rgba(0, 255, 204, 0.4); transform: scale(0.95); }
        .control-btn.jump { background: rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.5); color: #FFD700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        .control-btn.jump:active { background: rgba(255, 215, 0, 0.4); }
        #mobile-controls.visible { display: flex; }

        #photo-preview { width: 40px; height: 40px; border-radius: 50%;
            object-fit: cover; display: none; border: 2px solid var(--neon); box-shadow: 0 0 10px var(--neon); }

        /* Экран смерти (Терминал) */
        #game-over-screen {
            background: #000 !important; backdrop-filter: none !important;
            justify-content: flex-start !important; align-items: flex-start !important;
            padding: 40px 30px; overflow: hidden; cursor: pointer;
        }
        #game-over-screen::before {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.4) 0px, rgba(0,0,0,0.4) 2px, transparent 2px, transparent 4px);
            pointer-events: none; z-index: 1; animation: scanmove 6s linear infinite;
        }
        @keyframes scanmove { 0% { background-position: 0 0; } 100% { background-position: 0 80px; } }
        #terminal {
            position: relative; z-index: 2; font-family: 'Courier New', Consolas, monospace;
            font-size: 16px; line-height: 1.8; color: #00ff41;
            text-shadow: 0 0 8px currentColor, 0 0 16px currentColor;
            animation: hueShift 6s linear infinite; width: 100%; max-width: 720px; word-wrap: break-word;
        }
        @keyframes hueShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .term-line { margin: 0; min-height: 1.8em; white-space: pre-wrap; font-family: inherit; color: inherit; }
        .term-cursor {
            display: inline-block; width: 10px; height: 18px; background: currentColor;
            margin-left: 4px; vertical-align: -3px; animation: termBlink 0.9s steps(2) infinite;
            box-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }
        @keyframes termBlink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

        @media (max-width: 600px) {
            h1 { font-size: 24px; } h2 { font-size: 18px; }
            .hud-item { font-size: 10px; padding: 8px 10px; }
            .hud-btn { width: 36px; height: 36px; font-size: 14px; }
            .btn { font-size: 12px; padding: 14px 20px; }
            .slider-wrap { width: 240px; }
            #game-over-screen { padding: 25px 15px; }
            #terminal { font-size: 12px; }
            .term-cursor { width: 8px; height: 14px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
            <div class="hud-item">🍎 <span id="score">0</span></div>
            <div class="hud-item">❤️ <span id="lives">3</span></div>
            <div class="hud-item">🏆 <span id="best">0</span></div>
            <div style="flex:1"></div>
            <img id="photo-preview" alt="Фото">
            <button id="btn-mute" class="hud-btn" title="Звук">🔊</button>
            <button id="btn-photo" class="hud-btn" title="Загрузить фото">📷</button>
            <button id="btn-pause" class="hud-btn" title="Пауза">⏸</button>
            <button id="btn-install" class="hud-btn" title="Установить" style="display:none;">📲</button>
        </div>

        <div id="start-screen" class="overlay">
            <h1>КОТОЗАЯЦ</h1>
            <div class="subtitle">ПРЫЖОК В КУБЫ</div>
            <button id="start-btn" class="btn">ИГРАТЬ</button>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h2>ПАУЗА</h2>
            <div class="slider-wrap">
                <label>SFX</label>
                <input type="range" id="slider-sfx" min="0" max="100" value="70">
            </div>
            <div class="slider-wrap">
                <label>MUSIC</label>
                <input type="range" id="slider-music" min="0" max="100" value="35">
            </div>
            <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
            <button id="reset-photo-btn" class="btn btn-secondary">СБРОСИТЬ ФОТО</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <div id="terminal">
                <div id="term-lines"></div>
            </div>
        </div>

        <div id="mobile-controls">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn jump" id="btn-jump">▲</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>

        <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <script>
        // ============ PWA ============
        const manifest = {
            name: "Котозаяц: Прыжок в Кубы", short_name: "Котозаяц",
            start_url: "./", display: "fullscreen", background_color: "#0f0f13", theme_color: "#00ffcc",
            icons: [{ src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9IjEwMCIgZmlsbD0iIzBmMGYxMyIvPjxyZWN0IHk9IjM2MCIgd2lkdGg9IjUxMiIgaGVpZ2h0PSIxNTIiIGZpbGw9IiMwMGZmY2MiLz48cmVjdCB4PSIxNjAiIHk9IjEwMCIgd2lkdGg9IjUwIiBoZWlnaHQ9IjEzMCIgcng9IjEwIiBmaWxsPSIjNmY2ZjZmIi8+PHJlY3QgeD0iMzAyIiB5PSIxMDAiIHdpZHRoPSI1MCIgaGVpZ2h0PSIxMzAiIHJ4PSIxMCIgZmlsbD0iIzZmNmY2ZiIvPjxyZWN0IHg9IjE1MCIgeT0iMjAwIiB3aWR0aD0iMjEyIiBoZWlnaHQ9IjIwMCIgcng9IjQwIiBmaWxsPSIjOGE4YThhIi8+PHJlY3QgeD0iMTgwIiB5PSIyNTAiIHdpZHRoPSI1NSIgaGVpZ2h0PSI2MCIgcng9IjEwIiBmaWxsPSIjZmZmIi8+PHJlY3QgeD0iMjc3IiB5PSIyNTAiIHdpZHRoPSI1NSIgaGVpZ2h0PSI2MCIgcng9IjEwIiBmaWxsPSIjZmZmIi8+PHJlY3QgeD0iMTk3IiB5PSIyNjgiIHdpZHRoPSIyOCIgaGVpZ2h0PSIzMCIgcng9IjYiIGZpbGw9IiMwMDAiLz48cmVjdCB4PSIyODciIHk9IjI2OCIgd2lkdGg9IjI4IiBoZWlnaHQ9IjMwIiByeD0iNiIgZmlsbD0iIzAwMCIvPjwvc3ZnPg==", sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        document.head.appendChild(Object.assign(document.createElement('link'), { rel: 'manifest', href: URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/json'})) }));
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
            window.addEventListener('load', () => navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}))).catch(()=>{}));
        }
        let deferredPrompt;
        const installBtn = document.getElementById('btn-install');
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'flex'; });
        installBtn.addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.style.display = 'none'; });

        // ============ ЗВУК ============
        const Sound = {
            ctx: null, master: null, musicGain: null, sfxGain: null, noiseBuffer: null, muted: false,
            musicVolume: 0.35, sfxVolume: 0.7, musicPlaying: false, musicTimer: null, nextNoteTime: 0, step: 0, BPM: 115,

            init() {
                if (this.ctx) return;
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
                this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(this.ctx.destination);
                this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = this.musicVolume; this.musicGain.connect(this.master);
                this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVolume; this.sfxGain.connect(this.master);
                const sr = this.ctx.sampleRate;
                this.noiseBuffer = this.ctx.createBuffer(1, sr * 0.5, sr);
                const data = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            },
            resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
            setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 1; try { localStorage.setItem('kotozayac_mute', m ? '1' : '0'); } catch(e){} },
            setSfxVolume(v) { this.sfxVolume = v; if (this.sfxGain) this.sfxGain.gain.value = v; try { localStorage.setItem('kotozayac_sfx', String(v)); } catch(e){} },
            setMusicVolume(v) { this.musicVolume = v; if (this.musicGain) this.musicGain.gain.value = v; try { localStorage.setItem('kotozayac_musicvol', String(v)); } catch(e){} },
            tone({freq, type='sine', dur=0.2, vol=0.1, slideTo=null, delay=0, attack=0.005, filter=null, gainNode=null}) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay; const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, t);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                let node = osc;
                if (filter) { const f = this.ctx.createBiquadFilter(); f.type = filter.type; f.frequency.setValueAtTime(filter.freq, t); if (filter.freqTo) f.frequency.exponentialRampToValueAtTime(filter.freqTo, t + dur); f.Q.value = filter.q || 1; osc.connect(f); node = f; }
                node.connect(g).connect(gainNode || this.sfxGain); osc.start(t); osc.stop(t + dur + 0.02);
            },
            noise({dur=0.1, vol=0.1, type='highpass', freq=2000, delay=0, gainNode=null}) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay; const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuffer;
                const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = this.ctx.createGain();
                g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                src.connect(f).connect(g).connect(gainNode || this.sfxGain); src.start(t); src.stop(t + dur + 0.01);
            },
            sfx: {
                jump() { Sound.tone({freq: 250, type: 'square', dur: 0.16, vol: 0.1, slideTo: 780}); Sound.tone({freq: 500, type: 'triangle', dur: 0.12, vol: 0.05, slideTo: 1200, delay: 0.02}); },
                boost() { Sound.tone({freq: 200, type: 'sawtooth', dur: 0.5, vol: 0.1, slideTo: 2000, filter: {type: 'bandpass', freq: 500, freqTo: 3500, q: 4}}); Sound.tone({freq: 1568, type: 'sine', dur: 0.15, vol: 0.07, delay: 0.42}); Sound.tone({freq: 2093, type: 'sine', dur: 0.22, vol: 0.05, delay: 0.5}); },
                hit() { Sound.tone({freq: 2093, type: 'sine', dur: 0.11, vol: 0.20, attack: 0.001}); Sound.tone({freq: 3136, type: 'sine', dur: 0.075, vol: 0.09, attack: 0.001}); Sound.tone({freq: 5232, type: 'sine', dur: 0.045, vol: 0.04, attack: 0.001}); Sound.noise({dur: 0.008, vol: 0.08, type: 'highpass', freq: 6000}); },
                gameover() { Sound.tone({freq: 220.00, type: 'sine', dur: 1.6, vol: 0.07, attack: 0.05}); Sound.tone({freq: 261.63, type: 'sine', dur: 1.6, vol: 0.06, attack: 0.05}); Sound.tone({freq: 329.63, type: 'sine', dur: 1.6, vol: 0.06, attack: 0.05}); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance('Геймовер'); u.lang = 'ru-RU'; u.rate = 0.85; u.pitch = 0.7; speechSynthesis.speak(u); } } catch(e) {} },
                click() { Sound.noise({dur: 0.025, vol: 0.14, type: 'highpass', freq: 3200}); Sound.tone({freq: 2200, type: 'square', dur: 0.02, vol: 0.06, slideTo: 1600}); },
                start() { Sound.tone({freq: 90, type: 'sawtooth', dur: 0.7, vol: 0.14, slideTo: 45, filter: {type: 'lowpass', freq: 600, freqTo: 120}}); Sound.noise({dur: 0.18, vol: 0.1, type: 'lowpass', freq: 600}); Sound.tone({freq: 440, type: 'square', dur: 0.4, vol: 0.09, delay: 0.28}); Sound.tone({freq: 660, type: 'square', dur: 0.4, vol: 0.08, delay: 0.35}); Sound.tone({freq: 880, type: 'sawtooth', dur: 0.6, vol: 0.09, delay: 0.42, filter: {type: 'lowpass', freq: 3000}}); },
                combo() { Sound.tone({freq: 300, type: 'sawtooth', dur: 0.38, vol: 0.12, slideTo: 2200, filter: {type: 'bandpass', freq: 700, freqTo: 3200, q: 5}}); Sound.tone({freq: 600, type: 'square', dur: 0.18, vol: 0.06, slideTo: 1800, delay: 0.12}); },
                record() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => Sound.tone({freq: f, type: 'square', dur: 0.22, vol: 0.08, delay: i * 0.08})); Sound.tone({freq: 1318.5, type: 'triangle', dur: 0.5, vol: 0.07, delay: 0.36}); }
            },
            music: {
                chords: [ { bass: 110.00, notes: [440.00, 523.25, 659.25] }, { bass: 87.31, notes: [349.23, 440.00, 523.25] }, { bass: 110.00, notes: [440.00, 523.25, 659.25] }, { bass: 98.00, notes: [392.00, 493.88, 587.33] } ],
                start() { if (!Sound.ctx || this.playing) return; this.playing = true; Sound.musicPlaying = true; Sound.nextNoteTime = Sound.ctx.currentTime + 0.1; Sound.step = 0; this.tick(); },
                stop() { this.playing = false; Sound.musicPlaying = false; if (Sound.musicTimer) { clearTimeout(Sound.musicTimer); Sound.musicTimer = null; } },
                tick() {
                    if (!this.playing || !Sound.ctx) return;
                    const stepDur = 60 / Sound.BPM / 4;
                    while (Sound.nextNoteTime < Sound.ctx.currentTime + 0.15) { this.scheduleStep(Sound.step, Sound.nextNoteTime); Sound.nextNoteTime += stepDur; Sound.step = (Sound.step + 1) % 64; }
                    Sound.musicTimer = setTimeout(() => this.tick(), 25);
                },
                scheduleStep(step, time) {
                    const bar = Math.floor(step / 16) % 4; const s = step % 16; const chord = this.chords[bar];
                    if (s % 4 === 0) this.kick(time); if (s === 4 || s === 12) this.snare(time); if (s % 2 === 0) this.hat(time, s % 4 === 0 ? 0.045 : 0.025);
                    if (s === 0 || s === 6 || s === 8 || s === 14) this.bass(chord.bass, time);
                    if (s % 2 === 0) { const note = chord.notes[(s / 2) % 3]; this.arp(note, time, s % 4 === 0 ? 0.045 : 0.028); }
                },
                kick(time) { const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(150, time); o.frequency.exponentialRampToValueAtTime(45, time + 0.12); g.gain.setValueAtTime(0.55, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.22); o.connect(g).connect(Sound.musicGain); o.start(time); o.stop(time + 0.25); },
                snare(time) { const ctx = Sound.ctx, src = ctx.createBufferSource(); src.buffer = Sound.noiseBuffer; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1400; const g = ctx.createGain(); g.gain.setValueAtTime(0.13, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.15); src.connect(f).connect(g).connect(Sound.musicGain); src.start(time); src.stop(time + 0.18); const o = ctx.createOscillator(), g2 = ctx.createGain(); o.frequency.value = 180; g2.gain.setValueAtTime(0.09, time); g2.gain.exponentialRampToValueAtTime(0.001, time + 0.1); o.connect(g2).connect(Sound.musicGain); o.start(time); o.stop(time + 0.12); },
                hat(time, vol) { const ctx = Sound.ctx, src = ctx.createBufferSource(); src.buffer = Sound.noiseBuffer; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000; const g = ctx.createGain(); g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.05); src.connect(f).connect(g).connect(Sound.musicGain); src.start(time); src.stop(time + 0.06); },
                bass(freq, time) { const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 8; f.frequency.setValueAtTime(1400, time); f.frequency.exponentialRampToValueAtTime(220, time + 0.22); o.type = 'sawtooth'; o.frequency.value = freq; g.gain.setValueAtTime(0.16, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.25); o.connect(f).connect(g).connect(Sound.musicGain); o.start(time); o.stop(time + 0.28); },
                arp(freq, time, vol) { const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2400; o.type = 'square'; o.frequency.value = freq; g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.12); o.connect(f).connect(g).connect(Sound.musicGain); o.start(time); o.stop(time + 0.15); }
            }
        };
        try {

        // ============ ИГРА ============

        const GROUND_Y = H - 150;

        // Генерация параллакса

        function bindBtn(el, setter) {

        function togglePause() {

        document.getElementById('start-btn').addEventListener('click', () => {

        function restart() {
            termGeneration++; Sound.sfx.click(); document.getElementById('game-over-screen').classList.add('hidden');
            resetGame(); gameState = 'playing'; Sound.music.start();
        }

        const sfxSlider = document.getElementById('slider-sfx'); const musSlider = document.getElementById('slider-music');
        sfxSlider.value = Math.round(Sound.sfxVolume * 100); musSlider.value = Math.round(Sound.musicVolume * 100);

        musSlider.addEventListener('input', () => Sound.setMusicVolume(musSlider.value / 100));

        function clampPlayer() { if (player.x < 0) player.x = 0; if (player.x + player.width > W) player.x = W - player.width; }
        
        function spawnParticles(x, y, colors, count) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
                particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, life: 1, decay: 0.02 + Math.random()*0.03, color: colors[(Math.random()*colors.length)|0], size: 2 + Math.random()*5 });
            }
        }

        function spawnObject() {
            const rand = Math.random();
            let type = 'rotten'; // Заменили блок на гнилую морковку
            if (rand > 0.35) type = 'carrot';
            if (rand > 0.95) type = 'golden'; 
            
            objects.push({
                x: Math.random() * (W - 40), y: -40, width: 40, height: 40,
                speed: (3 + Math.random()*2.5) + difficulty * 0.6, type: type, wobble: Math.random() * Math.PI * 2
            });
        }

        function drawObjects() {
            for (const obj of objects) {
                const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                ctx.save(); ctx.translate(cx, cy);
                
                // Свечение
                ctx.shadowBlur = 15;
                if (obj.type === 'carrot') ctx.shadowColor = '#FF8C00';
                else if (obj.type === 'golden') ctx.shadowColor = '#FFD700';
                else ctx.shadowColor = '#3a4b22'; // Темно-зеленое свечение для гнили

                if (obj.type === 'carrot' || obj.type === 'golden') {
                    ctx.rotate(Math.sin(obj.wobble) * 0.15);
                    ctx.fillStyle = obj.type === 'golden' ? '#FFD700' : '#FF8C00';
                    ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(0,22); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = obj.type === 'golden' ? '#FFF8DC' : '#FFA500';
                    ctx.beginPath(); ctx.moveTo(-5,-5); ctx.lineTo(5,-5); ctx.lineTo(0,18); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#228B22'; ctx.fillRect(-10,-22,20,12);
                    ctx.fillStyle = '#2ecc40'; ctx.fillRect(-4,-28,8,8);
                } else if (obj.type === 'rotten') {
                    ctx.rotate(Math.sin(obj.wobble) * 0.2);
                    // Гнилая морковь (темно-коричневая, кривая)
                    ctx.fillStyle = '#5c4a3d';
                    ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(12,-12); ctx.lineTo(-2,20); ctx.closePath(); ctx.fill();
                    // Пятна гнили
                    ctx.fillStyle = '#3e2e24';
                    ctx.fillRect(-4, -4, 6, 6); ctx.fillRect(4, 6, 5, 5);
                    // Увядшая ботва
                    ctx.fillStyle = '#4a5d23'; ctx.fillRect(-10,-22,20,12);
                    ctx.fillStyle = '#36441a'; ctx.fillRect(-6,-28,8,8);
                    // Споры/вонь
                    ctx.fillStyle = '#88cc88'; ctx.globalAlpha = 0.6 + Math.sin(frames*0.2)*0.4;
                    ctx.fillRect(-18, 0, 4, 4); ctx.fillRect(15, -10, 4, 4); ctx.fillRect(-12, -20, 3, 3);
                    ctx.globalAlpha = 1.0;
                }
                ctx.restore();
            }
        }

        function drawPlayer() {
            const bob = player.onGround ? Math.sin(frames * 0.1) * 3 : 0;
            const px = player.x, py = player.y + bob;
            const w = player.width, h = player.height;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(px + w/2, GROUND_Y + h + 5, w/2.5 * player.squash, 8 * player.stretch, 0, 0, Math.PI*2); ctx.fill();

            ctx.save();
            ctx.translate(px + w/2, py + h/2);
            ctx.scale(player.squash, player.stretch);
            ctx.translate(-(px + w/2), -(py + h/2));

            if (hasCustomImg && customPlayerImg.complete) {
                ctx.save(); ctx.beginPath(); ctx.arc(px + w/2, py + h/2, w/2, 0, Math.PI*2); ctx.clip();
                const imgRatio = customPlayerImg.width / customPlayerImg.height;
                let drawW = w, drawH = h; if (imgRatio > 1) drawH = w / imgRatio; else drawW = h * imgRatio;
                ctx.drawImage(customPlayerImg, px + (w - drawW)/2, py + (h - drawH)/2, drawW, drawH);
                ctx.restore();
            } else {
                ctx.fillStyle = '#6f6f6f'; ctx.fillRect(px + 10, py - 22, 15, 32); ctx.fillRect(px + w - 25, py - 22, 15, 32);
                ctx.fillStyle = '#e8a0a0'; ctx.fillRect(px + 14, py - 16, 7, 22); ctx.fillRect(px + w - 21, py - 16, 7, 22);
                ctx.fillStyle = '#8a8a8a'; ctx.fillRect(px, py, w, h);
                ctx.fillStyle = '#9c9c9c'; ctx.fillRect(px + 12, py + 22, w - 24, 42);
                ctx.fillStyle = '#fff'; ctx.fillRect(px + 15, py + 20, 20, 22); ctx.fillRect(px + w - 35, py + 20, 20, 22);
                ctx.fillStyle = '#000'; ctx.fillRect(px + 20, py + 26, 10, 12); ctx.fillRect(px + w - 30, py + 26, 10, 12);
                ctx.fillStyle = '#fff'; ctx.fillRect(px + 22, py + 28, 4, 4); ctx.fillRect(px + w - 28, py + 28, 4, 4);
                ctx.fillStyle = '#ff9aa2'; ctx.fillRect(px + w/2 - 5, py + 46, 10, 7);
                ctx.fillStyle = '#555';    ctx.fillRect(px + w/2 - 10, py + 57, 20, 4);
            }
            ctx.restore();
        }

        function drawBackground() {
            // Яркое чистое небо
            let skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGrad.addColorStop(0, '#4facfe'); 
            skyGrad.addColorStop(1, '#00f2fe');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GROUND_Y);

            // Солнце
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 40; ctx.shadowColor = '#FFD700';
            ctx.beginPath(); ctx.arc(W - 150, 100, 50, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

            // Пышные облака
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            for (const c of clouds) {
                ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.scale, c.scale);
                ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.arc(35, -15, 25, 0, Math.PI*2); ctx.arc(70, 0, 30, 0, Math.PI*2); ctx.arc(35, 15, 30, 0, Math.PI*2); ctx.fill(); ctx.restore();
            }

            // Холмы на фоне (Параллакс)
            for (let i = 0; i < hills.length; i++) {
                const h = hills[i];
                ctx.fillStyle = i % 2 === 0 ? '#75c95e' : '#56ab3e';
                ctx.beginPath(); ctx.moveTo(h.x, GROUND_Y); ctx.quadraticCurveTo(h.x + h.w/2, GROUND_Y - h.h, h.x + h.w, GROUND_Y); ctx.fill();
            }

            // Земля
            let groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            groundGrad.addColorStop(0, '#5c4033'); groundGrad.addColorStop(1, '#3e2723');
            ctx.fillStyle = groundGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            
            // Травяной покров
            ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, GROUND_Y, W, 15);
            // Травинки
            ctx.fillStyle = '#66bb6a';
            for(let x = 0; x < W; x += 20) {
                ctx.fillRect(x, GROUND_Y - 5, 5, 5);
                ctx.fillRect(x + 10, GROUND_Y - 8, 5, 8);
            }
        }

        function update(dt) {
            if (gameState !== 'playing') return;
            frames += dt * 60;

            if (keys['ArrowLeft'] || keys['KeyA'] || btnLeft) player.x -= player.speed * dt * 60;
            if (keys['ArrowRight'] || keys['KeyD'] || btnRight) player.x += player.speed * dt * 60;
            clampPlayer();

            if ((keys['ArrowLeft'] || keys['KeyA'] || btnLeft || keys['ArrowRight'] || keys['KeyD'] || btnRight) && player.onGround) {
                player.dustTimer += dt * 60;
                if (player.dustTimer > 5) {
                    player.dustTimer = 0;
                    particles.push({ x: player.x + player.width/2, y: player.y + player.height, vx: (Math.random()-0.5)*2, vy: Math.random()*-1, life: 1, decay: 0.05, color: '#aaa', size: 2+Math.random()*2 });
                }
            }

            player.vy += GRAVITY * dt * 60;
            player.y += player.vy * dt * 60;

            if (!player.onGround) {
                player.stretch = Math.min(1.2, 1 + Math.abs(player.vy) * 0.015);
                player.squash = Math.max(0.8, 1 - Math.abs(player.vy) * 0.01);
            } else {
                player.squash += (1 - player.squash) * 0.2;
                player.stretch += (1 - player.stretch) * 0.2;
            }

            if (player.y >= GROUND_Y) {
                if (!player.onGround) { 
                    for(let i=0; i<8; i++) particles.push({ x: player.x + player.width/2, y: player.y + player.height, vx: (Math.random()-0.5)*6, vy: Math.random()*-3, life: 1, decay: 0.05, color: '#4CAF50', size: 2+Math.random()*4 });
                    player.squash = 1.3; player.stretch = 0.7;
                }
                player.y = GROUND_Y; player.vy = 0; player.onGround = true;
            }

            difficulty = 1 + Math.floor(score / 100);
            if (difficulty > prevDifficulty) {
                Sound.sfx.boost(); prevDifficulty = difficulty;
                Sound.BPM = 115 + difficulty * 2;
            }

            spawnTimer += dt * 60;
            const spawnInterval = Math.max(16, 50 - difficulty * 4);
            if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnObject(); }

            // Движение фона
            for (const c of clouds) { c.x -= c.speed * dt; if (c.x < -200) { c.x = W + 200; c.y = 20 + Math.random() * 150; } }
            for (const h of hills) { h.x -= h.speed * dt; if (h.x + h.w < 0) { h.x = W + Math.random()*100; h.h = 150 + Math.random() * 100; } }

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                obj.y += obj.speed * dt * 60;
                obj.wobble += 0.1 * dt * 60;

                const hit = player.x < obj.x + obj.width && player.x + player.width > obj.x && player.y < obj.y + obj.height && player.y + player.height > obj.y;
                
                if (hit) {
                    const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                    if (obj.type === 'carrot' || obj.type === 'golden') {
                        carrotsCollected++; // СЧИТАЕМ СОБРАННЫЕ
                        combo++;
                        let gained = obj.type === 'golden' ? 50 : 10;
                        if (combo === 3 || combo === 5 || combo === 10 || (combo > 10 && combo % 5 === 0)) {
                            Sound.sfx.combo(); gained += combo * 2;
                            spawnParticles(cx, cy, ['#FFD700','#FF8C00','#fff'], 20);
                        } else {
                            Sound.tone({freq: obj.type === 'golden' ? 1200 : 880, type: 'square', dur: 0.06, vol: 0.05, slideTo: 1500});
                        }
                        score += gained; scoreEl.innerText = score;
                        spawnParticles(cx, cy, obj.type === 'golden' ? ['#FFD700','#FFF8DC','#ffaa00'] : ['#FF8C00','#FFD700','#228B22'], 15);
                    } else { // Гнилая морковка
                        combo = 0; lives--; if (lives < 0) lives = 0; livesEl.innerText = lives;
                        Sound.sfx.hit(); spawnParticles(cx, cy, ['#5c4a3d','#ff4444','#4a5d23'], 20);
                        screenShake = 15; flash = 0.5;
                        if (lives <= 0) gameOver();
                    }
                    objects.splice(i, 1); continue;
                }
                
                // Если объект упал за экран
                if (obj.y > H + 20) {
                    // СЧИТАЕМ ПРОПУЩЕННЫЕ (только хорошие морковки)
                    if (obj.type === 'carrot' || obj.type === 'golden') {
                        carrotsMissed++;
                    }
                    objects.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.25 * dt * 60; p.vx *= 0.99; p.life -= p.decay * dt * 60;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (screenShake > 0) { screenShake *= 0.88; if (screenShake < 0.5) screenShake = 0; }
            if (flash > 0) flash = Math.max(0, flash - 0.04 * dt * 60);
        }

        // ============ ТЕРМИНАЛЬНЫЙ ЭКРАН СМЕРТИ ============
        let termGeneration = 0;
        function gameOver() {
            gameState = 'gameover';
            const isNewRecord = score > bestScore;
            if (isNewRecord) { bestScore = score; bestEl.innerText = bestScore; try { localStorage.setItem('kotozayac_best', String(bestScore)); } catch(e) {} }
            document.getElementById('game-over-screen').classList.remove('hidden');
            Sound.music.stop();
            if (isNewRecord) setTimeout(() => Sound.sfx.record(), 600); else setTimeout(() => Sound.sfx.gameover(), 300);
            showTerminalGameOver(isNewRecord);
        }

        function showTerminalGameOver(isNewRecord) {
            termGeneration++; const gen = termGeneration;
            const lines = [
                '> C:\\KOTOZAYAC\\GAME.EXE', 
                '> system.halt();', 
                '',
                `> FINAL_SCORE: ${String(score).padStart(6, '0')}`,
                `> BEST_SCORE:  ${String(bestScore).padStart(6, '0')}${isNewRecord ? '  ★ NEW RECORD ★' : ''}`,
                '-----------------------------------',
                `> CARROTS_EATEN: ${carrotsCollected}`,
                `> CARROTS_MISSED: ${carrotsMissed}`,
                '', 
                '> [ENTER] / клик / R — REBOOT', 
                ''
            ];
            const container = document.getElementById('term-lines'); container.innerHTML = '';
            const cursorLine = document.createElement('div'); cursorLine.className = 'term-line';
            const cursor = document.createElement('span'); cursor.className = 'term-cursor'; cursorLine.appendChild(cursor); container.appendChild(cursorLine);
            let lineIdx = 0;
            function typeNextLine() {
                if (gen !== termGeneration || lineIdx >= lines.length) return;
                const text = lines[lineIdx]; const lineEl = document.createElement('div'); lineEl.className = 'term-line';
                container.insertBefore(lineEl, cursorLine);
                if (text.length === 0) { lineIdx++; setTimeout(typeNextLine, 80); return; }
                let charIdx = 0;
                const interval = setInterval(() => {
                    if (gen !== termGeneration) { clearInterval(interval); return; }
                    charIdx++; lineEl.textContent = text.slice(0, charIdx);
                    if (charIdx >= text.length) { clearInterval(interval); Sound.tone({ freq: 1200, type: 'square', dur: 0.015, vol: 0.015 }); lineIdx++; setTimeout(typeNextLine, 100); }
                }, 20);
            }
            setTimeout(typeNextLine, 300);
        }

        function resetGame() {
            score = 0; lives = 3; frames = 0; spawnTimer = 0; difficulty = 1; prevDifficulty = 1; combo = 0;
            carrotsCollected = 0; carrotsMissed = 0; // Сбрасываем статистику
            objects = []; particles = []; screenShake = 0; flash = 0; btnLeft = btnRight = false;
            Sound.BPM = 115;
            player.x = W/2 - player.width/2; player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.squash = 1; player.stretch = 1;
            scoreEl.innerText = '0'; livesEl.innerText = '3';
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('term-lines').innerHTML = '';
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            
            drawBackground();
            drawObjects();
            drawPlayer();
            
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.restore();

            if (flash > 0) { ctx.fillStyle = `rgba(255,40,40,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
        }

        let lastTime = performance.now();
        function loop(now) {
            let dt = (now - lastTime) / 1000; lastTime = now; if (dt > 0.1) dt = 0.1;
            update(dt); draw();
            requestAnimationFrame(loop);
        }

        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
