<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Котозаяц: Прыжок в Кубы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00ffcc; --bg: #0f0f13; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Anton', Impact, 'Arial Black', sans-serif;
            overflow: hidden; touch-action: none; user-select: none;
            background-image: radial-gradient(circle at 50% 50%, #1e1e28 0%, #0f0f13 100%);
            letter-spacing: 1px;
        }
        #game-container {
            position: relative; width: 800px; height: 600px;
            max-width: 100%; max-height: 100%; aspect-ratio: 4/3;
            border: 4px solid #333; border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2), 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden; background: #87CEEB;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; align-items: center; gap: 10px; z-index: 10;
            pointer-events: none;
        }
        .hud-item {
            background: rgba(15, 15, 25, 0.85); padding: 8px 14px; border-radius: 10px;
            color: white; font-size: 22px; display: flex; align-items: center; gap: 8px;
            border: 2px solid rgba(0, 255, 204, 0.3); backdrop-filter: blur(8px);
        }
        .hud-icon { width: 24px; height: 24px; fill: currentColor; }
        .icon-carrot { color: #FF8C00; }
        .icon-heart { color: #ff4444; }
        .icon-coin { color: #FFD700; }
        
        .hud-btn {
            background: rgba(15, 15, 25, 0.85); border: 2px solid rgba(0, 255, 204, 0.3);
            color: var(--neon); width: 44px; height: 44px; border-radius: 10px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); transition: all 0.2s; pointer-events: auto; padding: 0;
        }
        .hud-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .hud-btn:active { transform: scale(0.9); }
        .hud-btn:hover { border-color: var(--neon); color: #fff; }

        /* Оверлеи */
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 10, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; backdrop-filter: blur(10px);
        }
        .overlay.hidden { display: none !important; }
        
        h1 { color: var(--neon); font-size: 64px; text-shadow: 0 0 20px var(--neon); margin: 0 0 10px 0; text-align: center; letter-spacing: 4px; }
        h2 { color: #fff; font-size: 36px; text-shadow: 0 0 10px #fff; margin-bottom: 20px; letter-spacing: 2px; text-align: center; }
        .subtitle { color: #aaa; font-size: 20px; margin-bottom: 20px; letter-spacing: 2px; text-align: center; }
        
        .btn {
            background: linear-gradient(180deg, #00ffcc, #00b38f); color: #000;
            border: none; border-radius: 8px; padding: 15px 40px; font-size: 24px; 
            font-family: inherit; cursor: pointer;
            box-shadow: 0 6px 0 #005a47; transition: transform 0.1s; margin: 8px; text-align: center;
            text-transform: uppercase; position: relative; z-index: 30;
            width: 100%; max-width: 350px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #005a47; }
        .btn-secondary { background: linear-gradient(180deg, #555, #333); color: #fff; box-shadow: 0 6px 0 #111; font-size: 18px; padding: 12px 24px; }
        .btn-secondary:active { box-shadow: 0 0 0 #111; }
        
        .btn-danger { background: linear-gradient(180deg, #ff4444, #cc0000); color: #fff; box-shadow: 0 6px 0 #800000; font-size: 16px; padding: 10px 20px; max-width: 250px; }
        .btn-danger:active { box-shadow: 0 0 0 #800000; }

        /* Мобильное управление */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 25px;
            z-index: 15; pointer-events: none; gap: 15px;
        }
        .control-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(0, 255, 204, 0.15); border: 3px solid rgba(0, 255, 204, 0.6);
            color: var(--neon); font-size: 32px; display: flex; justify-content: center; align-items: center;
            pointer-events: auto; user-select: none; backdrop-filter: blur(5px);
        }
        .control-btn:active { background: rgba(0, 255, 204, 0.5); }
        .control-btn.jump { background: rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.6); color: #FFD700; }
        .control-btn.jump:active { background: rgba(255, 215, 0, 0.5); }
        #mobile-controls.visible { display: flex; }

        /* Терминал */
        #game-over-screen { background: #000 !important; justify-content: flex-start !important; align-items: flex-start !important; padding: 40px 30px; }
        #terminal { font-family: 'Courier New', monospace; font-size: 18px; font-weight: bold; line-height: 1.8; color: #00ff41; text-shadow: 0 0 8px currentColor; animation: hueShift 6s linear infinite; width: 100%; letter-spacing: 0; }
        @keyframes hueShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .term-line { margin: 0; min-height: 1.8em; white-space: pre-wrap; }
        
        .term-btn-group { margin-top: 30px; display: flex; gap: 15px; position: relative; z-index: 100; }
        .term-btn { 
            background: rgba(0, 255, 65, 0.1); border: 2px solid #00ff41; color: #00ff41; 
            padding: 12px 24px; font-family: inherit; font-size: 20px; cursor: pointer; 
            text-transform: uppercase; pointer-events: auto;
        }
        .term-btn:hover { background: rgba(0, 255, 65, 0.3); }

        /* МАГАЗИН */
        .shop-balance { font-size: 28px; color: #FFD700; margin-bottom: 20px; text-shadow: 0 0 10px #FFD700; text-align: center; }
        #shop-items { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 500px; margin-bottom: 20px; }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); padding: 15px 20px; border-radius: 12px;
            border: 2px solid rgba(0, 255, 204, 0.2);
        }
        .shop-item-info { display: flex; flex-direction: column; gap: 5px; text-align: left; }
        .shop-item-title { color: #fff; font-size: 22px; }
        .shop-item-desc { color: #888; font-size: 14px; letter-spacing: 0; }
        .shop-buy-btn {
            background: linear-gradient(180deg, #FFD700, #FFA500); color: #000;
            border: none; border-radius: 8px; padding: 10px 20px; font-size: 18px;
            font-family: inherit; cursor: pointer; box-shadow: 0 4px 0 #b37400;
        }
        .shop-buy-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b37400; }
        .shop-buy-btn:disabled { background: #444; color: #888; box-shadow: 0 4px 0 #222; cursor: not-allowed; transform: none; }
        
        @media (max-width: 600px) {
            h1 { font-size: 40px; } h2 { font-size: 28px; }
            .subtitle { font-size: 16px; }
            .hud-item { font-size: 16px; padding: 6px 10px; }
            .hud-btn { width: 36px; height: 36px; }
            .hud-btn svg { width: 18px; height: 18px; }
            .hud-icon { width: 18px; height: 18px; }
            .btn { font-size: 18px; padding: 12px 24px; }
            #game-over-screen { padding: 25px 15px; }
            #terminal { font-size: 14px; }
            .term-btn { font-size: 16px; padding: 10px 16px; }
            
            .shop-item { padding: 10px; flex-direction: column; gap: 10px; text-align: center; align-items: center; }
            .shop-item-info { text-align: center; }
            .shop-item-title { font-size: 18px; }
            .shop-item-desc { font-size: 12px; }
            .shop-buy-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
            <div class="hud-item">
                <svg class="hud-icon icon-carrot" viewBox="0 0 24 24"><path d="M17.7,2.7c-0.8-0.8-2-0.8-2.8,0L9,8.6C7.8,9.8,7,11.3,6.6,13l-2.2,8.3c-0.1,0.6,0.4,1.1,1,1l8.3-2.2 c1.7-0.4,3.2-1.2,4.4-2.4l5.9-5.9c0.8-0.8,0.8-2,0-2.8L17.7,2.7z M5.1,19.3l1.4-5.4c0.2-0.9,0.7-1.7,1.3-2.4l4.8-4.8 l3.3,3.3l-4.8,4.8c-0.7,0.7-1.5,1.1-2.4,1.3L5.1,19.3z M8.5,2.5c1.4-0.4,2.9-0.4,4.3,0l-3,3C9.3,4.2,8.7,3.4,8.5,2.5z M21.5,15.5c-0.4,1.4-0.4,2.9,0,4.3l-3-3C19.3,16.3,20.1,15.7,21.5,15.5z"/></svg>
                <span id="score">0</span>
            </div>
            <div class="hud-item">
                <svg class="hud-icon icon-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span id="lives">3</span>
            </div>
            <div class="hud-item">
                <svg class="hud-icon icon-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6v12m-4-6h8" stroke="currentColor" stroke-width="2"/></svg>
                <span id="coins">0</span>
            </div>
            <div style="flex:1"></div>
            
            <button id="btn-mute" class="hud-btn" title="Звук">
                <svg id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <button id="btn-pause" class="hud-btn" title="Пауза">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ (ХАБ) -->
        <div id="hub-screen" class="overlay">
            <h1>КОТОЗАЯЦ</h1>
            <div class="subtitle">ГЛАВНОЕ МЕНЮ</div>
            <button id="btn-play" class="btn">ПРЫЖОК В КУБЫ</button>
            <button id="shop-btn" class="btn" style="background: linear-gradient(180deg, #FFD700, #FFA500); color: #000; box-shadow: 0 6px 0 #b37400;">🛒 МАГАЗИН</button>
            <button id="btn-reset-all" class="btn btn-danger">СБРОСИТЬ ВЕСЬ ПРОГРЕСС</button>
        </div>

        <div id="shop-screen" class="overlay hidden">
            <h2>МАГАЗИН</h2>
            <div class="shop-balance">Баланс: <span id="shop-coins">0</span> 🥕</div>
            <div id="shop-items"></div>
            <button id="shop-close-btn" class="btn">НАЗАД</button>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h2>ПАУЗА</h2>
            <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
            <button id="menu-btn-pause" class="btn btn-secondary">В ГЛАВНОЕ МЕНЮ</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <div id="terminal">
                <div id="term-lines"></div>
                <div class="term-btn-group" id="term-buttons" style="display:none;">
                    <button class="term-btn" id="term-restart-btn">Заново</button>
                    <button class="term-btn" id="term-menu-btn">В меню</button>
                </div>
            </div>
        </div>

        <div id="mobile-controls">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn jump" id="btn-jump">▲</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
    </div>

    <script>
        // ============ PWA ============
        const manifest = {
            name: "Котозаяц", short_name: "Котозаяц",
            start_url: "./", display: "fullscreen", background_color: "#0f0f13", theme_color: "#00ffcc",
            icons: [{ src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9IjEwMCIgZmlsbD0iIzBmMGYxMyIvPjxyZWN0IHk9IjM2MCIgd2lkdGg9IjUxMiIgaGVpZ2h0PSIxNTIiIGZpbGw9IiMwMGZmY2MiLz48cmVjdCB4PSIxNjAiIHk9IjEwMCIgd2lkdGg9IjUwIiBoZWlnaHQ9IjEzMCIgcng9IjEwIiBmaWxsPSIjNmY2ZjZmIi8+PHJlY3QgeD0iMzAyIiB5PSIxMDAiIHdpZHRoPSI1MCIgaGVpZ2h0PSIxMzAiIHJ4PSIxMCIgZmlsbD0iIzZmNmY2ZiIvPjxyZWN0IHg9IjE1MCIgeT0iMjAwIiB3aWR0aD0iMjEyIiBoZWlnaHQ9IjIwMCIgcng9IjQwIiBmaWxsPSIjOGE4YThhIi8+PHJlY3QgeD0iMTgwIiB5PSIyNTAiIHdpZHRoPSI1NSIgaGVpZ2h0PSI2MCIgcng9IjEwIiBmaWxsPSIjZmZmIi8+PHJlY3QgeD0iMjc3IiB5PSIyNTAiIHdpZHRoPSI1NSIgaGVpZ2h0PSI2MCIgcng9IjEwIiBmaWxsPSIjZmZmIi8+PHJlY3QgeD0iMTk3IiB5PSIyNjgiIHdpZHRoPSIyOCIgaGVpZ2h0PSIzMCIgcng9IjYiIGZpbGw9IiMwMDAiLz48cmVjdCB4PSIyODciIHk9IjI2OCIgd2lkdGg9IjI4IiBoZWlnaHQ9IjMwIiByeD0iNiIgZmlsbD0iIzAwMCIvPjwvc3ZnPg==", sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        document.head.appendChild(Object.assign(document.createElement('link'), { rel: 'manifest', href: URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/json'})) }));
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
            window.addEventListener('load', () => navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}))).catch(()=>{}));
        }
        
        // ============ ЗВУК (ИСПРАВЛЕНА ОШИБКА) ============
        const Sound = {
            ctx: null, master: null, musicGain: null, sfxGain: null, noiseBuffer: null, muted: false,
            musicVolume: 0.3, sfxVolume: 0.6, musicPlaying: false, musicTimer: null, nextNoteTime: 0, step: 0, BPM: 115,

            init() {
                if (this.ctx) return;
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
                this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(this.ctx.destination);
                this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = this.musicVolume; this.musicGain.connect(this.master);
                this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVolume; this.sfxGain.connect(this.master);
                const sr = this.ctx.sampleRate;
                this.noiseBuffer = this.ctx.createBuffer(1, sr * 0.5, sr);
                const data = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            },
            resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
            setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 1; try { localStorage.setItem('kotozayac_mute', m ? '1' : '0'); } catch(e){} },
            tone({freq, type='sine', dur=0.2, vol=0.1, slideTo=null, delay=0, attack=0.005, filter=null}) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay; const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, t);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                let node = osc;
                if (filter) { const f = this.ctx.createBiquadFilter(); f.type = filter.type; f.frequency.setValueAtTime(filter.freq, t); if (filter.freqTo) f.frequency.exponentialRampToValueAtTime(filter.freqTo, t + dur); f.Q.value = filter.q || 1; osc.connect(f); node = f; }
                node.connect(g).connect(this.sfxGain); osc.start(t); osc.stop(t + dur + 0.02);
            },
            noise({dur=0.1, vol=0.1, type='highpass', freq=2000, delay=0}) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay; const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuffer;
                const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = this.ctx.createGain();
                g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                src.connect(f).connect(g).connect(this.sfxGain); src.start(t); src.stop(t + dur + 0.01);
            },
            sfx: {
                jump() { Sound.tone({freq: 250, type: 'square', dur: 0.16, vol: 0.1, slideTo: 780}); Sound.tone({freq: 500, type: 'triangle', dur: 0.12, vol: 0.05, slideTo: 1200, delay: 0.02}); },
                boost() { Sound.tone({freq: 200, type: 'sawtooth', dur: 0.5, vol: 0.1, slideTo: 2000, filter: {type: 'bandpass', freq: 500, freqTo: 3500, q: 4}}); },
                hit() { Sound.tone({freq: 2093, type: 'sine', dur: 0.11, vol: 0.2}); Sound.noise({dur: 0.008, vol: 0.08, type: 'highpass', freq: 6000}); },
                gameover() { Sound.tone({freq: 220, type: 'sine', dur: 1.6, vol: 0.07}); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance('Геймовер'); u.lang = 'ru-RU'; u.rate = 0.85; u.pitch = 0.7; speechSynthesis.speak(u); } } catch(e) {} },
                click() { Sound.noise({dur: 0.025, vol: 0.14, type: 'highpass', freq: 3200}); Sound.tone({freq: 2200, type: 'square', dur: 0.02, vol: 0.06, slideTo: 1600}); },
                start() { Sound.tone({freq: 90, type: 'sawtooth', dur: 0.7, vol: 0.14, slideTo: 45, filter: {type: 'lowpass', freq: 600, freqTo: 120}}); Sound.tone({freq: 440, type: 'square', dur: 0.4, vol: 0.09, delay: 0.28}); },
                powerup() { Sound.tone({freq: 440, type: 'square', dur: 0.1, vol: 0.1}); Sound.tone({freq: 880, type: 'square', dur: 0.3, vol: 0.12, delay: 0.1}); },
                buy() { Sound.tone({freq: 880, type: 'sine', dur: 0.1, vol: 0.1}); Sound.tone({freq: 1200, type: 'sine', dur: 0.3, vol: 0.1, delay: 0.1}); }
            },
            music: {
                chords: [ { bass: 110.00, notes: [440.00, 523.25, 659.25] }, { bass: 87.31, notes: [349.23, 440.00, 523.25] }, { bass: 110.00, notes: [440.00, 523.25, 659.25] }, { bass: 98.00, notes: [392.00, 493.88, 587.33] } ],
                start() { if (!Sound.ctx || this.playing) return; this.playing = true; this.nextNoteTime = Sound.ctx.currentTime + 0.1; this.step = 0; this.tick(); },
                stop() { this.playing = false; if (this.musicTimer) { clearTimeout(this.musicTimer); this.musicTimer = null; } },
                tick() {
                    if (!this.playing || !Sound.ctx) return;
                    const stepDur = 60 / Sound.BPM / 4;
                    while (this.nextNoteTime < Sound.ctx.currentTime + 0.15) { this.scheduleStep(this.step, this.nextNoteTime); this.nextNoteTime += stepDur; this.step = (this.step + 1) % 64; }
                    this.musicTimer = setTimeout(() => this.tick(), 25);
                },
                scheduleStep(step, time) {
                    const bar = Math.floor(step / 16) % 4; const s = step % 16; const chord = this.chords[bar];
                    if (s % 4 === 0) this.kick(time); if (s === 4 || s === 12) this.snare(time); if (s % 2 === 0) this.hat(time);
                    if (s === 0 || s === 6 || s === 8 || s === 14) this.bass(chord.bass, time);
                    if (s % 2 === 0) { const note = chord.notes[(s / 2) % 3]; this.arp(note, time); }
                },
                kick(time) { const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(150, time); o.frequency.exponentialRampToValueAtTime(45, time + 0.12); g.gain.setValueAtTime(0.5, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.22); o.connect(g).connect(Sound.musicGain); o.start(time); o.stop(time + 0.25); },
                snare(time) { const ctx = Sound.ctx, src = ctx.createBufferSource(); src.buffer = Sound.noiseBuffer; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1400; const g = ctx.createGain(); g.gain.setValueAtTime(0.1, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.15); src.connect(f).connect(g).connect(Sound.musicGain); src.start(time); src.stop(time + 0.18); },
                hat(time) { const ctx = Sound.ctx, src = ctx.createBufferSource(); src.buffer = Sound.noiseBuffer; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000; const g = ctx.createGain(); g.gain.setValueAtTime(0.03, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.05); src.connect(f).connect(g).connect(Sound.musicGain); src.start(time); src.stop(time + 0.06); },
                bass(freq, time) { const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(800, time); o.type = 'sawtooth'; o.frequency.value = freq; g.gain.setValueAtTime(0.15, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.25); o.connect(f).connect(g).connect(Sound.musicGain); o.start(time); o.stop(time + 0.28); },
                arp(freq, time) { const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = freq; g.gain.setValueAtTime(0.03, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.12); o.connect(g).connect(Sound.musicGain); o.start(time); o.stop(time + 0.15); }
            }
        };
        
        try {
            Sound.muted = localStorage.getItem('kotozayac_mute') === '1';
            if (Sound.muted) { document.getElementById('icon-sound-on').style.display = 'none'; document.getElementById('icon-sound-off').style.display = 'block'; }
        } catch(e) {}

        // ============ МАГАЗИН ============
        let coins = 0;
        let shopItems = {};
        const SHOP_CONFIG = [
            { id: 'extraLife', name: 'Доп. Сердце', desc: 'Начинать игру с 4 жизнями', price: 500 },
            { id: 'slowStart', name: 'Замедление', desc: 'Первые 100 очков медленнее', price: 300 },
            { id: 'skinMafia', name: 'Скин: Мафиозо', desc: 'Навсегда меняет внешний вид', price: 1000 }
        ];

        function loadData() {
            try {
                const savedCoins = localStorage.getItem('kotozayac_coins');
                if (savedCoins) coins = parseInt(savedCoins, 10);
                const savedShop = localStorage.getItem('kotozayac_shop');
                if (savedShop) shopItems = JSON.parse(savedShop);
            } catch(e) { coins = 0; shopItems = {}; }
            updateCoinUI(); renderShop();
        }

        function saveData() {
            try {
                localStorage.setItem('kotozayac_coins', String(coins));
                localStorage.setItem('kotozayac_shop', JSON.stringify(shopItems));
                localStorage.setItem('kotozayac_best', String(bestScore));
            } catch(e) {}
        }

        function updateCoinUI() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('shop-coins').innerText = coins;
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            SHOP_CONFIG.forEach(item => {
                const isBought = shopItems[item.id];
                const card = document.createElement('div');
                card.className = 'shop-item';
                card.innerHTML = `
                    <div class="shop-item-info">
                        <div class="shop-item-title">${item.name}</div>
                        <div class="shop-item-desc">${item.desc}</div>
                    </div>
                    <button class="shop-buy-btn" id="buy-${item.id}" ${isBought || coins < item.price ? 'disabled' : ''}>
                        ${isBought ? 'КУПЛЕНО' : item.price + ' 🥕'}
                    </button>
                `;
                container.appendChild(card);
                if (!isBought) {
                    document.getElementById(`buy-${item.id}`).addEventListener('click', () => {
                        if (coins >= item.price) {
                            coins -= item.price; shopItems[item.id] = true;
                            Sound.sfx.buy(); saveData();
                        }
                    });
                }
            });
        }

        // ============ ИГРА ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        if (isTouch) document.getElementById('mobile-controls').classList.add('visible');

        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        let gameState = 'hub'; // hub, playing, paused, gameover
        let score = 0, lives = 3, bestScore = 0;
        let frames = 0, difficulty = 1, prevDifficulty = 1;
        let combo = 0, carrotsCollected = 0, carrotsMissed = 0, objectSpawnCount = 0, spawnTimer = 0;
        let objects = [], particles = [], clouds = [], hills = [];
        let screenShake = 0, flash = 0, btnLeft = false, btnRight = false, termGeneration = 0;

        try { bestScore = parseInt(localStorage.getItem('kotozayac_best') || '0', 10) || 0; } catch(e) {}

        const GROUND_Y = H - 150, GRAVITY = 0.85, JUMP_V = -16;
        const player = { x: W/2 - 40, y: GROUND_Y, width: 80, height: 80, speed: 7, vy: 0, onGround: true, squash: 1, stretch: 1, dustTimer: 0 };

        // === ТОЛЬКО КАРТИНКИ С GITHUB ===
        let imgIdle = new Image(); imgIdle.src = 'cat.png';
        let imgJump = new Image(); imgJump.src = 'cat_jump.png';
        let imgHit = new Image(); imgHit.src = 'cat_hit.png';

        for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 20 + Math.random() * 150, speed: 10 + Math.random() * 20, scale: 0.4 + Math.random() * 0.6 });
        for (let i = 0; i < 5; i++) hills.push({ x: i * 250 - 100, y: GROUND_Y, w: 300 + Math.random() * 200, h: 150 + Math.random() * 100, speed: 2 });

        // ===== УПРАВЛЕНИЕ =====
        const keys = {};
        window.addEventListener('keydown', e => {
            Sound.init(); Sound.resume(); keys[e.code] = true;
            if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') tryJump();
            if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
            if (gameState === 'gameover') {
                if (e.code === 'KeyR' || e.code === 'Enter') restartGame();
                if (e.code === 'KeyM') goToHub();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('blur', () => { btnLeft = btnRight = false; for (const k in keys) keys[k] = false; });
        canvas.addEventListener('pointerdown', () => { Sound.init(); Sound.resume(); });
        canvas.addEventListener('pointermove', e => {
            if (isTouch || gameState !== 'playing') return;
            const r = canvas.getBoundingClientRect();
            player.x = (e.clientX - r.left) * (W / r.width) - player.width / 2; clampPlayer();
        });

        function bindBtn(el, setter) {
            el.addEventListener('pointerdown', e => { e.preventDefault(); setter(true); el.setPointerCapture(e.pointerId); });
            el.addEventListener('pointerup', () => setter(false)); el.addEventListener('pointercancel', () => setter(false)); el.addEventListener('pointerleave', () => setter(false));
        }
        bindBtn(document.getElementById('btn-left'),  v => btnLeft = v);
        bindBtn(document.getElementById('btn-right'), v => btnRight = v);
        document.getElementById('btn-jump').addEventListener('pointerdown', e => { e.preventDefault(); tryJump(); });

        function tryJump() {
            if (gameState !== 'playing') return;
            if (player.onGround) {
                player.vy = JUMP_V; player.onGround = false; Sound.sfx.jump();
                for(let i=0; i<5; i++) particles.push({ x: player.x + player.width/2, y: player.y + player.height, vx: (Math.random()-0.5)*4, vy: Math.random()*-2, life: 1, decay: 0.05, color: '#aaa', size: 3+Math.random()*3 });
            }
        }

        function togglePause() {
            if (gameState === 'playing') { gameState = 'paused'; Sound.music.stop(); document.getElementById('pause-screen').classList.remove('hidden'); } 
            else if (gameState === 'paused') { gameState = 'playing'; Sound.music.start(); document.getElementById('pause-screen').classList.add('hidden'); }
        }

        // ===== КНОПКИ МЕНЮ =====
        document.getElementById('btn-pause').addEventListener('click', () => { Sound.sfx.click(); togglePause(); });
        document.getElementById('btn-mute').addEventListener('click', () => {
            Sound.init(); Sound.resume(); Sound.setMute(!Sound.muted);
            document.getElementById('icon-sound-on').style.display = Sound.muted ? 'none' : 'block';
            document.getElementById('icon-sound-off').style.display = Sound.muted ? 'block' : 'none';
            if (!Sound.muted) Sound.sfx.click();
        });

        document.getElementById('btn-play').addEventListener('click', startGame);
        document.getElementById('shop-btn').addEventListener('click', () => {
            Sound.sfx.click(); document.getElementById('hub-screen').classList.add('hidden'); document.getElementById('shop-screen').classList.remove('hidden'); renderShop();
        });
        document.getElementById('shop-close-btn').addEventListener('click', () => {
            Sound.sfx.click(); document.getElementById('shop-screen').classList.add('hidden'); document.getElementById('hub-screen').classList.remove('hidden');
        });
        
        document.getElementById('btn-reset-all').addEventListener('click', () => {
            if(confirm('Точно сбросить ВЕСЬ прогресс?')) {
                localStorage.clear();
                location.reload();
            }
        });

        document.getElementById('resume-btn').addEventListener('click', () => { Sound.sfx.click(); togglePause(); });
        document.getElementById('menu-btn-pause').addEventListener('click', goToHub);
        document.getElementById('term-menu-btn').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); goToHub(); });
        document.getElementById('term-restart-btn').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); restartGame(); });
        document.getElementById('game-over-screen').addEventListener('click', (e) => { if (e.target.id === 'game-over-screen' && gameState === 'gameover') restartGame(); });

        function startGame() {
            Sound.sfx.start(); setTimeout(() => Sound.music.start(), 700);
            document.getElementById('hub-screen').classList.add('hidden');
            resetGame(); gameState = 'playing';
        }

        function goToHub() {
            Sound.sfx.click(); Sound.music.stop();
            gameState = 'hub'; resetGame();
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hub-screen').classList.remove('hidden');
            updateCoinUI();
        }

        function restartGame() {
            if (gameState !== 'gameover') return;
            termGeneration++; Sound.sfx.click(); 
            document.getElementById('game-over-screen').classList.add('hidden');
            resetGame(); gameState = 'playing'; Sound.music.start();
        }

        function clampPlayer() { if (player.x < 0) player.x = 0; if (player.x + player.width > W) player.x = W - player.width; }
        
        function spawnParticles(x, y, colors, count) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
                particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, life: 1, decay: 0.02 + Math.random()*0.03, color: colors[(Math.random()*colors.length)|0], size: 2 + Math.random()*5 });
            }
        }

        function spawnObject() {
            objectSpawnCount++;
            let type = 'rotten'; 
            if (objectSpawnCount >= 6) { type = 'red'; objectSpawnCount = 0; } 
            else {
                const rand = Math.random();
                if (rand > 0.35) type = 'carrot';
                else if (rand > 0.95) type = 'golden'; 
            }
            let speedMultiplier = 1;
            if (shopItems['slowStart'] && score < 100) speedMultiplier = 0.7;

            objects.push({
                x: Math.random() * (W - 40), y: -40, width: 40, height: 40,
                speed: ((3 + Math.random()*2.5) + difficulty * 0.6) * speedMultiplier, 
                type: type, wobble: Math.random() * Math.PI * 2
            });
        }

        function drawObjects() {
            for (const obj of objects) {
                const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                ctx.save(); ctx.translate(cx, cy);
                ctx.shadowBlur = 15;
                if (obj.type === 'carrot') ctx.shadowColor = '#FF8C00';
                else if (obj.type === 'golden') ctx.shadowColor = '#FFD700';
                else if (obj.type === 'red') ctx.shadowColor = '#ff0000';
                else ctx.shadowColor = '#3a4b22'; 

                if (obj.type === 'carrot' || obj.type === 'golden' || obj.type === 'red') {
                    ctx.rotate(Math.sin(obj.wobble) * 0.15);
                    if (obj.type === 'red') {
                        ctx.fillStyle = '#ff2020'; ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(0,22); ctx.closePath(); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.fillRect(-2, -2, 4, 12); ctx.fillRect(-6, 2, 12, 4);
                    } else {
                        ctx.fillStyle = obj.type === 'golden' ? '#FFD700' : '#FF8C00';
                        ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(0,22); ctx.closePath(); ctx.fill();
                        ctx.fillStyle = obj.type === 'golden' ? '#FFF8DC' : '#FFA500';
                        ctx.beginPath(); ctx.moveTo(-5,-5); ctx.lineTo(5,-5); ctx.lineTo(0,18); ctx.closePath(); ctx.fill();
                    }
                    ctx.fillStyle = '#228B22'; ctx.fillRect(-10,-22,20,12);
                } else {
                    ctx.rotate(Math.sin(obj.wobble) * 0.2);
                    ctx.fillStyle = '#5c4a3d'; ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(12,-12); ctx.lineTo(-2,20); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#3e2e24'; ctx.fillRect(-4, -4, 6, 6);
                    ctx.fillStyle = '#4a5d23'; ctx.fillRect(-10,-22,20,12);
                }
                ctx.restore();
            }
        }

        function drawPlayer() {
            const bob = player.onGround ? Math.sin(frames * 0.1) * 3 : 0;
            const px = player.x, py = player.y + bob;
            const w = player.width, h = player.height;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(px + w/2, GROUND_Y + h + 5, w/2.5 * player.squash, 8 * player.stretch, 0, 0, Math.PI*2); ctx.fill();

            ctx.save();
            ctx.translate(px + w/2, py + h/2);
            ctx.scale(player.squash, player.stretch);
            ctx.translate(-(px + w/2), -(py + h/2));

            let currentSprite = null;
            
            // Строго берем картинки с гитхаба
            if (imgHit.complete && flash > 0 && imgHit.naturalWidth > 0) {
                currentSprite = imgHit;
            }
            else if (imgJump.complete && !player.onGround && imgJump.naturalWidth > 0) {
                currentSprite = imgJump;
            }
            else if (imgIdle.complete && imgIdle.naturalWidth > 0) {
                if (shopItems['skinMafia'] && imgHit.complete && imgHit.naturalWidth > 0) currentSprite = imgHit;
                else currentSprite = imgIdle;
            }

            if (currentSprite) {
                ctx.save(); ctx.beginPath(); ctx.arc(px + w/2, py + h/2, w/2, 0, Math.PI*2); ctx.clip();
                const imgRatio = currentSprite.width / currentSprite.height;
                let drawW = w, drawH = h; 
                if (imgRatio > 1) drawH = w / imgRatio; else drawW = h * imgRatio;
                ctx.drawImage(currentSprite, px + (w - drawW)/2, py + (h - drawH)/2, drawW, drawH);
                ctx.restore();
            } else {
                // Запасной векторный заяц (если файлы вообще не загрузились)
                ctx.fillStyle = '#8a8a8a'; ctx.fillRect(px, py, w, h);
                ctx.fillStyle = '#fff'; ctx.fillRect(px + 15, py + 20, 20, 22); ctx.fillRect(px + w - 35, py + 20, 20, 22);
                ctx.fillStyle = '#000'; ctx.fillRect(px + 20, py + 26, 10, 12); ctx.fillRect(px + w - 30, py + 26, 10, 12);
            }
            ctx.restore();
        }

        function drawBackground() {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGrad.addColorStop(0, '#4facfe'); skyGrad.addColorStop(1, '#00f2fe');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GROUND_Y);
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 40; ctx.shadowColor = '#FFD700';
            ctx.beginPath(); ctx.arc(W - 150, 100, 50, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            for (const c of clouds) {
                ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.scale, c.scale);
                ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.arc(35, -15, 25, 0, Math.PI*2); ctx.arc(70, 0, 30, 0, Math.PI*2); ctx.arc(35, 15, 30, 0, Math.PI*2); ctx.fill(); ctx.restore();
            }

            for (let i = 0; i < hills.length; i++) {
                const h = hills[i]; ctx.fillStyle = i % 2 === 0 ? '#75c95e' : '#56ab3e';
                ctx.beginPath(); ctx.moveTo(h.x, GROUND_Y); ctx.quadraticCurveTo(h.x + h.w/2, GROUND_Y - h.h, h.x + h.w, GROUND_Y); ctx.fill();
            }

            let groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            groundGrad.addColorStop(0, '#5c4033'); groundGrad.addColorStop(1, '#3e2723');
            ctx.fillStyle = groundGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, GROUND_Y, W, 15);
        }

        function update(dt) {
            for (const c of clouds) { c.x -= c.speed * dt; if (c.x < -200) { c.x = W + 200; c.y = 20 + Math.random() * 150; } }
            for (const h of hills) { h.x -= h.speed * dt; if (h.x + h.w < 0) { h.x = W + Math.random()*100; h.h = 150 + Math.random() * 100; } }
            
            if (gameState !== 'playing') return;
            frames += dt * 60;

            if (keys['ArrowLeft'] || keys['KeyA'] || btnLeft) player.x -= player.speed * dt * 60;
            if (keys['ArrowRight'] || keys['KeyD'] || btnRight) player.x += player.speed * dt * 60;
            clampPlayer();

            player.vy += GRAVITY * dt * 60;
            player.y += player.vy * dt * 60;

            if (!player.onGround) {
                player.stretch = Math.min(1.2, 1 + Math.abs(player.vy) * 0.015);
                player.squash = Math.max(0.8, 1 - Math.abs(player.vy) * 0.01);
            } else {
                player.squash += (1 - player.squash) * 0.2;
                player.stretch += (1 - player.stretch) * 0.2;
            }

            if (player.y >= GROUND_Y) {
                if (!player.onGround) { player.squash = 1.3; player.stretch = 0.7; }
                player.y = GROUND_Y; player.vy = 0; player.onGround = true;
            }

            difficulty = 1 + Math.floor(score / 100);
            if (difficulty > prevDifficulty) { Sound.sfx.boost(); prevDifficulty = difficulty; Sound.BPM = 115 + difficulty * 2; }

            spawnTimer += dt * 60;
            const spawnInterval = Math.max(16, 50 - difficulty * 4);
            if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnObject(); }

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i]; obj.y += obj.speed * dt * 60; obj.wobble += 0.1 * dt * 60;
                const hit = player.x < obj.x + obj.width && player.x + player.width > obj.x && player.y < obj.y + obj.height && player.y + player.height > obj.y;
                
                if (hit) {
                    const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                    if (obj.type === 'carrot' || obj.type === 'golden' || obj.type === 'red') {
                        carrotsCollected++;
                        if (obj.type === 'red') {
                            if (lives < (shopItems['extraLife'] ? 4 : 5)) { lives++; livesEl.innerText = lives; }
                            score += 25; Sound.sfx.powerup(); spawnParticles(cx, cy, ['#ff2020', '#fff'], 25);
                        } else {
                            combo++;
                            let gained = obj.type === 'golden' ? 50 : 10;
                            if (combo % 5 === 0) { Sound.sfx.powerup(); gained += combo * 2; spawnParticles(cx, cy, ['#FFD700','#fff'], 20); }
                            score += gained;
                        }
                        scoreEl.innerText = score;
                    } else { 
                        combo = 0; lives--; if (lives < 0) lives = 0; livesEl.innerText = lives;
                        Sound.sfx.hit(); spawnParticles(cx, cy, ['#5c4a3d','#ff4444'], 20);
                        screenShake = 15; flash = 0.5;
                        if (lives <= 0) gameOver();
                    }
                    objects.splice(i, 1); continue;
                }
                if (obj.y > H + 20) { objects.splice(i, 1); }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.25 * dt * 60; p.life -= p.decay * dt * 60;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (screenShake > 0) screenShake *= 0.88;
            if (flash > 0) flash = Math.max(0, flash - 0.04 * dt * 60);
        }

        function gameOver() {
            gameState = 'gameover';
            const isNewRecord = score > bestScore;
            if (isNewRecord) bestScore = score;
            
            coins += Math.floor(score / 10); saveData();

            document.getElementById('term-buttons').style.display = 'none';
            document.getElementById('game-over-screen').classList.remove('hidden');
            Sound.music.stop();
            if (isNewRecord) setTimeout(() => Sound.sfx.buy(), 600); else setTimeout(() => Sound.sfx.gameover(), 300);
            showTerminalGameOver(isNewRecord);
        }

        function showTerminalGameOver(isNewRecord) {
            termGeneration++; const gen = termGeneration;
            const lines = [
                '> GAME.EXE', '> system.halt();', '',
                `> SCORE: ${String(score).padStart(6, '0')}`,
                `> BEST:  ${String(bestScore).padStart(6, '0')}${isNewRecord ? '  ★ NEW! ★' : ''}`,
                '---------------------------',
                `> EATEN: ${carrotsCollected}`,
                `> MISSED: ${carrotsMissed}`,
                `> COINS: +${Math.floor(score / 10)}`,
                '', '> WAITING...', ''
            ];
            const container = document.getElementById('term-lines'); container.innerHTML = '';
            const cursorLine = document.createElement('div'); cursorLine.className = 'term-line';
            const cursor = document.createElement('span'); cursor.className = 'term-cursor'; cursorLine.appendChild(cursor); container.appendChild(cursorLine);
            let lineIdx = 0;
            function typeNextLine() {
                if (gen !== termGeneration || lineIdx >= lines.length) {
                    if (gen === termGeneration) document.getElementById('term-buttons').style.display = 'flex';
                    return;
                }
                const text = lines[lineIdx]; const lineEl = document.createElement('div'); lineEl.className = 'term-line';
                container.insertBefore(lineEl, cursorLine);
                if (text.length === 0) { lineIdx++; setTimeout(typeNextLine, 80); return; }
                let charIdx = 0;
                const interval = setInterval(() => {
                    if (gen !== termGeneration) { clearInterval(interval); return; }
                    charIdx++; lineEl.textContent = text.slice(0, charIdx);
                    if (charIdx >= text.length) { 
                        clearInterval(interval); Sound.tone({ freq: 1200, type: 'square', dur: 0.01, vol: 0.01 }); 
                        lineIdx++; setTimeout(typeNextLine, 50); 
                    }
                }, 15);
            }
            setTimeout(typeNextLine, 200);
        }

        function resetGame() {
            score = 0; lives = 3; if (shopItems['extraLife']) lives += 1;
            frames = 0; spawnTimer = 0; difficulty = 1; prevDifficulty = 1; combo = 0;
            carrotsCollected = 0; carrotsMissed = 0; objectSpawnCount = 0;
            objects = []; particles = []; screenShake = 0; flash = 0; btnLeft = btnRight = false;
            Sound.BPM = 115;
            player.x = W/2 - player.width/2; player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.squash = 1; player.stretch = 1;
            scoreEl.innerText = '0'; livesEl.innerText = lives;
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('term-lines').innerHTML = '';
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            
            drawBackground();
            if (gameState !== 'hub') { drawObjects(); drawPlayer(); }
            
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.restore();

            if (flash > 0) { ctx.fillStyle = `rgba(255,40,40,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
        }

        let lastTime = performance.now();
        function loop(now) {
            let dt = (now - lastTime) / 1000; lastTime = now; if (dt > 0.1) dt = 0.1;
            update(dt); draw();
            requestAnimationFrame(loop);
        }

        loadData();
        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
