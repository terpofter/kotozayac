<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Котозаяц: Прыжок в Кубы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00ffcc; --bg: #0f0f13; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Anton', Impact, 'Arial Black', sans-serif;
            overflow: hidden; touch-action: none; user-select: none;
            background-image: radial-gradient(circle at 50% 50%, #1e1e28 0%, #0f0f13 100%);
            letter-spacing: 1px;
        }
        #game-container {
            position: relative; width: 800px; height: 600px;
            max-width: 100%; max-height: 100%; aspect-ratio: 4/3;
            border: 4px solid #333; border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2), 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden; background: #87CEEB;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; align-items: center; gap: 8px; z-index: 10;
            pointer-events: none;
        }
        .hud-item {
            background: rgba(15, 15, 25, 0.85); padding: 8px 12px; border-radius: 10px;
            color: white; font-size: 20px; display: flex; align-items: center; gap: 6px;
            border: 2px solid rgba(0, 255, 204, 0.3); backdrop-filter: blur(8px);
        }
        .hud-icon { width: 22px; height: 22px; fill: currentColor; }
        .icon-carrot { color: #FF8C00; }
        .icon-heart { color: #ff4444; }
        .icon-coin { color: #FFD700; }
        .icon-clock { color: var(--neon); }
        
        .hud-btn {
            background: rgba(15, 15, 25, 0.85); border: 2px solid rgba(0, 255, 204, 0.3);
            color: var(--neon); width: 44px; height: 44px; border-radius: 10px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); transition: all 0.2s; pointer-events: auto; padding: 0;
        }
        .hud-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .hud-btn:active { transform: scale(0.9); }

        /* Оверлеи */
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 10, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; backdrop-filter: blur(10px);
            overflow-y: auto; padding: 20px;
        }
        .overlay.hidden { display: none !important; }
        
        h1 { color: var(--neon); font-size: 64px; text-shadow: 0 0 20px var(--neon); margin: 0 0 10px 0; text-align: center; letter-spacing: 4px; }
        h2 { color: #fff; font-size: 36px; text-shadow: 0 0 10px #fff; margin-bottom: 20px; letter-spacing: 2px; text-align: center; }
        .subtitle { color: #aaa; font-size: 20px; margin-bottom: 20px; letter-spacing: 2px; text-align: center; }
        
        .btn {
            background: linear-gradient(180deg, #00ffcc, #00b38f); color: #000;
            border: none; border-radius: 8px; padding: 15px 40px; font-size: 24px; 
            font-family: inherit; cursor: pointer; box-shadow: 0 6px 0 #005a47; transition: transform 0.1s; margin: 8px; text-align: center;
            text-transform: uppercase; position: relative; z-index: 30; width: 100%; max-width: 350px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #005a47; }
        .btn-secondary { background: linear-gradient(180deg, #555, #333); color: #fff; box-shadow: 0 6px 0 #111; font-size: 18px; padding: 12px 24px; }
        .btn-secondary:active { box-shadow: 0 0 0 #111; }
        .btn-danger { background: linear-gradient(180deg, #ff4444, #cc0000); color: #fff; box-shadow: 0 6px 0 #800000; font-size: 16px; padding: 10px 20px; max-width: 250px; }
        .btn-danger:active { box-shadow: 0 0 0 #800000; }
        
        /* АДМИН ПАНЕЛЬ */
        .admin-panel { background: rgba(20, 0, 0, 0.95); border: 2px solid #ff0000; border-radius: 16px; padding: 20px; max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .admin-btn { background: linear-gradient(180deg, #ff4444, #cc0000); color: #fff; border: none; border-radius: 8px; padding: 12px; font-family: inherit; font-size: 18px; cursor: pointer; text-transform: uppercase; }
        .admin-btn:active { transform: scale(0.95); }
        .admin-btn.active { background: linear-gradient(180deg, #44ff44, #00cc00); color: #000; box-shadow: 0 0 15px #44ff44; }

        /* ОКНО ПАРОЛЯ */
        #password-screen { background: rgba(0, 0, 0, 0.98); }
        .pass-input {
            padding: 15px; font-size: 32px; text-align: center; border-radius: 8px; 
            border: 3px solid #ff0000; background: rgba(0,0,0,0.8); color: #fff; 
            font-family: 'Anton', sans-serif; width: 100%; max-width: 300px; margin-bottom: 20px;
            outline: none; transition: border-color 0.2s;
        }
        .pass-input::placeholder { color: rgba(255, 0, 0, 0.5); font-size: 18px; }
        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        /* Мобильное управление */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 25px;
            z-index: 15; pointer-events: none; gap: 15px;
        }
        .control-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(0, 255, 204, 0.15); border: 3px solid rgba(0, 255, 204, 0.6);
            color: var(--neon); font-size: 32px; display: flex; justify-content: center; align-items: center;
            pointer-events: auto; user-select: none; backdrop-filter: blur(5px);
        }
        .control-btn:active { background: rgba(0, 255, 204, 0.5); }
        .control-btn.jump { background: rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.6); color: #FFD700; }
        .control-btn.jump:active { background: rgba(255, 215, 0, 0.5); }
        #mobile-controls.visible { display: flex; }

        /* Терминал */
        #game-over-screen { background: #000 !important; justify-content: flex-start !important; align-items: flex-start !important; padding: 40px 30px; }
        #terminal { font-family: 'Courier New', monospace; font-size: 18px; font-weight: bold; line-height: 1.8; color: #00ff41; text-shadow: 0 0 8px currentColor; animation: hueShift 6s linear infinite; width: 100%; letter-spacing: 0; display: flex; flex-direction: column; }
        @keyframes hueShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .term-line { margin: 0; min-height: 1.8em; white-space: pre-wrap; }
        .term-btn-group { margin-top: 30px; display: flex; gap: 15px; position: relative; z-index: 100; }
        .term-btn { background: rgba(0, 255, 65, 0.1); border: 2px solid #00ff41; color: #00ff41; padding: 12px 24px; font-family: inherit; font-size: 20px; cursor: pointer; text-transform: uppercase; pointer-events: auto; }
        .term-btn:hover { background: rgba(0, 255, 65, 0.3); }

        #cmd-art-container { margin-top: 20px; display: none; text-align: left; pointer-events: none; }
        #cmd-art { max-width: 120px; max-height: 120px; border-radius: 8px; filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(5) brightness(0.8); box-shadow: 0 0 10px #00ff41; border: 2px solid #00ff41; }

        /* МАГАЗИН И АЧИВКИ */
        .shop-balance { font-size: 28px; color: #FFD700; margin-bottom: 20px; text-shadow: 0 0 10px #FFD700; text-align: center; }
        #shop-items, #ach-items { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; max-width: 700px; margin-bottom: 20px; }
        .shop-item, .ach-item { display: flex; flex-direction: column; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 2px solid rgba(0, 255, 204, 0.2); width: 200px; text-align: center; }
        .shop-item-title, .ach-item-title { color: #fff; font-size: 18px; margin-bottom: 10px; }
        .shop-buy-btn, .ach-btn { background: linear-gradient(180deg, #FFD700, #FFA500); color: #000; border: none; border-radius: 8px; padding: 10px 20px; font-size: 16px; font-family: inherit; cursor: pointer; box-shadow: 0 4px 0 #b37400; width: 100%; margin-top: 10px; }
        .shop-buy-btn:active, .ach-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b37400; }
        .shop-buy-btn:disabled, .ach-btn:disabled { background: #444; color: #888; box-shadow: 0 4px 0 #222; cursor: not-allowed; transform: none; }
        .shop-buy-btn.equipped { background: #00ffcc; box-shadow: 0 4px 0 #005a47; color: #000; }
        .ach-btn.claimed { background: #00ffcc; box-shadow: 0 4px 0 #005a47; color: #000; }
        
        @media (max-width: 600px) {
            h1 { font-size: 40px; } h2 { font-size: 28px; }
            .subtitle { font-size: 16px; }
            .hud-item { font-size: 14px; padding: 6px 8px; gap: 4px; }
            .hud-icon { width: 16px; height: 16px; }
            .hud-btn { width: 34px; height: 34px; }
            .hud-btn svg { width: 16px; height: 16px; }
            .btn { font-size: 18px; padding: 12px 24px; }
            #game-over-screen { padding: 25px 15px; }
            #terminal { font-size: 14px; }
            .term-btn { font-size: 16px; padding: 10px 16px; }
            #cmd-art { max-width: 80px; max-height: 80px; }
            .shop-item, .ach-item { width: 45%; padding: 10px; }
            .shop-item-title, .ach-item-title { font-size: 14px; }
            .shop-buy-btn, .ach-btn { font-size: 14px; padding: 8px 10px; }
            .admin-panel { padding: 15px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
            <div class="hud-item"><svg class="hud-icon icon-carrot" viewBox="0 0 24 24"><path d="M17.7,2.7c-0.8-0.8-2-0.8-2.8,0L9,8.6C7.8,9.8,7,11.3,6.6,13l-2.2,8.3c-0.1,0.6,0.4,1.1,1,1l8.3-2.2 c1.7-0.4,3.2-1.2,4.4-2.4l5.9-5.9c0.8-0.8,0.8-2,0-2.8L17.7,2.7z M5.1,19.3l1.4-5.4c0.2-0.9,0.7-1.7,1.3-2.4l4.8-4.8 l3.3,3.3l-4.8,4.8c-0.7,0.7-1.5,1.1-2.4,1.3L5.1,19.3z M8.5,2.5c1.4-0.4,2.9-0.4,4.3,0l-3,3C9.3,4.2,8.7,3.4,8.5,2.5z M21.5,15.5c-0.4,1.4-0.4,2.9,0,4.3l-3-3C19.3,16.3,20.1,15.7,21.5,15.5z"/></svg><span id="score">0</span></div>
            <div class="hud-item"><svg class="hud-icon icon-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span id="lives">3</span></div>
            <div class="hud-item"><svg class="hud-icon icon-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6v12m-4-6h8" stroke="currentColor" stroke-width="2"/></svg><span id="coins">0</span></div>
            
            <div class="hud-item" style="border-color: rgba(0, 255, 204, 0.6); box-shadow: 0 0 10px rgba(0,255,204,0.2);">
                <svg class="hud-icon icon-clock" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <span id="clock-msk">00:00</span>
            </div>

            <div style="flex:1"></div>
            
            <button id="btn-mute" class="hud-btn" title="Звук">
                <svg id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <button id="btn-pause" class="hud-btn" title="Пауза"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
        </div>

        <div id="hub-screen" class="overlay">
            <h1>КОТОЗАЯЦ</h1>
            <div class="subtitle">ГЛАВНОЕ МЕНЮ</div>
            <button id="btn-play" class="btn">ПРЫЖОК В КУБЫ</button>
            <button id="shop-btn" class="btn" style="background: linear-gradient(180deg, #FFD700, #FFA500); color: #000; box-shadow: 0 6px 0 #b37400;">🛒 МАГАЗИН</button>
            <button id="ach-btn" class="btn" style="background: linear-gradient(180deg, #00ffcc, #00b38f); color: #000; box-shadow: 0 6px 0 #005a47;">🏆 АЧИВКИ</button>
            <button id="btn-reset-all" class="btn btn-danger">СБРОСИТЬ ВСЁ</button>
        </div>

        <div id="shop-screen" class="overlay hidden">
            <h2>МАГАЗИН И СКИНЫ</h2>
            <div class="shop-balance">Баланс: <span id="shop-coins">0</span> 🥕</div>
            <div id="shop-items"></div>
            <button id="shop-close-btn" class="btn">НАЗАД</button>
        </div>

        <div id="ach-screen" class="overlay hidden">
            <h2>ДОСТИЖЕНИЯ</h2>
            <div class="shop-balance">Баланс: <span id="ach-coins">0</span> 🥕</div>
            <div id="ach-items"></div>
            <button id="ach-close-btn" class="btn">НАЗАД</button>
        </div>

        <!-- ОКНО ВВОДА ПАРОЛЯ -->
        <div id="password-screen" class="overlay hidden">
            <h2 style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">СЕКРЕТНАЯ КОМНАТА</h2>
            <input type="password" id="pass-input" class="pass-input" inputmode="numeric" placeholder="ВВЕДИ ПАРОЛЬ" autocomplete="off">
            <button id="pass-submit" class="btn" style="background: linear-gradient(180deg, #ff4444, #cc0000); box-shadow: 0 6px 0 #800000; color: #fff; max-width: 300px;">ВОЙТИ</button>
            <button id="pass-cancel" class="btn btn-secondary" style="max-width: 300px;">ОТМЕНА</button>
        </div>

        <!-- АДМИН ПАНЕЛЬ -->
        <div id="admin-screen" class="overlay hidden">
            <h2 style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">ADMIN PANEL</h2>
            <div class="admin-panel">
                <button id="adm-god" class="admin-btn">Бессмертие: ВЫКЛ</button>
                <button id="adm-coins" class="admin-btn">+ 1 000 000 Монет</button>
                <button id="adm-hack" class="admin-btn">Взломать всё (Ачивки + Скины)</button>
                <button id="adm-day" class="admin-btn">Принудительный ДЕНЬ</button>
                <button id="adm-night" class="admin-btn">Принудительная НОЧЬ</button>
                <button id="adm-auto" class="admin-btn">Вернуть реальное время</button>
            </div>
            <button id="admin-close-btn" class="btn btn-secondary" style="margin-top: 20px;">ЗАКРЫТЬ</button>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h2>ПАУЗА</h2>
            <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
            <button id="menu-btn-pause" class="btn btn-secondary">В ГЛАВНОЕ МЕНЮ</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <div id="terminal">
                <div id="term-lines"></div>
                <div class="term-btn-group" id="term-buttons" style="display:none;">
                    <button class="term-btn" id="term-restart-btn">Заново</button>
                    <button class="term-btn" id="term-menu-btn">В меню</button>
                </div>
                <div id="cmd-art-container"><img src="cat.png" id="cmd-art" alt="System Cat"></div>
            </div>
        </div>

        <div id="mobile-controls">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn jump" id="btn-jump">▲</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
    </div>

    <script>
        // ============ СЕКРЕТНЫЙ КОД (3 КЛИКА НА СБРОС) ============
        let resetClickCount = 0;
        let resetClickTimer = null;

        document.getElementById('btn-reset-all').addEventListener('click', () => {
            resetClickCount++;
            
            if (resetClickCount === 1) {
                // Если это первый клик, ставим таймер на 600мс. 
                // Если за это время не будет еще кликов — сбрасываем игру.
                resetClickTimer = setTimeout(() => {
                    if (confirm('Точно сбросить ВЕСЬ прогресс?')) { 
                        localStorage.clear(); 
                        location.reload(); 
                    }
                    resetClickCount = 0;
                }, 600);
            } 
            else if (resetClickCount === 3) {
                // Если успели кликнуть 3 раза — отменяем сброс и открываем окно пароля
                clearTimeout(resetClickTimer);
                resetClickCount = 0;
                
                Sound.sfx.click();
                document.getElementById('hub-screen').classList.add('hidden');
                document.getElementById('password-screen').classList.remove('hidden');
                document.getElementById('pass-input').value = '';
                document.getElementById('pass-input').focus();
            }
        });

        // Проверка пароля
        document.getElementById('pass-submit').addEventListener('click', checkPassword);
        document.getElementById('pass-input').addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') checkPassword(); 
        });

        function checkPassword() {
            const val = document.getElementById('pass-input').value;
            const inp = document.getElementById('pass-input');
            
            if (val === '589') {
                document.getElementById('password-screen').classList.add('hidden');
                document.getElementById('admin-screen').classList.remove('hidden');
                Sound.sfx.buy();
            } else {
                // Ошибка: трясем поле и очищаем
                Sound.sfx.hit();
                inp.classList.add('shake');
                inp.style.borderColor = '#fff';
                setTimeout(() => {
                    inp.classList.remove('shake');
                    inp.style.borderColor = '#ff0000';
                    inp.value = '';
                    inp.placeholder = 'НЕВЕРНО';
                }, 400);
            }
        }

        document.getElementById('pass-cancel').addEventListener('click', () => {
            document.getElementById('password-screen').classList.add('hidden');
            document.getElementById('hub-screen').classList.remove('hidden');
        });

        // ============ ВРЕМЯ И СЕЗОНЫ ============
        let isNight = false;
        let currentSeason = 'summer';
        let forceTime = null; // null, 'day', 'night'
        let godMode = false;

        function updateMoscowClock() {
            const now = new Date();
            const mskOffset = 3 * 60 * 60 * 1000; 
            const mskTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + mskOffset);
            
            const hours = mskTime.getHours();
            const minutes = mskTime.getMinutes();
            const seconds = mskTime.getSeconds();
            const month = mskTime.getMonth();
            
            document.getElementById('clock-msk').innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (forceTime === 'day') isNight = false;
            else if (forceTime === 'night') isNight = true;
            else isNight = (hours >= 22 || hours < 10);

            if (month === 11 || month === 0 || month === 1) currentSeason = 'winter';
            else if (month >= 2 && month <= 4) currentSeason = 'spring';
            else if (month >= 5 && month <= 7) currentSeason = 'summer';
            else currentSeason = 'autumn';
        }
        
        setInterval(updateMoscowClock, 1000);
        updateMoscowClock(); 

        // ============ ЗВУК ============
        const Sound = {
            ctx: null, master: null, musicGain: null, sfxGain: null, noiseBuffer: null, muted: false,
            musicVolume: 0.3, sfxVolume: 0.6, musicPlaying: false, musicTimer: null, nextNoteTime: 0, step: 0, BPM: 115,
            init() {
                if (this.ctx) return;
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
                this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(this.ctx.destination);
                this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = this.musicVolume; this.musicGain.connect(this.master);
                this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVolume; this.sfxGain.connect(this.master);

                else if (rand > 0.95) type = 'golden'; 
                else if (rand > 0.9) type = 'magnet';
                else if (rand > 0.85) type = 'shield';
            }
            let speedMultiplier = 1; if (shopItems['slowStart'] && score < 100) speedMultiplier = 0.7;

            objects.push({ x: Math.random() * (W - 40), y: -40, width: 40, height: 40, speed: ((3 + Math.random()*2.5) + difficulty * 0.6) * speedMultiplier, type: type, wobble: Math.random() * Math.PI * 2 });
        }

        function drawObjects() {
            for (const obj of objects) {
                const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                ctx.save(); ctx.translate(cx, cy);
                ctx.shadowBlur = 15;
                if (obj.type === 'carrot') ctx.shadowColor = '#FF8C00';
                else if (obj.type === 'golden') ctx.shadowColor = '#FFD700';
                else if (obj.type === 'red') ctx.shadowColor = '#ff0000';
                else if (obj.type === 'magnet') ctx.shadowColor = '#0088ff';
                else if (obj.type === 'shield') ctx.shadowColor = '#00ffcc';
                else ctx.shadowColor = '#3a4b22'; 

                if (obj.type === 'carrot' || obj.type === 'golden' || obj.type === 'red') {
                    ctx.rotate(Math.sin(obj.wobble) * 0.15);
                    if (obj.type === 'red') {
                        ctx.fillStyle = '#ff2020'; ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(0,22); ctx.closePath(); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.fillRect(-2, -2, 4, 12); ctx.fillRect(-6, 2, 12, 4);
                    } else {
                        ctx.fillStyle = obj.type === 'golden' ? '#FFD700' : '#FF8C00'; ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(0,22); ctx.closePath(); ctx.fill();
                        ctx.fillStyle = obj.type === 'golden' ? '#FFF8DC' : '#FFA500'; ctx.beginPath(); ctx.moveTo(-5,-5); ctx.lineTo(5,-5); ctx.lineTo(0,18); ctx.closePath(); ctx.fill();
                    }
                    ctx.fillStyle = '#228B22'; ctx.fillRect(-10,-22,20,12);
                } else if (obj.type === 'magnet') {
                    ctx.fillStyle = '#0055aa'; ctx.fillRect(-15,-15,30,30);
                    ctx.fillStyle = '#0088ff'; ctx.fillRect(-10,-10,20,20);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('U', 0, 0);
                } else if (obj.type === 'shield') {
                    ctx.fillStyle = '#005544'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#00ffcc'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(0,6); ctx.moveTo(-4,-2); ctx.lineTo(0,6); ctx.lineTo(4,-2); ctx.stroke();
                } else {
                    ctx.rotate(Math.sin(obj.wobble) * 0.2);
                    ctx.fillStyle = '#5c4a3d'; ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(12,-12); ctx.lineTo(-2,20); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#3e2e24'; ctx.fillRect(-4, -4, 6, 6);
                    ctx.fillStyle = '#4a5d23'; ctx.fillRect(-10,-22,20,12);
                }
                ctx.restore();
            }
        }

        function drawPlayer() {
            for(let i=0; i<trail.length; i++) {
                let t = trail[i]; let alpha = (i / trail.length) * 0.5;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = player.hasShield ? '#00ffcc' : '#fff';
                ctx.fillRect(t.x + 20, t.y + 20, 40, 40);
            }
            ctx.globalAlpha = 1;

            const bob = player.onGround ? Math.sin(frames * 0.1) * 3 : 0;
            const px = player.x, py = player.y + bob; const w = player.width, h = player.height;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(px + w/2, GROUND_Y + h + 5, w/2.5 * player.squash, 8 * player.stretch, 0, 0, Math.PI*2); ctx.fill();

            if (player.hasShield) {
                ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 4;
                ctx.shadowBlur = 20; ctx.shadowColor = '#00ffcc';
                ctx.beginPath(); ctx.arc(px + w/2, py + h/2, w/2 + 10, 0, Math.PI*2); ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.save();
            ctx.translate(px + w/2, py + h/2); ctx.scale(player.squash, player.stretch); ctx.translate(-(px + w/2), -(py + h/2));

            let currentSprite = null; const skinImgs = IMAGES[activeSkin] || IMAGES.classic;
            if (flash > 0 && skinImgs.hit.complete && skinImgs.hit.naturalWidth > 0) currentSprite = skinImgs.hit; 
            else if (!player.onGround && skinImgs.jump.complete && skinImgs.jump.naturalWidth > 0) currentSprite = skinImgs.jump; 
            else if (skinImgs.idle.complete && skinImgs.idle.naturalWidth > 0) currentSprite = skinImgs.idle; 

            if (currentSprite) {
                const imgRatio = currentSprite.width / currentSprite.height; let drawW = w, drawH = h; 
                if (imgRatio > 1) drawH = w / imgRatio; else drawW = h * imgRatio;
                ctx.drawImage(currentSprite, px + (w - drawW)/2, py + (h - drawH)/2, drawW, drawH);
            } else {
                ctx.fillStyle = '#8a8a8a'; ctx.fillRect(px, py, w, h); ctx.fillStyle = '#fff'; ctx.fillRect(px + 15, py + 20, 20, 22); ctx.fillRect(px + w - 35, py + 20, 20, 22);
            }
            ctx.restore();
        }

        function drawBackground() {
            if (isNight) {
                let skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y); skyGrad.addColorStop(0, '#0a0f24'); skyGrad.addColorStop(1, '#1a2245');
                ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GROUND_Y);
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 60; i++) {
                    let sx = (i * 137) % W; let sy = (i * 73) % (GROUND_Y - 100);
                    if (Math.sin(frames * 0.05 + i) > 0) { ctx.globalAlpha = 0.5 + Math.sin(frames * 0.1 + i) * 0.5; ctx.fillRect(sx, sy, 2, 2); }
                }
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#e2e8f0'; ctx.shadowBlur = 40; ctx.shadowColor = '#a0aec0';
                ctx.beginPath(); ctx.arc(W - 150, 100, 50, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
            } else {
                let skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y); skyGrad.addColorStop(0, '#4facfe'); skyGrad.addColorStop(1, '#00f2fe');
                ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GROUND_Y);
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 40; ctx.shadowColor = '#FFD700';
                ctx.beginPath(); ctx.arc(W - 150, 100, 50, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
            }

            for (const c of clouds) { ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.scale, c.scale); ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.arc(35, -15, 25, 0, Math.PI*2); ctx.arc(70, 0, 30, 0, Math.PI*2); ctx.arc(35, 15, 30, 0, Math.PI*2); ctx.fill(); ctx.restore(); }

            for (let i = 0; i < hills.length; i++) {
                const h = hills[i]; 
                if (isNight) { ctx.fillStyle = i % 2 === 0 ? '#1c2e1e' : '#132215'; } else { ctx.fillStyle = i % 2 === 0 ? '#75c95e' : '#56ab3e'; }
                ctx.beginPath(); ctx.moveTo(h.x, GROUND_Y); ctx.quadraticCurveTo(h.x + h.w/2, GROUND_Y - h.h, h.x + h.w, GROUND_Y); ctx.fill();
            }

            let groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            if (isNight) { groundGrad.addColorStop(0, '#2b1d14'); groundGrad.addColorStop(1, '#0f0806'); } else { groundGrad.addColorStop(0, '#5c4033'); groundGrad.addColorStop(1, '#3e2723'); }
            ctx.fillStyle = groundGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.fillStyle = isNight ? '#215c2c' : '#4CAF50'; ctx.fillRect(0, GROUND_Y, W, 15);

            if (currentSeason === 'winter') { ctx.fillStyle = 'rgba(255,255,255,0.8)'; weather.forEach(w => { ctx.beginPath(); ctx.arc(w.x, w.y, w.size, 0, Math.PI*2); ctx.fill(); }); }
            else if (currentSeason === 'autumn') { ctx.fillStyle = 'rgba(255,165,0,0.8)'; weather.forEach(w => { ctx.fillRect(w.x, w.y, w.size, w.size); }); }
            else if (currentSeason === 'spring') { ctx.fillStyle = 'rgba(255,182,193,0.8)'; weather.forEach(w => { ctx.beginPath(); ctx.arc(w.x, w.y, w.size, 0, Math.PI*2); ctx.fill(); }); }
            else { ctx.fillStyle = 'rgba(255,255,255,0.3)'; weather.forEach(w => { ctx.fillRect(w.x, w.y, w.size, w.size); }); }
        }

        function update(dt) {
            for (const c of clouds) { c.x -= c.speed * dt; if (c.x < -200) { c.x = W + 200; c.y = 20 + Math.random() * 150; } }
            for (const h of hills) { h.x -= h.speed * dt; if (h.x + h.w < 0) { h.x = W + Math.random()*100; h.h = 150 + Math.random() * 100; } }
            
            if (gameState === 'dying') {
                deathTimer += dt * 60;
                if (giantCarrot) {
                    giantCarrot.y += giantCarrot.vy * dt * 60;
                    if (giantCarrot.y + giantCarrot.height/2 > player.y + player.height - 30) {
                        giantCarrot.y = player.y + player.height - 30 - giantCarrot.height/2; giantCarrot = null;
                        screenShake = 30; flash = 1; Sound.sfx.smash(); spawnParticles(player.x + player.width/2, player.y + player.height - 20, ['#5c4a3d','#ff4444','#3a4b22'], 40);
                        setTimeout(() => { if(gameState === 'dying') gameOver(); }, 1000);
                    }
                }
                if (screenShake > 0) screenShake *= 0.9;
                if (flash > 0) flash -= 0.02 * dt * 60;
                return; 
            }

            if (gameState !== 'playing') return;
            frames += dt * 60;

            if (frames % 2 === 0) {
                trail.push({ x: player.x, y: player.y });
                if (trail.length > 10) trail.shift();
            }

            if (keys['ArrowLeft'] || keys['KeyA'] || btnLeft) player.x -= player.speed * dt * 60;
            if (keys['ArrowRight'] || keys['KeyD'] || btnRight) player.x += player.speed * dt * 60;
            clampPlayer();

            player.vy += GRAVITY * dt * 60; player.y += player.vy * dt * 60;
            if (!player.onGround) { player.stretch = Math.min(1.2, 1 + Math.abs(player.vy) * 0.015); player.squash = Math.max(0.8, 1 - Math.abs(player.vy) * 0.01); } 
            else { player.squash += (1 - player.squash) * 0.2; player.stretch += (1 - player.stretch) * 0.2; }

            if (player.y >= GROUND_Y) { if (!player.onGround) { player.squash = 1.3; player.stretch = 0.7; } player.y = GROUND_Y; player.vy = 0; player.onGround = true; }

            if (player.magnetTimer > 0) player.magnetTimer -= dt;

            if (Math.random() < 0.1) {
                let color = 'white', size = 2, speed = 2;
                if (currentSeason === 'autumn') { color = '#ff8c00'; size = 4; speed = 3; }
                else if (currentSeason === 'spring') { color = '#ffb6c1'; size = 3; speed = 2.5; }
                else if (currentSeason === 'winter') { color = 'white'; size = 3; speed = 4; }
                weather.push({ x: Math.random() * W, y: -10, size: size, speed: speed, drift: (Math.random()-0.5)*2 });
            }
            for (let i = weather.length - 1; i >= 0; i--) {
                let w = weather[i]; w.y += w.speed; w.x += w.drift;
                if (w.y > H) weather.splice(i, 1);
            }

            if (score >= nextBossScore && !boss && gameState === 'playing') {
                boss = { x: W/2 - 100, y: -200, width: 200, height: 200, hp: 3, timer: 0, dir: 1 };
                Sound.music.stop(); Sound.sfx.bossHit();
            }

            if (boss) {
                boss.x += 3 * boss.dir * dt * 60;
                if (boss.x > W - boss.width) boss.dir = -1;
                if (boss.x < 0) boss.dir = 1;
                
                boss.timer += dt * 60;
                if (boss.timer > 90) {
                    boss.timer = 0;
                    objects.push({ x: boss.x + boss.width/2 - 20, y: boss.y + boss.height, width: 40, height: 40, speed: 6, type: 'rotten', wobble: 0 });
                    Sound.sfx.hit();
                }
            }

            difficulty = 1 + Math.floor(score / 100);
            if (difficulty > prevDifficulty) { Sound.sfx.powerup(); prevDifficulty = difficulty; Sound.BPM = 115 + difficulty * 2; }

            spawnTimer += dt * 60;
            if (!boss && spawnTimer >= Math.max(16, 50 - difficulty * 4)) { spawnTimer = 0; spawnObject(); }

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i]; 
                
                if (player.magnetTimer > 0 && (obj.type === 'carrot' || obj.type === 'golden' || obj.type === 'red')) {
                    let dx = (player.x + player.width/2) - (obj.x + obj.width/2);
                    let dy = (player.y + player.height/2) - (obj.y + obj.height/2);
                    let dist = Math.hypot(dx, dy);
                    if (dist > 0) { obj.x += (dx/dist) * 15; obj.y += (dy/dist) * 15; }
                } else {
                    obj.y += obj.speed * dt * 60; 
                    obj.wobble += 0.1 * dt * 60;
                }

                const hit = player.x < obj.x + obj.width && player.x + player.width > obj.x && player.y < obj.y + obj.height && player.y + player.height > obj.y;
                
                if (hit) {
                    const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                    if (obj.type === 'carrot' || obj.type === 'golden' || obj.type === 'red') {
                        carrotsCollected++; totalCarrots++;
                        if (obj.type === 'red') {
                            if (lives < (shopItems['extraLife'] ? 4 : 5)) { lives++; livesEl.innerText = lives; }
                            score += 25; Sound.sfx.powerup(); spawnParticles(cx, cy, ['#ff2020', '#fff'], 25);
                        } else {
                            combo++;
                            let gained = obj.type === 'golden' ? 50 : 10;
                            if (combo % 5 === 0) { Sound.sfx.powerup(); gained += combo * 2; spawnParticles(cx, cy, ['#FFD700','#fff'], 20); }
                            score += gained;
                        }
                        scoreEl.innerText = score;
                    } else if (obj.type === 'magnet') {
                        player.magnetTimer = 8; Sound.sfx.buy();
                        spawnParticles(cx, cy, ['#0088ff', '#fff'], 20);
                    } else if (obj.type === 'shield') {
                        player.hasShield = true; Sound.sfx.buy();
                        spawnParticles(cx, cy, ['#00ffcc', '#fff'], 20);
                    } else { 
                        if (player.hasShield) {
                            player.hasShield = false;
                            Sound.sfx.powerup(); spawnParticles(cx, cy, ['#00ffcc', '#fff'], 20);
                            screenShake = 10;
                        } else if (!godMode) {
                            combo = 0; lives--; if (lives < 0) lives = 0; livesEl.innerText = lives;
                            Sound.sfx.hit(); spawnParticles(cx, cy, ['#5c4a3d','#ff4444'], 20);
                            screenShake = 15; flash = 0.5;
                            if (lives <= 0) triggerDeathAnimation();
                        } else {
                            Sound.sfx.hit(); screenShake = 5;
                        }
                    }
                    objects.splice(i, 1); continue;
                }
                if (obj.y > H + 20) { objects.splice(i, 1); }
            }

            if (boss) {
                const hitBoss = player.x < boss.x + boss.width && player.x + player.width > boss.x && player.y < boss.y + boss.height && player.y + player.height > boss.y;
                if (hitBoss) {
                    if (player.vy > 0 && player.y + player.height < boss.y + boss.height / 2) {
                        boss.hp--;
                        player.vy = -12; 
                        Sound.sfx.hit();
                        screenShake = 10;
                        spawnParticles(boss.x + boss.width/2, boss.y + boss.height/2, ['#ff0000', '#ffaa00'], 30);
                        
                        if (boss.hp <= 0) {
                            score += 500; coins += 100;
                            achievements['boss1'] = true;
                            nextBossScore += 1000;
                            boss = null;
                            screenShake = 30; flash = 1;
                            Sound.sfx.smash();
                            Sound.music.start();
                            saveData();
                        }
                    } else {
                        if (player.hasShield) {
                            player.hasShield = false;
                            Sound.sfx.powerup();
                            spawnParticles(player.x, player.y, ['#00ffcc', '#fff'], 20);
                        } else if (!godMode) {
                            lives--; if (lives < 0) lives = 0; livesEl.innerText = lives;
                            Sound.sfx.hit(); screenShake = 15; flash = 0.5;
                            if (lives <= 0) triggerDeathAnimation();
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.25 * dt * 60; p.life -= p.decay * dt * 60;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (screenShake > 0) screenShake *= 0.88;
            if (flash > 0) flash = Math.max(0, flash - 0.04 * dt * 60);
        }

        function triggerDeathAnimation() {
            if (godMode) return;
            gameState = 'dying'; deathTimer = 0; Sound.music.stop(); Sound.sfx.drop(); 
            giantCarrot = { x: player.x + player.width/2 - 100, y: -300, width: 200, height: 200, vy: 10 };
        }

        function gameOver() {
            gameState = 'gameover';
            const isNewRecord = score > bestScore;
            if (isNewRecord) bestScore = score;
            totalDeaths++;
            
            coins += Math.floor(score / 10); saveData();

            document.getElementById('term-buttons').style.display = 'none';
            document.getElementById('cmd-art-container').style.display = 'none';
            document.getElementById('game-over-screen').classList.remove('hidden');
            if (isNewRecord) setTimeout(() => Sound.sfx.buy(), 600); else setTimeout(() => Sound.sfx.gameover(), 300);
            showTerminalGameOver(isNewRecord);
        }

        function showTerminalGameOver(isNewRecord) {
            termGeneration++; const gen = termGeneration;
            const lines = [
                '> GAME.EXE', '> system.halt();', '',
                `> SCORE: ${String(score).padStart(6, '0')}`,
                `> BEST:  ${String(bestScore).padStart(6, '0')}${isNewRecord ? '  ★ NEW! ★' : ''}`,
                '---------------------------',
                `> EATEN: ${carrotsCollected}`,
                `> MISSED: ${carrotsMissed}`,
                `> COINS: +${Math.floor(score / 10)}`,
                '', '> WAITING...', ''
            ];
            const container = document.getElementById('term-lines'); container.innerHTML = '';
            const cursorLine = document.createElement('div'); cursorLine.className = 'term-line';
            const cursor = document.createElement('span'); cursor.className = 'term-cursor'; cursorLine.appendChild(cursor); container.appendChild(cursorLine);
            let lineIdx = 0;
            function typeNextLine() {
                if (gen !== termGeneration || lineIdx >= lines.length) {
                    if (gen === termGeneration) {
                        document.getElementById('term-buttons').style.display = 'flex';
                        document.getElementById('cmd-art-container').style.display = 'block';
                    }
                    return;
                }
                const text = lines[lineIdx]; const lineEl = document.createElement('div'); lineEl.className = 'term-line';
                container.insertBefore(lineEl, cursorLine);
                if (text.length === 0) { lineIdx++; setTimeout(typeNextLine, 80); return; }
                let charIdx = 0;
                const interval = setInterval(() => {
                    if (gen !== termGeneration) { clearInterval(interval); return; }
                    charIdx++; lineEl.textContent = text.slice(0, charIdx);
                    if (charIdx >= text.length) { 
                        clearInterval(interval); Sound.tone({ freq: 1200, type: 'square', dur: 0.01, vol: 0.01 }); 
                        lineIdx++; setTimeout(typeNextLine, 50); 
                    }
                }, 15);
            }
            setTimeout(typeNextLine, 200);
        }

        function resetGame() {
            score = 0; lives = 3; if (shopItems['extraLife']) lives += 1;
            if (godMode) lives = 999;
            frames = 0; spawnTimer = 0; difficulty = 1; prevDifficulty = 1; combo = 0;
            carrotsCollected = 0; carrotsMissed = 0; objectSpawnCount = 0;
            objects = []; particles = []; screenShake = 0; flash = 0; btnLeft = btnRight = false;
            giantCarrot = null; deathTimer = 0; boss = null; nextBossScore = 500; trail = [];
            player.magnetTimer = 0; player.hasShield = false;
            Sound.BPM = 115;
            player.x = W/2 - player.width/2; player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.squash = 1; player.stretch = 1;
            scoreEl.innerText = '0'; livesEl.innerText = lives;
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('cmd-art-container').style.display = 'none';
            document.getElementById('term-lines').innerHTML = '';
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            
            drawBackground();
            if (gameState !== 'hub') { 
                drawObjects(); 
                drawPlayer(); 
                
                if (boss) {
                    ctx.save(); ctx.translate(boss.x + boss.width/2, boss.y + boss.height/2);
                    ctx.shadowBlur = 30; ctx.shadowColor = '#ff0000';
                    ctx.fillStyle = '#8B0000'; ctx.beginPath(); ctx.moveTo(-80,-100); ctx.lineTo(80,-100); ctx.lineTo(0,100); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.moveTo(-60,-80); ctx.lineTo(60,-80); ctx.lineTo(0,80); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#228B22'; ctx.fillRect(-100,-180,200,80);
                    ctx.fillStyle = '#fff'; ctx.fillRect(-50,-40,40,40); ctx.fillRect(10,-40,40,40);
                    ctx.fillStyle = '#000'; ctx.fillRect(-40,-30,20,20); ctx.fillRect(20,-30,20,20);
                    ctx.fillStyle = '#333'; ctx.fillRect(-60, 120, 120, 15);
                    ctx.fillStyle = '#ff0000'; ctx.fillRect(-60, 120, 120 * (boss.hp/3), 15);
                    ctx.restore();
                }

                if (gameState === 'dying' && giantCarrot) {
                    ctx.save(); ctx.translate(giantCarrot.x + giantCarrot.width/2, giantCarrot.y + giantCarrot.height/2);
                    ctx.shadowBlur = 30; ctx.shadowColor = '#ff0000'; ctx.fillStyle = '#5c4a3d';
                    ctx.beginPath(); ctx.moveTo(-80,-80); ctx.lineTo(120,-120); ctx.lineTo(-20,200); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#3e2e24'; ctx.fillRect(-40, -40, 60, 60); ctx.fillRect(40, 60, 50, 50);
                    ctx.fillStyle = '#4a5d23'; ctx.fillRect(-100,-220,200,120); ctx.fillStyle = '#36441a'; ctx.fillRect(-60,-280,80,80);
                    ctx.restore();
                }
            }
            
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.restore();

            if (flash > 0) { ctx.fillStyle = `rgba(255,40,40,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
        }

        let lastTime = performance.now();
        function loop(now) {
            let dt = (now - lastTime) / 1000; lastTime = now; if (dt > 0.1) dt = 0.1;
            update(dt); draw();
            requestAnimationFrame(loop);
        }

        loadData();
        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
