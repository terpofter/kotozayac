<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Котозаяц: Прыжок в Кубы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00ffcc; --bg: #0f0f13; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Anton', Impact, 'Arial Black', sans-serif;
            overflow: hidden; touch-action: none; user-select: none;
            background-image: radial-gradient(circle at 50% 50%, #1e1e28 0%, #0f0f13 100%);
            letter-spacing: 1px;
        }
        #game-container {
            position: relative; width: 800px; height: 600px;
            max-width: 100%; max-height: 100%; aspect-ratio: 4/3;
            border: 4px solid #333; border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2), 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden; background: #87CEEB;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; align-items: center; gap: 8px; z-index: 10;
            pointer-events: none; flex-wrap: wrap;
        }
        .hud-item {
            background: rgba(15, 15, 25, 0.85); padding: 8px 12px; border-radius: 10px;
            color: white; font-size: 18px; display: flex; align-items: center; gap: 6px;
            border: 2px solid rgba(0, 255, 204, 0.3); backdrop-filter: blur(8px);
        }
        .hud-icon { width: 20px; height: 20px; fill: currentColor; }
        .icon-carrot { color: #FF8C00; }
        .icon-heart { color: #ff4444; }
        .icon-coin { color: #FFD700; }
        .icon-clock { color: var(--neon); }
        
        .hud-btn {
            background: rgba(15, 15, 25, 0.85); border: 2px solid rgba(0, 255, 204, 0.3);
            color: var(--neon); width: 42px; height: 42px; border-radius: 10px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); transition: all 0.2s; pointer-events: auto; padding: 0;
        }
        .hud-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .hud-btn:active { transform: scale(0.9); }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 10, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; backdrop-filter: blur(10px);
            overflow-y: auto; padding: 15px;
        }
        .overlay.hidden { display: none !important; }
        
        h1 { color: var(--neon); font-size: 48px; text-shadow: 0 0 20px var(--neon); margin: 0 0 5px 0; text-align: center; letter-spacing: 2px; }
        h2 { color: #fff; font-size: 26px; text-shadow: 0 0 10px #fff; margin-bottom: 15px; letter-spacing: 1px; text-align: center; }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 20px; letter-spacing: 1px; text-align: center; }
        
        .btn-rgb {
            position: relative; background: #0f0f13; color: #fff;
            border: 3px solid transparent; background-clip: padding-box; border-radius: 8px;
            padding: 12px 30px; font-size: 18px; font-family: inherit; cursor: pointer;
            transition: transform 0.1s; margin: 6px; text-align: center;
            text-transform: uppercase; z-index: 30; width: 100%; max-width: 260px;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
        }
        .btn-rgb::before {
            content: ''; position: absolute; inset: -3px; z-index: -1;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400% 100%; border-radius: 10px;
            animation: rgbBtn 4s linear infinite;
        }
        @keyframes rgbBtn { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }
        .btn-rgb:hover { color: #00ffcc; transform: scale(1.02); }
        .btn-rgb:active { transform: scale(0.95); }
        
        .btn-secondary { 
            background: linear-gradient(180deg, #555, #333); color: #fff; 
            border: none; border-radius: 8px; padding: 12px 30px; 
            font-size: 16px; font-family: inherit; cursor: pointer; 
            box-shadow: 0 5px 0 #111; margin: 6px; text-transform: uppercase; 
            width: 100%; max-width: 260px;
        }
        .btn-secondary:active { transform: translateY(5px); box-shadow: 0 0 0 #111; }

        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 25px;
            z-index: 15; pointer-events: none; gap: 15px;
        }
        .control-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(0, 255, 204, 0.15); border: 3px solid rgba(0, 255, 204, 0.6);
            color: var(--neon); font-size: 28px; display: flex; justify-content: center; align-items: center;
            pointer-events: auto; user-select: none; backdrop-filter: blur(5px);
        }
        .control-btn:active { background: rgba(0, 255, 204, 0.5); }
        .control-btn.jump { background: rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.6); color: #FFD700; }
        .control-btn.jump:active { background: rgba(255, 215, 0, 0.5); }
        #mobile-controls.visible { display: flex; }

        /* ========== НОВЫЙ ЭКРАН СМЕРТИ ========== */
        #game-over-screen { padding: 20px; }
        .death-card {
            background: rgba(15, 15, 25, 0.98);
            border: 3px solid transparent; border-radius: 16px;
            padding: 30px 25px; text-align: center; max-width: 420px; width: 100%;
            background-clip: padding-box; position: relative;
            animation: rgbGlowDeath 3s ease-in-out infinite alternate;
        }
        .death-card::before {
            content: ''; position: absolute; inset: -3px; z-index: -1;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400% 100%; border-radius: 18px;
            animation: rgbBorder 4s linear infinite;
        }
        @keyframes rgbBorder { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }
        @keyframes rgbGlowDeath {
            0% { box-shadow: 0 0 20px rgba(255,0,128,0.4); }
            100% { box-shadow: 0 0 40px rgba(0,255,255,0.5); }
        }
        .death-title { 
            font-size: 38px; color: #ff4444; text-shadow: 0 0 20px #ff4444, 0 0 40px #ff4444; 
            margin-bottom: 20px; letter-spacing: 3px;
            animation: deathPulse 1.5s ease-in-out infinite;
        }
        @keyframes deathPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .death-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px;
        }
        .death-stat {
            background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .death-stat-label { color: #888; font-size: 11px; margin-bottom: 4px; letter-spacing: 1px; }
        .death-stat-value { color: #fff; font-size: 24px; }
        .death-stat.coin .death-stat-value { color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }

        /* ========== КЛИКЕР ========== */
        #clicker-screen {
            background: radial-gradient(circle at 50% 30%, #2a1a1a 0%, #0f0f13 100%);
        }
        .clicker-container {
            display: flex; flex-direction: column; align-items: center;
            gap: 15px; width: 100%; max-width: 500px;
        }
        .clicker-info {
            display: flex; gap: 15px; width: 100%;
        }
        .clicker-info-item {
            flex: 1; background: rgba(255,255,255,0.05); padding: 10px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .clicker-info-label { color: #888; font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }
        .clicker-info-value { color: #FFD700; font-size: 22px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        
        #clicker-area {
            position: relative;
            width: 100%; max-width: 400px; height: 320px;
            background: rgba(255,140,0,0.05);
            border: 2px dashed rgba(255,140,0,0.3);
            border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden;
            transition: all 0.1s;
        }
        #clicker-area:active {
            background: rgba(255,140,0,0.1);
        }
        .big-carrot {
            font-size: 180px; line-height: 1;
            user-select: none; pointer-events: none;
            transition: transform 0.1s;
            filter: drop-shadow(0 10px 20px rgba(255,140,0,0.5));
            animation: carrotFloat 2s ease-in-out infinite;
        }
        @keyframes carrotFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        .click-particle {
            position: fixed; pointer-events: none;
            font-size: 28px; font-weight: bold;
            color: #FFD700; text-shadow: 2px 2px 0 #000, 0 0 10px #FFD700;
            animation: floatUp 1s ease-out forwards;
            z-index: 9999;
        }
        .click-particle.crit {
            font-size: 42px; color: #ff2020;
            text-shadow: 2px 2px 0 #000, 0 0 20px #ff2020, 0 0 40px #ff2020;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -50px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -100px) scale(1.5); opacity: 0; }
        }
        .crit-flash {
            position: fixed; inset: 0; pointer-events: none;
            background: radial-gradient(circle at center, rgba(255,0,0,0.3) 0%, transparent 60%);
            animation: critFlash 0.4s ease-out forwards;
            z-index: 9998;
        }
        @keyframes critFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 32px; } h2 { font-size: 20px; }
            .subtitle { font-size: 12px; }
            .hud-item { font-size: 13px; padding: 5px 8px; gap: 4px; }
            .hud-icon { width: 14px; height: 14px; }
            .hud-btn { width: 32px; height: 32px; }
            .hud-btn svg { width: 14px; height: 14px; }
            .btn-rgb { font-size: 15px; padding: 10px 18px; max-width: 220px; }
            .btn-secondary { font-size: 14px; padding: 10px 18px; max-width: 220px; }
            .shop-item, .ach-item { width: 45%; padding: 8px; }
            .shop-item-title, .ach-item-title { font-size: 12px; }
            .shop-buy-btn, .ach-btn { font-size: 11px; padding: 6px 8px; }
            .death-title { font-size: 26px; }
            .death-stat-value { font-size: 18px; }
            .big-carrot { font-size: 120px; }
            #clicker-area { height: 240px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
            <div class="hud-item"><svg class="hud-icon icon-carrot" viewBox="0 0 24 24"><path d="M17.7,2.7c-0.8-0.8-2-0.8-2.8,0L9,8.6C7.8,9.8,7,11.3,6.6,13l-2.2,8.3c-0.1,0.6,0.4,1.1,1,1l8.3-2.2 c1.7-0.4,3.2-1.2,4.4-2.4l5.9-5.9c0.8-0.8,0.8-2,0-2.8L17.7,2.7z M5.1,19.3l1.4-5.4c0.2-0.9,0.7-1.7,1.3-2.4l4.8-4.8 l3.3,3.3l-4.8,4.8c-0.7,0.7-1.5,1.1-2.4,1.3L5.1,19.3z M8.5,2.5c1.4-0.4,2.9-0.4,4.3,0l-3,3C9.3,4.2,8.7,3.4,8.5,2.5z M21.5,15.5c-0.4,1.4-0.4,2.9,0,4.3l-3-3C19.3,16.3,20.1,15.7,21.5,15.5z"/></svg><span id="score">0</span></div>
            <div class="hud-item"><svg class="hud-icon icon-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span id="lives">3</span></div>
            <div class="hud-item"><svg class="hud-icon icon-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6v12m-4-6h8" stroke="currentColor" stroke-width="2"/></svg><span id="coins">0</span></div>
            
            <div class="hud-item" style="border-color: rgba(0, 255, 204, 0.6); box-shadow: 0 0 10px rgba(0,255,204,0.2);">
                <svg class="hud-icon icon-clock" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <span id="clock-msk">00:00</span>
            </div>

            <div style="flex:1"></div>
            
            <button id="btn-mute" class="hud-btn" title="Звук">
                <svg id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <button id="btn-pause" class="hud-btn" title="Пауза"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
        </div>

        <div id="hub-screen" class="overlay">
            <h1>КОТОЗАЯЦ</h1>
            <div class="subtitle">ГЛАВНОЕ МЕНЮ</div>
            <button id="btn-play" class="btn-rgb">ПРЫЖОК В КУБЫ</button>
            <button id="clicker-btn" class="btn-rgb">🥕 КЛИКЕР</button>
            <button id="shop-btn" class="btn-rgb">🛒 МАГАЗИН</button>
            <button id="ach-btn" class="btn-rgb">🏆 АЧИВКИ</button>
            <button id="btn-reset-all" class="btn-secondary">СБРОСИТЬ ВСЁ</button>
        </div>

        <!-- НОВЫЙ ЭКРАН СМЕРТИ -->
        <div id="game-over-screen" class="overlay hidden">
            <div class="death-card">
                <div class="death-title">ИГРА ОКОНЧЕНА</div>
                <div class="death-stats">
                    <div class="death-stat">
                        <div class="death-stat-label">ОЧКИ</div>
                        <div class="death-stat-value" id="final-score">0</div>
                    </div>
                    <div class="death-stat">
                        <div class="death-stat-label">РЕКОРД</div>
                        <div class="death-stat-value" id="final-best">0</div>
                    </div>
                    <div class="death-stat">
                        <div class="death-stat-label">СЪЕДЕНО</div>
                        <div class="death-stat-value" id="final-eaten">0</div>
                    </div>
                    <div class="death-stat">
                        <div class="death-stat-label">ПРОПУЩЕНО</div>
                        <div class="death-stat-value" id="final-missed">0</div>
                    </div>
                    <div class="death-stat coin" style="grid-column: span 2;">
                        <div class="death-stat-label">ЗАРАБОТАНО МОНЕТ</div>
                        <div class="death-stat-value" id="final-coins">+0</div>
                    </div>
                </div>
                <button id="btn-restart" class="btn-rgb">ЗАНОВО</button>
                <button id="btn-to-hub" class="btn-secondary">В ГЛАВНОЕ МЕНЮ</button>
            </div>
        </div>

        <!-- КЛИКЕР -->
        <div id="clicker-screen" class="overlay hidden">
            <h2>🥕 КЛИКЕР</h2>
            <div class="clicker-container">
                <div class="clicker-info">
                    <div class="clicker-info-item">
                        <div class="clicker-info-label">БАЛАНС</div>
                        <div class="clicker-info-value" id="clicker-coins">0</div>
                    </div>
                    <div class="clicker-info-item">
                        <div class="clicker-info-label">ВСЕГО КЛИКОВ</div>
                        <div class="clicker-info-value" id="clicker-total" style="color: #00ffcc;">0</div>
                    </div>
                </div>
                <div id="clicker-area">
                    <div class="big-carrot" id="big-carrot">🥕</div>
                </div>
                <div style="color: #888; font-size: 12px; text-align: center; letter-spacing: 1px;">Шанс 10% на КРИТ (x10 монет)</div>
                <button id="clicker-close-btn" class="btn-secondary">НАЗАД</button>
            </div>
        </div>

        <div id="shop-screen" class="overlay hidden">
            <h2>МАГАЗИН И СКИНЫ</h2>
            <div class="shop-balance">Баланс: <span id="shop-coins">0</span> 🥕</div>
            <div id="shop-items"></div>
            <button id="shop-close-btn" class="btn-rgb">НАЗАД</button>
        </div>

        <div id="ach-screen" class="overlay hidden">
            <h2>ДОСТИЖЕНИЯ</h2>
            <div class="shop-balance">Баланс: <span id="ach-coins">0</span> 🥕</div>
            <div id="ach-items"></div>
            <button id="ach-close-btn" class="btn-rgb">НАЗАД</button>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h2>ПАУЗА</h2>
            <button id="resume-btn" class="btn-rgb">ПРОДОЛЖИТЬ</button>
            <button id="menu-btn-pause" class="btn-secondary">В ГЛАВНОЕ МЕНЮ</button>
        </div>

        <div id="mobile-controls">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn jump" id="btn-jump">▲</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
    </div>

    <script>
        // ============ ВРЕМЯ ============
        let isNight = false, currentSeason = 'summer';

        function updateMoscowClock() {
            const now = new Date();
            const mskOffset = 3 * 60 * 60 * 1000; 
            const mskTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + mskOffset);
            const hours = mskTime.getHours(), minutes = mskTime.getMinutes(), seconds = mskTime.getSeconds(), month = mskTime.getMonth();
            document.getElementById('clock-msk').innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            isNight = (hours >= 22 || hours < 10);
            if (month === 11 || month === 0 || month === 1) currentSeason = 'winter';
            else if (month >= 2 && month <= 4) currentSeason = 'spring';
            else if (month >= 5 && month <= 7) currentSeason = 'summer';
            else currentSeason = 'autumn';
        }
        setInterval(updateMoscowClock, 1000);
        updateMoscowClock(); 

        // ============ ЗВУК ============
        const Sound = {
            ctx: null, master: null, musicGain: null, sfxGain: null, noiseBuffer: null, muted: false,
            musicVolume: 0.3, sfxVolume: 0.6, musicPlaying: false, musicTimer: null, nextNoteTime: 0, step: 0, BPM: 115,
            init() {
                if (this.ctx) return;
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
                this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(this.ctx.destination);
                this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = this.musicVolume; this.musicGain.connect(this.master);
                this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVolume; this.sfxGain.connect(this.master);
                const sr = this.ctx.sampleRate; this.noiseBuffer = this.ctx.createBuffer(1, sr * 0.5, sr);
                const data = this.noiseBuffer.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            },
            resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
            setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 1; try { localStorage.setItem('kotozayac_mute', m ? '1' : '0'); } catch(e){} if(!m) this.resume(); },
            tone({freq, type='sine', dur=0.2, vol=0.1, slideTo=null, delay=0, attack=0.005, filter=null}) {
                if (!this.ctx) return; const t = this.ctx.currentTime + delay; const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, t);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                let node = osc;

        function loadData() {
            try {
                if (localStorage.getItem('kotozayac_coins')) coins = parseInt(localStorage.getItem('kotozayac_coins'), 10);
                if (localStorage.getItem('kotozayac_shop')) shopItems = JSON.parse(localStorage.getItem('kotozayac_shop'));
                if (localStorage.getItem('kotozayac_active_skin')) activeSkin = localStorage.getItem('kotozayac_active_skin');
                if (localStorage.getItem('kotozayac_ach')) achievements = JSON.parse(localStorage.getItem('kotozayac_ach'));
                if (localStorage.getItem('kotozayac_total_carrots')) totalCarrots = parseInt(localStorage.getItem('kotozayac_total_carrots'), 10);
                if (localStorage.getItem('kotozayac_total_deaths')) totalDeaths = parseInt(localStorage.getItem('kotozayac_total_deaths'), 10);
                if (localStorage.getItem('kotozayac_clicker')) clickerTotal = parseInt(localStorage.getItem('kotozayac_clicker'), 10);
            } catch(e) { }
            if (!shopItems['classic']) shopItems['classic'] = true; 
            updateCoinUI(); renderShop(); renderAch();
        }

        function saveData() {
            try {
                localStorage.setItem('kotozayac_coins', String(coins));
                localStorage.setItem('kotozayac_shop', JSON.stringify(shopItems));
                localStorage.setItem('kotozayac_active_skin', activeSkin);
                localStorage.setItem('kotozayac_best', String(bestScore));
                localStorage.setItem('kotozayac_ach', JSON.stringify(achievements));
                localStorage.setItem('kotozayac_total_carrots', String(totalCarrots));
                localStorage.setItem('kotozayac_total_deaths', String(totalDeaths));
                localStorage.setItem('kotozayac_clicker', String(clickerTotal));
            } catch(e) {}
        }

        function updateCoinUI() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('shop-coins').innerText = coins;
            document.getElementById('ach-coins').innerText = coins;
            document.getElementById('clicker-coins').innerText = coins;
            document.getElementById('clicker-total').innerText = clickerTotal;
        }

        function renderShop() {
            const container = document.getElementById('shop-items'); container.innerHTML = '';
            SHOP_CONFIG.forEach(item => {
                const isBought = shopItems[item.id], isEquipped = activeSkin === item.id;
                let btnText = item.price + ' 🥕', btnClass = '', isDisabled = false;
                if (item.id === 'classic') { if (isEquipped) { btnText = 'НАДЕТО'; btnClass = 'equipped'; isDisabled = true; } else { btnText = 'НАДЕТЬ'; } } 
                else if (isBought) { if (isEquipped) { btnText = 'НАДЕТО'; btnClass = 'equipped'; isDisabled = true; } else { btnText = 'НАДЕТЬ'; } } 
                else { if (coins < item.price) isDisabled = true; }

                const card = document.createElement('div'); card.className = 'shop-item';
                card.innerHTML = `<div class="shop-item-title">${item.name}</div><div style="font-size:11px; color:#888; margin-bottom:5px;">${item.desc}</div>
                    <button class="shop-buy-btn ${btnClass}" id="btn-${item.id}" ${isDisabled ? 'disabled' : ''}>${btnText}</button>`;
                container.appendChild(card);
                
                if (!isDisabled) {
                    document.getElementById(`btn-${item.id}`).addEventListener('click', () => {
                        if (isBought) { activeSkin = item.id; Sound.sfx.click(); saveData(); renderShop(); } 
                        else { if (coins >= item.price) { coins -= item.price; shopItems[item.id] = true; activeSkin = item.id; Sound.sfx.buy(); saveData(); renderShop(); } }
                    });
                }
            });
        }

        function renderAch() {
            const container = document.getElementById('ach-items'); container.innerHTML = '';
            ACH_CONFIG.forEach(item => {
                const isClaimed = achievements[item.id], isCompleted = item.cond();
                let btnText = 'В ПРОЦЕССЕ', btnClass = '', isDisabled = true;
                if (isClaimed) { btnText = 'ПОЛУЧЕНО'; btnClass = 'claimed'; isDisabled = true; }
                else if (isCompleted) { btnText = 'ЗАБРАТЬ ' + item.reward + ' 🥕'; btnClass = ''; isDisabled = false; }
                
                const card = document.createElement('div'); card.className = 'ach-item';
                card.innerHTML = `<div class="ach-item-title">${item.name}</div><div style="font-size:11px; color:#888; margin-bottom:5px;">${item.desc}</div>
                    <button class="ach-btn ${btnClass}" id="ach-${item.id}" ${isDisabled ? 'disabled' : ''}>${btnText}</button>`;
                container.appendChild(card);
                
                if (!isDisabled) {
                    document.getElementById(`ach-${item.id}`).addEventListener('click', () => {
                        coins += item.reward; achievements[item.id] = true; Sound.sfx.buy(); saveData(); renderAch(); updateCoinUI();
                    });
                }
            });
        }

        // ============ КЛИКЕР ============
        function openClicker() {
            Sound.sfx.click();
            document.getElementById('hub-screen').classList.add('hidden');
            document.getElementById('clicker-screen').classList.remove('hidden');
            updateCoinUI();
        }
        function closeClicker() {
            Sound.sfx.click();
            document.getElementById('clicker-screen').classList.add('hidden');
            document.getElementById('hub-screen').classList.remove('hidden');
        }

        function handleCarrotClick(e) {
            const isCrit = Math.random() < 0.1;
            const amount = isCrit ? 10 : 1;
            
            coins += amount;
            clickerTotal++;
            updateCoinUI();
            saveData();
            
            // Летящий текст
            const particle = document.createElement('div');
            particle.className = 'click-particle' + (isCrit ? ' crit' : '');
            particle.textContent = isCrit ? '+' + amount + '!' : '+' + amount;
            particle.style.left = e.clientX + 'px';
            particle.style.top = e.clientY + 'px';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
            
            // Вспышка при крите
            if (isCrit) {
                const flash = document.createElement('div');
                flash.className = 'crit-flash';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 400);
                Sound.sfx.critClick();
            } else {
                Sound.sfx.carrotClick();
            }
            
            // Анимация морковки
            const carrot = document.getElementById('big-carrot');
            carrot.style.animation = 'none';
            carrot.offsetHeight; // reflow
            carrot.style.animation = 'carrotBounce 0.2s';
            setTimeout(() => carrot.style.animation = '', 200);
        }

                50% { transform: scale(0.85) rotate(-10deg); }
                100% { transform: scale(1) rotate(0deg); }
            }
        `;
        document.head.appendChild(styleSheet);

        function bindBtn(el, setter) { el.addEventListener('pointerdown', e => { e.preventDefault(); setter(true); el.setPointerCapture(e.pointerId); }); el.addEventListener('pointerup', () => setter(false)); el.addEventListener('pointercancel', () => setter(false)); el.addEventListener('pointerleave', () => setter(false)); }

            if (gameState !== 'playing' || player.y < GROUND_Y) return;
            player.vy = JUMP_V; player.onGround = false; Sound.sfx.jump();
            for(let i=0; i<5; i++) particles.push({ x: player.x + player.width/2, y: player.y, vx: (Math.random()-0.5)*4, vy: Math.random()*-2, life: 1, decay: 0.05, color: '#aaa', size: 3+Math.random()*3 });

            if (gameState === 'playing') { gameState = 'paused'; Sound.music.stop(); document.getElementById('pause-screen').classList.remove('hidden'); }

        function goToHub() { Sound.sfx.click(); Sound.music.stop(); gameState = 'hub'; resetGame(); document.getElementById('pause-screen').classList.add('hidden'); document.getElementById('game-over-screen').classList.add('hidden'); document.getElementById('hub-screen').classList.remove('hidden'); updateCoinUI(); }
        function restartGame() { if (gameState !== 'gameover') return; Sound.sfx.click(); document.getElementById('game-over-screen').classList.add('hidden'); resetGame(); gameState = 'playing'; Sound.music.start(); }
        function clampPlayer() { if (player.x < 0) player.x = 0; if (player.x + player.width > W) player.x = W - player.width; }
        
        function spawnParticles(x, y, colors, count) {
            for (let i = 0; i < count; i++) { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6; particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, life: 1, decay: 0.02 + Math.random()*0.03, color: colors[(Math.random()*colors.length)|0], size: 2 + Math.random()*5 }); }
        }

        function spawnObject() {
            if (boss) return; 
            objectSpawnCount++;
            let type = 'rotten'; 
            if (objectSpawnCount >= 6) { type = 'red'; objectSpawnCount = 0; } 
            else {
                const rand = Math.random();
                if (rand > 0.6) type = 'carrot';
                else if (rand > 0.95) type = 'golden'; 
                else if (rand > 0.9) type = 'magnet';
                else if (rand > 0.85) type = 'shield';
            }
            let speedMultiplier = 1; if (shopItems['slowStart'] && score < 100) speedMultiplier = 0.7;
            objects.push({ x: Math.random() * (W - 40), y: -40, width: 40, height: 40, speed: ((3 + Math.random()*2.5) + difficulty * 0.6) * speedMultiplier, type: type, wobble: Math.random() * Math.PI * 2 });
        }

        function drawObjects() {
            for (const obj of objects) {
                const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                ctx.save(); ctx.translate(cx, cy);
                ctx.shadowBlur = 15;
                if (obj.type === 'carrot') ctx.shadowColor = '#FF8C00';
                else if (obj.type === 'golden') ctx.shadowColor = '#FFD700';
                else if (obj.type === 'red') ctx.shadowColor = '#ff0000';
                else if (obj.type === 'magnet') ctx.shadowColor = '#0088ff';
                else if (obj.type === 'shield') ctx.shadowColor = '#00ffcc';
                else ctx.shadowColor = '#3a4b22'; 

                if (obj.type === 'carrot' || obj.type === 'golden' || obj.type === 'red') {
                    ctx.rotate(Math.sin(obj.wobble) * 0.15);
                    if (obj.type === 'red') {
                        ctx.fillStyle = '#ff2020'; ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(0,22); ctx.closePath(); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.fillRect(-2, -2, 4, 12); ctx.fillRect(-6, 2, 12, 4);
                    } else {
                        ctx.fillStyle = obj.type === 'golden' ? '#FFD700' : '#FF8C00'; ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(0,22); ctx.closePath(); ctx.fill();
                        ctx.fillStyle = obj.type === 'golden' ? '#FFF8DC' : '#FFA500'; ctx.beginPath(); ctx.moveTo(-5,-5); ctx.lineTo(5,-5); ctx.lineTo(0,18); ctx.closePath(); ctx.fill();
                    }
                    ctx.fillStyle = '#228B22'; ctx.fillRect(-10,-22,20,12);
                } else if (obj.type === 'magnet') {
                    ctx.fillStyle = '#0055aa'; ctx.fillRect(-15,-15,30,30);
                    ctx.fillStyle = '#0088ff'; ctx.fillRect(-10,-10,20,20);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('U', 0, 0);
                } else if (obj.type === 'shield') {
                    ctx.fillStyle = '#005544'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#00ffcc'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(0,6); ctx.moveTo(-4,-2); ctx.lineTo(0,6); ctx.lineTo(4,-2); ctx.stroke();
                } else {
                    ctx.rotate(Math.sin(obj.wobble) * 0.2);
                    ctx.fillStyle = '#5c4a3d'; ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(12,-12); ctx.lineTo(-2,20); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#3e2e24'; ctx.fillRect(-4, -4, 6, 6);
                    ctx.fillStyle = '#4a5d23'; ctx.fillRect(-10,-22,20,12);
                }
                ctx.restore();
            }
        }

        function drawPlayer() {
            if (gameState === 'dying') {
                if (deathVariation === 1 && deathTimer > 10) return;
                if (deathVariation === 2 && deathTimer > 15) return;
                if (deathVariation === 3 && deathTimer > 30) return;
            }

            for(let i=0; i<trail.length; i++) {
                let t = trail[i]; let alpha = (i / trail.length) * 0.5 * rabbitOpacity;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = player.hasShield ? '#00ffcc' : '#fff';
                ctx.fillRect(t.x + 20, t.y - player.height + 20, 40, 40);
            }
            ctx.globalAlpha = 1;

            const bob = player.onGround ? Math.sin(frames * 0.1) * 3 : 0;
            const px = player.x;
            const py = player.y - player.height + bob + rabbitOffsetY;
            const w = player.width, h = player.height;

            if (rabbitOpacity > 0.3) {
                ctx.fillStyle = `rgba(0,0,0,${0.3 * rabbitOpacity})`;
                ctx.beginPath(); ctx.ellipse(px + w/2, player.y + 5, w/2.5 * player.squash * rabbitScaleX, 8 * player.stretch * rabbitScaleY, 0, 0, Math.PI*2); ctx.fill();
            }

            if (player.hasShield) {
                ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 4;
                ctx.shadowBlur = 20; ctx.shadowColor = '#00ffcc';
                ctx.beginPath(); ctx.arc(px + w/2, py + h/2, w/2 + 10, 0, Math.PI*2); ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.save();
            ctx.globalAlpha = rabbitOpacity;
            ctx.translate(px + w/2, py + h/2); 
            ctx.rotate(rabbitRotation);
            ctx.scale(player.squash * rabbitScaleX, player.stretch * rabbitScaleY); 
            ctx.translate(-(px + w/2), -(py + h/2));

            let currentSprite = null; const skinImgs = IMAGES[activeSkin] || IMAGES.classic;
            if (flash > 0 && skinImgs.hit.complete && skinImgs.hit.naturalWidth > 0) currentSprite = skinImgs.hit; 
            else if (!player.onGround && skinImgs.jump.complete && skinImgs.jump.naturalWidth > 0) currentSprite = skinImgs.jump; 
            else if (skinImgs.idle.complete && skinImgs.idle.naturalWidth > 0) currentSprite = skinImgs.idle; 

            if (currentSprite) {
                if (activeSkin === 'pancakes') {
                    const scale = 0.55; 
                    const nw = 172, nh = 211;
                    const sw = nw * scale, sh = nh * scale;
                    const pivotX = 86 * scale;
                    const pivotY = 170 * scale;
                    ctx.drawImage(currentSprite, -pivotX, -pivotY, sw, sh);
                } else {
                    const imgRatio = currentSprite.width / currentSprite.height; let drawW = w, drawH = h; 
                    if (imgRatio > 1) drawH = w / imgRatio; else drawW = h * imgRatio;
                    ctx.drawImage(currentSprite, px + (w - drawW)/2, py + (h - drawH)/2, drawW, drawH);
                }
            } else {
                ctx.fillStyle = '#8a8a8a'; ctx.fillRect(px, py, w, h); 
                ctx.fillStyle = '#fff'; ctx.fillRect(px + 15, py + 20, 20, 22); ctx.fillRect(px + w - 35, py + 20, 20, 22);
            }
            ctx.restore();
        }

        function drawBackground() {
            if (isNight) {
                let skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y); skyGrad.addColorStop(0, '#0a0f24'); skyGrad.addColorStop(1, '#1a2245');
                ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GROUND_Y);
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 60; i++) {
                    let sx = (i * 137) % W; let sy = (i * 73) % (GROUND_Y - 100);
                    if (Math.sin(frames * 0.05 + i) > 0) { ctx.globalAlpha = 0.5 + Math.sin(frames * 0.1 + i) * 0.5; ctx.fillRect(sx, sy, 2, 2); }
                }
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#e2e8f0'; ctx.shadowBlur = 40; ctx.shadowColor = '#a0aec0';
                ctx.beginPath(); ctx.arc(W - 150, 100, 50, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
            } else {
                let skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y); skyGrad.addColorStop(0, '#4facfe'); skyGrad.addColorStop(1, '#00f2fe');
                ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GROUND_Y);
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 40; ctx.shadowColor = '#FFD700';
                ctx.beginPath(); ctx.arc(W - 150, 100, 50, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
            }

            for (const c of clouds) { ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.scale, c.scale); ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.arc(35, -15, 25, 0, Math.PI*2); ctx.arc(70, 0, 30, 0, Math.PI*2); ctx.arc(35, 15, 30, 0, Math.PI*2); ctx.fill(); ctx.restore(); }

            for (let i = 0; i < hills.length; i++) {
                const h = hills[i]; 
                if (isNight) { ctx.fillStyle = i % 2 === 0 ? '#1c2e1e' : '#132215'; } else { ctx.fillStyle = i % 2 === 0 ? '#75c95e' : '#56ab3e'; }
                ctx.beginPath(); ctx.moveTo(h.x, GROUND_Y); ctx.quadraticCurveTo(h.x + h.w/2, GROUND_Y - h.h, h.x + h.w, GROUND_Y); ctx.fill();
            }

            let groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            if (isNight) { groundGrad.addColorStop(0, '#2b1d14'); groundGrad.addColorStop(1, '#0f0806'); } else { groundGrad.addColorStop(0, '#5c4033'); groundGrad.addColorStop(1, '#3e2723'); }
            ctx.fillStyle = groundGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.fillStyle = isNight ? '#215c2c' : '#4CAF50'; ctx.fillRect(0, GROUND_Y, W, 15);

            if (currentSeason === 'winter') { ctx.fillStyle = 'rgba(255,255,255,0.8)'; weather.forEach(w => { ctx.beginPath(); ctx.arc(w.x, w.y, w.size, 0, Math.PI*2); ctx.fill(); }); }
            else if (currentSeason === 'autumn') { ctx.fillStyle = 'rgba(255,165,0,0.8)'; weather.forEach(w => { ctx.fillRect(w.x, w.y, w.size, w.size); }); }
            else if (currentSeason === 'spring') { ctx.fillStyle = 'rgba(255,182,193,0.8)'; weather.forEach(w => { ctx.beginPath(); ctx.arc(w.x, w.y, w.size, 0, Math.PI*2); ctx.fill(); }); }
            else { ctx.fillStyle = 'rgba(255,255,255,0.3)'; weather.forEach(w => { ctx.fillRect(w.x, w.y, w.size, w.size); }); }
        }

        function update(dt) {
            for (const c of clouds) { c.x -= c.speed * dt; if (c.x < -200) { c.x = W + 200; c.y = 20 + Math.random() * 150; } }
            for (const h of hills) { h.x -= h.speed * dt; if (h.x + h.w < 0) { h.x = W + Math.random()*100; h.h = 150 + Math.random() * 100; } }
            
            if (gameState === 'dying') {
                deathTimer += dt * 60;
                
                if (deathVariation === 0) {
                    if (giantCarrot) {
                        giantCarrot.y += giantCarrot.vy * dt * 60;
                        giantCarrot.vy += 0.5 * dt * 60;
                        if (giantCarrot.y + giantCarrot.height/2 > player.y - 10) {
                            giantCarrot.y = player.y - 10 - giantCarrot.height/2;
                            giantCarrot.vy = 0;
                            screenShake = 30; flash = 1; Sound.sfx.smash();
                            spawnParticles(player.x + player.width/2, player.y - 20, ['#5c4a3d','#ff4444','#3a4b22'], 40);
                            rabbitScaleY = 0.1; rabbitScaleX = 2.5; rabbitOffsetY = 30;
                        }
                    }
                    if (deathTimer > 90) gameOver();
                }
                else if (deathVariation === 1) {
                    if (deathTimer > 15 && rabbitOpacity > 0) {
                        screenShake = 30; flash = 1; Sound.sfx.smash();
                        for (let i = 0; i < 60; i++) {
                            const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 10;
                            particles.push({ x: player.x + player.width/2, y: player.y - player.height/2, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 3, life: 1, decay: 0.015, color: ['#8a8a8a','#aaa','#666','#fff', '#ff4444'][Math.floor(Math.random()*5)], size: 4 + Math.random()*10 });
                        }
                        rabbitOpacity = 0;
                    }
                    if (deathTimer > 70) gameOver();
                }
                else if (deathVariation === 2) {
                    if (deathTimer === 1) {
                        player.vy = -15;
                        Sound.sfx.smash();
                        screenShake = 20;
                    }
                    player.vy += 0.4 * dt * 60;
                    rabbitOffsetY += player.vy * dt * 60;
                    rabbitRotation += 0.2 * dt * 60;
                    if (rabbitOffsetY < -200) rabbitOpacity = 0;
                    if (deathTimer > 100) gameOver();
                }
                else if (deathVariation === 3) {
                    if (deathTimer > 15) {
                        rabbitOffsetY += 4 * dt * 60;
                        rabbitOpacity = Math.max(0, 1 - (rabbitOffsetY / 120));
                    }
                    if (deathTimer > 80) gameOver();
                }
                
                if (screenShake > 0) screenShake *= 0.9;
                if (flash > 0) flash -= 0.02 * dt * 60;
                return; 
            }

            if (gameState !== 'playing') return;
            frames += dt * 60;

            if (frames % 2 === 0) {
                trail.push({ x: player.x, y: player.y });
                if (trail.length > 10) trail.shift();
            }

            if (keys['ArrowLeft'] || keys['KeyA'] || btnLeft) player.x -= player.speed * dt * 60;
            if (keys['ArrowRight'] || keys['KeyD'] || btnRight) player.x += player.speed * dt * 60;
            clampPlayer();

            player.vy += GRAVITY * dt * 60; player.y += player.vy * dt * 60;
            if (!player.onGround) { player.stretch = Math.min(1.2, 1 + Math.abs(player.vy) * 0.015); player.squash = Math.max(0.8, 1 - Math.abs(player.vy) * 0.01); } 
            else { player.squash += (1 - player.squash) * 0.2; player.stretch += (1 - player.stretch) * 0.2; }

            if (player.y >= GROUND_Y) { 
                if (!player.onGround) { 
                    player.squash = 1.3; player.stretch = 0.7; 
                    for(let i=0; i<5; i++) particles.push({ x: player.x + player.width/2, y: player.y, vx: (Math.random()-0.5)*4, vy: Math.random()*-2, life: 1, decay: 0.05, color: '#aaa', size: 3+Math.random()*3 });
                } 
                player.y = GROUND_Y; player.vy = 0; player.onGround = true; 
            }

            if (player.magnetTimer > 0) player.magnetTimer -= dt;

            if (Math.random() < 0.1) {
                let size = 2, speed = 2;
                if (currentSeason === 'autumn') { size = 4; speed = 3; }
                else if (currentSeason === 'spring') { size = 3; speed = 2.5; }
                else if (currentSeason === 'winter') { size = 3; speed = 4; }
                weather.push({ x: Math.random() * W, y: -10, size: size, speed: speed, drift: (Math.random()-0.5)*2 });
            }
            for (let i = weather.length - 1; i >= 0; i--) {
                let w = weather[i]; w.y += w.speed; w.x += w.drift;
                if (w.y > H) weather.splice(i, 1);
            }

            if (score >= nextBossScore && !boss && gameState === 'playing') {
                boss = { x: W/2 - 100, y: -250, width: 200, height: 200, hp: 3, timer: 0, dir: 1, entering: true };
                Sound.music.stop(); Sound.sfx.bossHit();
            }

            if (boss) {
                if (boss.entering) {
                    boss.y += 4 * dt * 60;
                    if (boss.y >= 150) { boss.y = 150; boss.entering = false; }
                } else {
                    boss.x += 3 * boss.dir * dt * 60;
                    if (boss.x > W - boss.width) boss.dir = -1;
                    if (boss.x < 0) boss.dir = 1;
                    boss.timer += dt * 60;
                    if (boss.timer > 90) {
                        boss.timer = 0;
                        objects.push({ x: boss.x + boss.width/2 - 20, y: boss.y + boss.height, width: 40, height: 40, speed: 6, type: 'rotten', wobble: 0 });
                        Sound.sfx.hit();
                    }
                }
            }

            difficulty = 1 + Math.floor(score / 100);
            if (difficulty > prevDifficulty) { Sound.sfx.powerup(); prevDifficulty = difficulty; Sound.BPM = 115 + difficulty * 2; }

            spawnTimer += dt * 60;
            if (!boss && spawnTimer >= Math.max(16, 50 - difficulty * 4)) { spawnTimer = 0; spawnObject(); }

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i]; 
                if (player.magnetTimer > 0 && (obj.type === 'carrot' || obj.type === 'golden' || obj.type === 'red')) {
                    let dx = (player.x + player.width/2) - (obj.x + obj.width/2);
                    let dy = (player.y - player.height/2) - (obj.y + obj.height/2);
                    let dist = Math.hypot(dx, dy);
                    if (dist > 0) { obj.x += (dx/dist) * 15; obj.y += (dy/dist) * 15; }
                } else {
                    obj.y += obj.speed * dt * 60; 
                    obj.wobble += 0.1 * dt * 60;
                }

                const hit = player.x < obj.x + obj.width && 
                            player.x + player.width > obj.x && 
                            player.y - player.height < obj.y + obj.height && 
                            player.y > obj.y;
                
                if (hit) {
                    const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                    if (obj.type === 'carrot' || obj.type === 'golden' || obj.type === 'red') {
                        carrotsCollected++; totalCarrots++;
                        if (obj.type === 'red') {
                            if (lives < (shopItems['extraLife'] ? 4 : 5)) { lives++; livesEl.innerText = lives; }
                            score += 25; Sound.sfx.powerup(); spawnParticles(cx, cy, ['#ff2020', '#fff'], 25);
                        } else {
                            combo++;
                            let gained = obj.type === 'golden' ? 50 : 10;
                            if (combo % 5 === 0) { Sound.sfx.powerup(); gained += combo * 2; spawnParticles(cx, cy, ['#FFD700','#fff'], 20); }
                            score += gained;
                        }
                        scoreEl.innerText = score;
                    } else if (obj.type === 'magnet') {
                        player.magnetTimer = 8; Sound.sfx.buy();
                        spawnParticles(cx, cy, ['#0088ff', '#fff'], 20);
                    } else if (obj.type === 'shield') {
                        player.hasShield = true; Sound.sfx.buy();
                        spawnParticles(cx, cy, ['#00ffcc', '#fff'], 20);
                    } else { 
                        if (player.hasShield) {
                            player.hasShield = false;
                            Sound.sfx.powerup(); spawnParticles(cx, cy, ['#00ffcc', '#fff'], 20);
                            screenShake = 10;
                        } else {
                            combo = 0; lives--; if (lives < 0) lives = 0; livesEl.innerText = lives;
                            Sound.sfx.hit(); spawnParticles(cx, cy, ['#5c4a3d','#ff4444'], 20);
                            screenShake = 15; flash = 0.5;
                            if (lives <= 0) triggerDeathAnimation();
                        }
                    }
                    objects.splice(i, 1); continue;
                }
                if (obj.y > H + 20) { objects.splice(i, 1); }
            }

            if (boss && !boss.entering) {
                const hitBoss = player.x < boss.x + boss.width && 
                                player.x + player.width > boss.x && 
                                player.y - player.height < boss.y + boss.height && 
                                player.y > boss.y;
                
                if (hitBoss) {
                    if (player.vy > 0 && player.y - player.height < boss.y + boss.height / 2) {
                        boss.hp--;
                        player.vy = -12; 
                        Sound.sfx.hit();
                        screenShake = 10;
                        spawnParticles(boss.x + boss.width/2, boss.y + boss.height/2, ['#ff0000', '#ffaa00'], 30);
                        if (boss.hp <= 0) {
                            score += 500; coins += 100;
                            achievements['boss1'] = true;
                            nextBossScore += 1000;
                            boss = null;
                            screenShake = 30; flash = 1;
                            Sound.sfx.smash();
                            Sound.music.start();
                            saveData();
                        }
                    } else {
                        if (player.hasShield) {
                            player.hasShield = false;
                            Sound.sfx.powerup();
                            spawnParticles(player.x, player.y, ['#00ffcc', '#fff'], 20);
                        } else {
                            lives--; if (lives < 0) lives = 0; livesEl.innerText = lives;
                            Sound.sfx.hit(); screenShake = 15; flash = 0.5;
                            if (lives <= 0) triggerDeathAnimation();
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.25 * dt * 60; p.life -= p.decay * dt * 60;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (screenShake > 0) screenShake *= 0.88;
            if (flash > 0) flash = Math.max(0, flash - 0.04 * dt * 60);
        }

        function triggerDeathAnimation() {
            gameState = 'dying'; deathTimer = 0; Sound.music.stop(); 
            deathVariation = Math.floor(Math.random() * 4);
            rabbitOpacity = 1; rabbitScaleX = 1; rabbitScaleY = 1; rabbitOffsetY = 0; rabbitRotation = 0;
            player.vy = 0;
            
            if (deathVariation === 0) {
                giantCarrot = { x: player.x + player.width/2 - 100, y: -300, width: 200, height: 200, vy: 8 };
                Sound.sfx.drop();
            } else {
                giantCarrot = null;
            }
        }

        function gameOver() {
            gameState = 'gameover';
            const isNewRecord = score > bestScore;
            if (isNewRecord) bestScore = score;
            totalDeaths++;
            
            const earnedCoins = Math.floor(score / 10);
            coins += earnedCoins; saveData();

            // Заполняем статистику
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-best').innerText = bestScore;
            document.getElementById('final-eaten').innerText = carrotsCollected;
            document.getElementById('final-missed').innerText = carrotsMissed;
            document.getElementById('final-coins').innerText = '+' + earnedCoins;
            
            document.getElementById('game-over-screen').classList.remove('hidden');
            
            if (isNewRecord) {
                setTimeout(() => Sound.sfx.buy(), 300);
            } else {
                setTimeout(() => Sound.sfx.deathJingle(), 200);
            }
        }

        function resetGame() {
            score = 0; lives = 3; if (shopItems['extraLife']) lives += 1;
            frames = 0; spawnTimer = 0; difficulty = 1; prevDifficulty = 1; combo = 0;
            carrotsCollected = 0; carrotsMissed = 0; objectSpawnCount = 0;
            objects = []; particles = []; screenShake = 0; flash = 0; btnLeft = btnRight = false;
            giantCarrot = null; deathTimer = 0; boss = null; nextBossScore = 500; trail = [];
            rabbitOpacity = 1; rabbitScaleX = 1; rabbitScaleY = 1; rabbitOffsetY = 0; rabbitRotation = 0;
            player.magnetTimer = 0; player.hasShield = false;
            Sound.BPM = 115;
            player.x = W/2 - player.width/2; player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.squash = 1; player.stretch = 1;
            scoreEl.innerText = '0'; livesEl.innerText = lives;
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            
            drawBackground();
            if (gameState !== 'hub') { 
                drawObjects(); 
                drawPlayer(); 
                
                if (boss) {
                    ctx.save(); ctx.translate(boss.x + boss.width/2, boss.y + boss.height/2);
                    ctx.shadowBlur = 30; ctx.shadowColor = '#ff0000';
                    ctx.fillStyle = '#8B0000'; ctx.beginPath(); ctx.moveTo(-80,-100); ctx.lineTo(80,-100); ctx.lineTo(0,100); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.moveTo(-60,-80); ctx.lineTo(60,-80); ctx.lineTo(0,80); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#228B22'; ctx.fillRect(-100,-180,200,80);
                    ctx.fillStyle = '#fff'; ctx.fillRect(-50,-40,40,40); ctx.fillRect(10,-40,40,40);
                    ctx.fillStyle = '#000'; ctx.fillRect(-40,-30,20,20); ctx.fillRect(20,-30,20,20);
                    ctx.fillStyle = '#333'; ctx.fillRect(-60, 120, 120, 15);
                    ctx.fillStyle = '#ff0000'; ctx.fillRect(-60, 120, 120 * (boss.hp/3), 15);
                    ctx.restore();
                }

                if (gameState === 'dying' && giantCarrot) {
                    ctx.save(); ctx.translate(giantCarrot.x + giantCarrot.width/2, giantCarrot.y + giantCarrot.height/2);
                    ctx.shadowBlur = 30; ctx.shadowColor = '#ff0000'; ctx.fillStyle = '#5c4a3d';
                    ctx.beginPath(); ctx.moveTo(-80,-80); ctx.lineTo(120,-120); ctx.lineTo(-20,200); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#3e2e24'; ctx.fillRect(-40, -40, 60, 60); ctx.fillRect(40, 60, 50, 50);
                    ctx.fillStyle = '#4a5d23'; ctx.fillRect(-100,-220,200,120); ctx.fillStyle = '#36441a'; ctx.fillRect(-60,-280,80,80);
                    ctx.restore();
                }
            }
            
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.restore();

            if (flash > 0) { ctx.fillStyle = `rgba(255,40,40,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
        }

        let lastTime = performance.now();
        let dt = 0.016;
        function loop(now) {
            dt = (now - lastTime) / 1000; lastTime = now; if (dt > 0.1) dt = 0.1;
            update(dt); draw();
            requestAnimationFrame(loop);
        }

        loadData();
        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
