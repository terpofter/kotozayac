<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Котозаяц: Прыжок в Кубы</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#4CAF50; --primary-dark:#2E7D32; --bg:#1a1a1a; --hud-bg:rgba(0,0,0,0.6); }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden; touch-action: none;
            -webkit-user-select: none; user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #game-container {
            position: relative; width: 800px; height: 600px;
            max-width: 100%; max-height: 100%; aspect-ratio: 4/3;
            border: 4px solid #555; border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            overflow: hidden; background: #000;
        }
        canvas { display: block; width: 100%; height: 100%;
            background: linear-gradient(#87CEEB 60%, #228B22 60%); }

        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; align-items: center; gap: 8px; z-index: 10;
            pointer-events: none;
        }
        .hud-item {
            background: var(--hud-bg); padding: 8px 12px; border-radius: 8px;
            color: white; font-size: 12px; display: flex; align-items: center; gap: 6px;
            border: 2px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);
        }
        .hud-btn {
            background: var(--hud-bg); border: 2px solid rgba(255,255,255,0.2);
            color: white; width: 40px; height: 40px; border-radius: 8px;
            cursor: pointer; font-size: 16px; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); transition: transform 0.1s, background 0.2s;
            pointer-events: auto; font-family: inherit;
        }
        .hud-btn:active { transform: scale(0.9); }
        .hud-btn:hover { background: rgba(255,255,255,0.15); }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
            backdrop-filter: blur(6px); transition: opacity 0.3s;
        }
        .overlay.hidden { display: none; opacity: 0; pointer-events: none; }
        h1 { color: #FFD700; font-size: 32px;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            margin-bottom: 10px; text-align: center; line-height: 1.4; }
        h2 { color: #fff; font-size: 22px; text-shadow: 3px 3px 0 #000; margin-bottom: 20px; }
        .subtitle { color: #aaa; font-size: 10px; margin-bottom: 30px; text-shadow: 2px 2px 0 #000; }
        .btn {
            background: linear-gradient(180deg,#4CAF50,#2E7D32); color: white;
            border: 3px solid #1B5E20; border-radius: 8px;
            padding: 15px 30px; font-size: 14px; font-family: inherit; cursor: pointer;
            box-shadow: 0 6px 0 #1B5E20, 0 8px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s; text-shadow: 2px 2px 0 #000;
            margin: 5px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #1B5E20, 0 2px 5px rgba(0,0,0,0.5); }
        .btn-secondary {
            background: linear-gradient(180deg,#666,#444); border-color: #222;
            box-shadow: 0 6px 0 #222, 0 8px 10px rgba(0,0,0,0.5);
            font-size: 10px; padding: 12px 20px;
        }
        .btn-secondary:active { transform: translateY(6px); box-shadow: 0 0 0 #222, 0 2px 5px rgba(0,0,0,0.5); }

        .slider-wrap { display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 8px;
            margin: 4px 0; width: 260px; }
        .slider-wrap label { color: #fff; font-size: 10px; flex: 0 0 50px; text-shadow: 2px 2px 0 #000; }
        .slider-wrap input[type=range] { flex: 1; accent-color: var(--primary); }

        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: none; justify-content: space-between; padding: 0 20px;
            z-index: 15; pointer-events: none; gap: 10px;
        }
        .control-btn {
            width: 76px; height: 76px; border-radius: 50%;
            background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.4);
            color: white; font-size: 26px; display: flex; justify-content: center; align-items: center;
            pointer-events: auto; touch-action: none; user-select: none;
            backdrop-filter: blur(2px); transition: background 0.1s;
            font-family: inherit; text-shadow: 2px 2px 0 #000;
        }
        .control-btn:active { background: rgba(255,255,255,0.35); }
        .control-btn.jump { background: rgba(76,175,80,0.4); border-color: #4CAF50; }
        .control-btn.jump:active { background: rgba(76,175,80,0.7); }
        #mobile-controls.visible { display: flex; }

        #photo-preview { width: 36px; height: 36px; border-radius: 50%;
            object-fit: cover; display: none; border: 2px solid white; }

        /* ===== TERMINAL DEATH SCREEN ===== */
        #game-over-screen {
            background: #000 !important;
            backdrop-filter: none !important;
            justify-content: flex-start !important;
            align-items: flex-start !important;
            padding: 40px 30px;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.4s;
        }
        #game-over-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.35) 0px,
                rgba(0,0,0,0.35) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scanmove 6s linear infinite;
        }
        @keyframes scanmove {
            0% { background-position: 0 0; }
            100% { background-position: 0 80px; }
        }
        #terminal {
            position: relative;
            z-index: 2;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 15px;
            line-height: 1.75;
            color: #00ff41;
            text-shadow: 0 0 6px currentColor, 0 0 14px currentColor;
            animation: hueShift 6s linear infinite;
            width: 100%;
            max-width: 720px;
            word-wrap: break-word;
            letter-spacing: 0.5px;
        }
        @keyframes hueShift {
            0%   { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        .term-line {
            margin: 0;
            min-height: 1.75em;
            white-space: pre-wrap;
            font-family: inherit;
            color: inherit;
        }
        .term-cursor {
            display: inline-block;
            width: 9px;
            height: 16px;
            background: currentColor;
            margin-left: 3px;
            vertical-align: -2px;
            animation: termBlink 0.9s steps(2) infinite;
            box-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }
        @keyframes termBlink {
            0%, 50% { opacity: 1; }
            50.01%, 100% { opacity: 0; }
        }
        @media (max-width: 600px) {
            h1 { font-size: 20px; } h2 { font-size: 16px; }
            .hud-item { font-size: 9px; padding: 5px 8px; }
            .hud-btn { width: 34px; height: 34px; font-size: 14px; }
            .btn { font-size: 12px; padding: 12px 24px; }
            .slider-wrap { width: 220px; }
            #game-over-screen { padding: 25px 15px; }
            #terminal { font-size: 11px; }
            .term-cursor { width: 7px; height: 12px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
            <div class="hud-item">🍎 <span id="score">0</span></div>
            <div class="hud-item">❤️ <span id="lives">3</span></div>
            <div class="hud-item">🏆 <span id="best">0</span></div>
            <div style="flex:1"></div>
            <img id="photo-preview" alt="Фото">
            <button id="btn-mute" class="hud-btn" title="Звук">🔊</button>
            <button id="btn-photo" class="hud-btn" title="Загрузить фото">📷</button>
            <button id="btn-pause" class="hud-btn" title="Пауза">⏸</button>
            <button id="btn-install" class="hud-btn" title="Установить" style="display:none;">📲</button>
        </div>

        <div id="start-screen" class="overlay">
            <h1>КОТОЗАЯЦ</h1>
            <div class="subtitle">Прыжок в Кубы</div>
            <button id="start-btn" class="btn">ИГРАТЬ</button>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h2>ПАУЗА</h2>
            <div class="slider-wrap">
                <label>SFX</label>
                <input type="range" id="slider-sfx" min="0" max="100" value="70">
            </div>
            <div class="slider-wrap">
                <label>MUSIC</label>
                <input type="range" id="slider-music" min="0" max="100" value="35">
            </div>
            <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
            <button id="reset-photo-btn" class="btn btn-secondary">СБРОСИТЬ ФОТО</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <div id="terminal">
                <div id="term-lines"></div>
            </div>
        </div>

        <div id="mobile-controls">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn jump" id="btn-jump">▲</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>

        <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <script>
        // ============ PWA ============
        const manifest = {
            name: "Котозаяц: Прыжок в Кубы", short_name: "Котозаяц",
            start_url: "./", display: "fullscreen",
            background_color: "#1a1a1a", theme_color: "#87CEEB",
            icons: [{ src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9IjEwMCIgZmlsbD0iIzg3Q0VFQiIvPjxyZWN0IHk9IjM2MCIgd2lkdGg9IjUxMiIgaGVpZ2h0PSIxNTIiIGZpbGw9IiMyMjhCMjIiLz48cmVjdCB4PSIxNjAiIHk9IjEwMCIgd2lkdGg9IjUwIiBoZWlnaHQ9IjEzMCIgcng9IjEwIiBmaWxsPSIjNmY2ZjZmIi8+PHJlY3QgeD0iMzAyIiB5PSIxMDAiIHdpZHRoPSI1MCIgaGVpZ2h0PSIxMzAiIHJ4PSIxMCIgZmlsbD0iIzZmNmY2ZiIvPjxyZWN0IHg9IjE1MCIgeT0iMjAwIiB3aWR0aD0iMjEyIiBoZWlnaHQ9IjIwMCIgcng9IjQwIiBmaWxsPSIjOGE4YThhIi8+PHJlY3QgeD0iMTgwIiB5PSIyNTAiIHdpZHRoPSI1NSIgaGVpZ2h0PSI2MCIgcng9IjEwIiBmaWxsPSIjZmZmIi8+PHJlY3QgeD0iMjc3IiB5PSIyNTAiIHdpZHRoPSI1NSIgaGVpZ2h0PSI2MCIgcng9IjEwIiBmaWxsPSIjZmZmIi8+PHJlY3QgeD0iMTk3IiB5PSIyNjgiIHdpZHRoPSIyOCIgaGVpZ2h0PSIzMCIgcng9IjYiIGZpbGw9IiMwMDAiLz48cmVjdCB4PSIyODciIHk9IjI2OCIgd2lkdGg9IjI4IiBoZWlnaHQ9IjMwIiByeD0iNiIgZmlsbD0iIzAwMCIvPjwvc3ZnPg==", sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest'; manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}))).catch(()=>{});
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('btn-install');
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'flex';
        });
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt(); await deferredPrompt.userChoice;
            deferredPrompt = null; installBtn.style.display = 'none';
        });

        // ============ ЗВУК ============
        const Sound = {
            ctx: null, master: null, musicGain: null, sfxGain: null,
            noiseBuffer: null, muted: false,
            musicVolume: 0.35, sfxVolume: 0.7,
            musicPlaying: false, musicTimer: null,
            nextNoteTime: 0, step: 0, BPM: 115,

            init() {
                if (this.ctx) return;
                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch(e) { return; }
                this.master = this.ctx.createGain();
                this.master.gain.value = this.muted ? 0 : 1;
                this.master.connect(this.ctx.destination);
                this.musicGain = this.ctx.createGain();
                this.musicGain.gain.value = this.musicVolume;
                this.musicGain.connect(this.master);
                this.sfxGain = this.ctx.createGain();
                this.sfxGain.gain.value = this.sfxVolume;
                this.sfxGain.connect(this.master);
                const sr = this.ctx.sampleRate;
                this.noiseBuffer = this.ctx.createBuffer(1, sr * 0.5, sr);
                const data = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            },
            resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
            setMute(m) {
                this.muted = m;
                if (this.master) this.master.gain.value = m ? 0 : 1;
                try { localStorage.setItem('kotozayac_mute', m ? '1' : '0'); } catch(e){}
            },
            setSfxVolume(v) {
                this.sfxVolume = v;
                if (this.sfxGain) this.sfxGain.gain.value = v;
                try { localStorage.setItem('kotozayac_sfx', String(v)); } catch(e){}
            },
            setMusicVolume(v) {
                this.musicVolume = v;
                if (this.musicGain) this.musicGain.gain.value = v;
                try { localStorage.setItem('kotozayac_musicvol', String(v)); } catch(e){}
            },
            tone({freq, type='sine', dur=0.2, vol=0.1, slideTo=null, delay=0,
                   attack=0.005, filter=null, gainNode=null}) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(vol, t + attack);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                let node = osc;
                if (filter) {
                    const f = this.ctx.createBiquadFilter();
                    f.type = filter.type;
                    f.frequency.setValueAtTime(filter.freq, t);
                    if (filter.freqTo) f.frequency.exponentialRampToValueAtTime(filter.freqTo, t + dur);
                    f.Q.value = filter.q || 1;
                    osc.connect(f); node = f;
                }
                node.connect(g).connect(gainNode || this.sfxGain);
                osc.start(t); osc.stop(t + dur + 0.02);
            },
            noise({dur=0.1, vol=0.1, type='highpass', freq=2000, delay=0, gainNode=null}) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay;
                const src = this.ctx.createBufferSource();
                src.buffer = this.noiseBuffer;
                const f = this.ctx.createBiquadFilter();
                f.type = type; f.frequency.value = freq;
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                src.connect(f).connect(g).connect(gainNode || this.sfxGain);
                src.start(t); src.stop(t + dur + 0.01);
            },

            sfx: {
                jump() {
                    Sound.tone({freq: 250, type: 'square', dur: 0.16, vol: 0.1, slideTo: 780});
                    Sound.tone({freq: 500, type: 'triangle', dur: 0.12, vol: 0.05, slideTo: 1200, delay: 0.02});
                },
                boost() {
                    Sound.tone({freq: 200, type: 'sawtooth', dur: 0.5, vol: 0.1, slideTo: 2000,
                        filter: {type: 'bandpass', freq: 500, freqTo: 3500, q: 4}});
                    Sound.tone({freq: 1568, type: 'sine', dur: 0.15, vol: 0.07, delay: 0.42});
                    Sound.tone({freq: 2093, type: 'sine', dur: 0.22, vol: 0.05, delay: 0.5});
                },
                hit() {
                    Sound.tone({freq: 2093, type: 'sine', dur: 0.11, vol: 0.20, attack: 0.001});
                    Sound.tone({freq: 3136, type: 'sine', dur: 0.075, vol: 0.09, attack: 0.001});
                    Sound.tone({freq: 5232, type: 'sine', dur: 0.045, vol: 0.04, attack: 0.001});
                    Sound.noise({dur: 0.008, vol: 0.08, type: 'highpass', freq: 6000});
                },
                gameover() {
                    Sound.tone({freq: 220.00, type: 'sine', dur: 1.6, vol: 0.07, attack: 0.05});
                    Sound.tone({freq: 261.63, type: 'sine', dur: 1.6, vol: 0.06, attack: 0.05});
                    Sound.tone({freq: 329.63, type: 'sine', dur: 1.6, vol: 0.06, attack: 0.05});
                    try {
                        if ('speechSynthesis' in window) {
                            speechSynthesis.cancel();
                            const u = new SpeechSynthesisUtterance('Геймовер');
                            u.lang = 'ru-RU'; u.rate = 0.85; u.pitch = 0.7; u.volume = 1;
                            const voices = speechSynthesis.getVoices();
                            const ru = voices.find(v => v.lang && v.lang.startsWith('ru'));
                            if (ru) u.voice = ru;
                            speechSynthesis.speak(u);
                        }
                    } catch(e) {}
                },
                click() {
                    Sound.noise({dur: 0.025, vol: 0.14, type: 'highpass', freq: 3200});
                    Sound.tone({freq: 2200, type: 'square', dur: 0.02, vol: 0.06, slideTo: 1600});
                },
                start() {
                    Sound.tone({freq: 90, type: 'sawtooth', dur: 0.7, vol: 0.14, slideTo: 45,
                        filter: {type: 'lowpass', freq: 600, freqTo: 120}});
                    Sound.noise({dur: 0.18, vol: 0.1, type: 'lowpass', freq: 600});
                    Sound.tone({freq: 440, type: 'square', dur: 0.4, vol: 0.09, delay: 0.28});
                    Sound.tone({freq: 660, type: 'square', dur: 0.4, vol: 0.08, delay: 0.35});
                    Sound.tone({freq: 880, type: 'sawtooth', dur: 0.6, vol: 0.09, delay: 0.42,
                        filter: {type: 'lowpass', freq: 3000}});
                },
                combo() {
                    Sound.tone({freq: 300, type: 'sawtooth', dur: 0.38, vol: 0.12, slideTo: 2200,
                        filter: {type: 'bandpass', freq: 700, freqTo: 3200, q: 5}});
                    Sound.tone({freq: 600, type: 'square', dur: 0.18, vol: 0.06, slideTo: 1800, delay: 0.12});
                },
                record() {
                    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                        Sound.tone({freq: f, type: 'square', dur: 0.22, vol: 0.08, delay: i * 0.08});
                    });
                    Sound.tone({freq: 1318.5, type: 'triangle', dur: 0.5, vol: 0.07, delay: 0.36});
                }
            },

            music: {
                chords: [
                    { bass: 110.00, notes: [440.00, 523.25, 659.25] },
                    { bass: 87.31,  notes: [349.23, 440.00, 523.25] },
                    { bass: 110.00, notes: [440.00, 523.25, 659.25] },
                    { bass: 98.00,  notes: [392.00, 493.88, 587.33] }
                ],
                start() {
                    if (!Sound.ctx || this.playing) return;
                    this.playing = true;
                    Sound.musicPlaying = true;
                    Sound.nextNoteTime = Sound.ctx.currentTime + 0.1;
                    Sound.step = 0;
                    this.tick();
                },
                stop() {
                    this.playing = false;
                    Sound.musicPlaying = false;
                    if (Sound.musicTimer) { clearTimeout(Sound.musicTimer); Sound.musicTimer = null; }
                },
                tick() {
                    if (!this.playing || !Sound.ctx) return;
                    const stepDur = 60 / Sound.BPM / 4;
                    while (Sound.nextNoteTime < Sound.ctx.currentTime + 0.15) {
                        this.scheduleStep(Sound.step, Sound.nextNoteTime);
                        Sound.nextNoteTime += stepDur;
                        Sound.step = (Sound.step + 1) % 64;
                    }
                    Sound.musicTimer = setTimeout(() => this.tick(), 25);
                },
                scheduleStep(step, time) {
                    const bar = Math.floor(step / 16) % 4;
                    const s = step % 16;
                    const chord = this.chords[bar];
                    if (s % 4 === 0) this.kick(time);
                    if (s === 4 || s === 12) this.snare(time);
                    if (s % 2 === 0) this.hat(time, s % 4 === 0 ? 0.045 : 0.025);
                    if (s === 0 || s === 6 || s === 8 || s === 14) this.bass(chord.bass, time);
                    if (s % 2 === 0) {
                        const note = chord.notes[(s / 2) % 3];
                        this.arp(note, time, s % 4 === 0 ? 0.045 : 0.028);
                    }
                },
                kick(time) {
                    const ctx = Sound.ctx;
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.frequency.setValueAtTime(150, time);
                    o.frequency.exponentialRampToValueAtTime(45, time + 0.12);
                    g.gain.setValueAtTime(0.55, time);
                    g.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
                    o.connect(g).connect(Sound.musicGain);
                    o.start(time); o.stop(time + 0.25);
                },
                snare(time) {
                    const ctx = Sound.ctx;
                    const src = ctx.createBufferSource();
                    src.buffer = Sound.noiseBuffer;
                    const f = ctx.createBiquadFilter();
                    f.type = 'highpass'; f.frequency.value = 1400;
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(0.13, time);
                    g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
                    src.connect(f).connect(g).connect(Sound.musicGain);
                    src.start(time); src.stop(time + 0.18);
                    const o = ctx.createOscillator(), g2 = ctx.createGain();
                    o.frequency.value = 180;
                    g2.gain.setValueAtTime(0.09, time);
                    g2.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                    o.connect(g2).connect(Sound.musicGain);
                    o.start(time); o.stop(time + 0.12);
                },
                hat(time, vol) {
                    const ctx = Sound.ctx;
                    const src = ctx.createBufferSource();
                    src.buffer = Sound.noiseBuffer;
                    const f = ctx.createBiquadFilter();
                    f.type = 'highpass'; f.frequency.value = 8000;
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(vol, time);
                    g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
                    src.connect(f).connect(g).connect(Sound.musicGain);
                    src.start(time); src.stop(time + 0.06);
                },
                bass(freq, time) {
                    const ctx = Sound.ctx;
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    const f = ctx.createBiquadFilter();
                    f.type = 'lowpass'; f.Q.value = 8;
                    f.frequency.setValueAtTime(1400, time);
                    f.frequency.exponentialRampToValueAtTime(220, time + 0.22);
                    o.type = 'sawtooth'; o.frequency.value = freq;
                    g.gain.setValueAtTime(0.16, time);
                    g.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
                    o.connect(f).connect(g).connect(Sound.musicGain);
                    o.start(time); o.stop(time + 0.28);
                },
                arp(freq, time, vol) {
                    const ctx = Sound.ctx;
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    const f = ctx.createBiquadFilter();
                    f.type = 'lowpass'; f.frequency.value = 2400;
                    o.type = 'square'; o.frequency.value = freq;
                    g.gain.setValueAtTime(vol, time);
                    g.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
                    o.connect(f).connect(g).connect(Sound.musicGain);
                    o.start(time); o.stop(time + 0.15);
                }
            }
        };

        try {
            Sound.muted = localStorage.getItem('kotozayac_mute') === '1';
            const s = parseFloat(localStorage.getItem('kotozayac_sfx'));
            if (!isNaN(s)) Sound.sfxVolume = s;
            const m = parseFloat(localStorage.getItem('kotozayac_musicvol'));
            if (!isNaN(m)) Sound.musicVolume = m;
        } catch(e) {}

        // ============ ИГРА ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const bestEl  = document.getElementById('best');

        if (isTouch) document.getElementById('mobile-controls').classList.add('visible');

        let gameState = 'start';
        let score = 0, lives = 3, bestScore = 0;
        let frames = 0, difficulty = 1, prevDifficulty = 1;
        let combo = 0;
        let spawnTimer = 0;
        let objects = [], particles = [], clouds = [];
        let screenShake = 0, flash = 0;
        let btnLeft = false, btnRight = false, btnJump = false;

        try { bestScore = parseInt(localStorage.getItem('kotozayac_best') || '0', 10) || 0; } catch(e) {}
        bestEl.innerText = bestScore;

        const GROUND_Y = H - 150;
        const GRAVITY = 0.85;
        const JUMP_V = -16;

        const player = {
            x: W/2 - 40, y: GROUND_Y, width: 80, height: 80,
            speed: 7, vy: 0, onGround: true
        };

        let customPlayerImg = new Image();
        let hasCustomImg = false;

        try {
            const saved = localStorage.getItem('kotozayac_img');
            if (saved) {
                customPlayerImg.onload = () => {
                    hasCustomImg = true;
                    document.getElementById('photo-preview').src = saved;
                    document.getElementById('photo-preview').style.display = 'block';
                };
                customPlayerImg.src = saved;
            }
        } catch(e) {}

        document.getElementById('btn-photo').addEventListener('click', () => {
            Sound.sfx.click();
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', e => {
            const file = e.target.files[0]; if (!file) return;
            if (file.size > 2 * 1024 * 1024) { alert('Макс 2 МБ'); return; }
            const reader = new FileReader();
            reader.onload = ev => {
                customPlayerImg.onload = () => {
                    hasCustomImg = true;
                    document.getElementById('photo-preview').src = ev.target.result;
                    document.getElementById('photo-preview').style.display = 'block';
                    try { localStorage.setItem('kotozayac_img', ev.target.result); } catch(e) { alert('Не удалось сохранить'); }
                };
                customPlayerImg.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('reset-photo-btn').addEventListener('click', () => {
            Sound.sfx.click();
            hasCustomImg = false;
            try { localStorage.removeItem('kotozayac_img'); } catch(e){}
            document.getElementById('photo-preview').style.display = 'none';
            document.getElementById('photo-preview').src = '';
        });

        for (let i = 0; i < 6; i++) {
            clouds.push({
                x: Math.random() * W, y: 20 + Math.random() * 150,
                speed: 5 + Math.random() * 15, scale: 0.4 + Math.random() * 0.6
            });
        }

        const keys = {};
        window.addEventListener('keydown', e => {
            Sound.init(); Sound.resume();
            keys[e.code] = true;
            if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') tryJump();
            if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
            if ((e.code === 'KeyR' || e.code === 'Enter' || e.code === 'Space') && gameState === 'gameover') restart();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('blur', () => {
            btnLeft = btnRight = btnJump = false;
            for (const k in keys) keys[k] = false;
        });

        canvas.addEventListener('pointerdown', () => { Sound.init(); Sound.resume(); });

        canvas.addEventListener('pointermove', e => {
            if (isTouch || gameState !== 'playing') return;
            const r = canvas.getBoundingClientRect();
            player.x = (e.clientX - r.left) * (W / r.width) - player.width / 2;
            clampPlayer();
        });

        function bindBtn(el, setter) {
            el.addEventListener('pointerdown', e => { e.preventDefault(); setter(true); el.setPointerCapture(e.pointerId); });
            el.addEventListener('pointerup', () => setter(false));
            el.addEventListener('pointercancel', () => setter(false));
            el.addEventListener('pointerleave', () => setter(false));
        }
        bindBtn(document.getElementById('btn-left'),  v => btnLeft = v);
        bindBtn(document.getElementById('btn-right'), v => btnRight = v);
        const jumpBtn = document.getElementById('btn-jump');
        jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); tryJump(); });

        function tryJump() {
            if (gameState !== 'playing') return;
            if (player.onGround) {
                player.vy = JUMP_V;
                player.onGround = false;
                Sound.sfx.jump();
            }
        }

        function togglePause() {
            Sound.sfx.click();
            if (gameState === 'playing') {
                gameState = 'paused';
                Sound.music.stop();
                document.getElementById('pause-screen').classList.remove('hidden');
            } else if (gameState === 'paused') {
                gameState = 'playing';
                Sound.music.start();
                document.getElementById('pause-screen').classList.add('hidden');
            }
        }

        document.getElementById('btn-pause').addEventListener('click', togglePause);
        document.getElementById('btn-mute').addEventListener('click', () => {
            Sound.init(); Sound.resume();
            Sound.setMute(!Sound.muted);
            document.getElementById('btn-mute').textContent = Sound.muted ? '🔇' : '🔊';
            if (!Sound.muted) Sound.sfx.click();
        });
        document.getElementById('btn-mute').textContent = Sound.muted ? '🔇' : '🔊';

        document.getElementById('start-btn').addEventListener('click', () => {
            Sound.init(); Sound.resume();
            Sound.sfx.start();
            setTimeout(() => Sound.music.start(), 700);
            document.getElementById('start-screen').classList.add('hidden');
            resetGame();
            gameState = 'playing';
        });
        document.getElementById('resume-btn').addEventListener('click', togglePause);

        // Клик по терминалу = рестарт
        document.getElementById('game-over-screen').addEventListener('click', () => {
            if (gameState === 'gameover') restart();
        });

        function restart() {
            termGeneration++; // убиваем отложенные анимации печати
            Sound.sfx.click();
            document.getElementById('game-over-screen').classList.add('hidden');
            resetGame();
            gameState = 'playing';
            Sound.music.start();
        }

        const sfxSlider = document.getElementById('slider-sfx');
        const musSlider = document.getElementById('slider-music');
        sfxSlider.value = Math.round(Sound.sfxVolume * 100);
        musSlider.value = Math.round(Sound.musicVolume * 100);
        sfxSlider.addEventListener('input', () => Sound.setSfxVolume(sfxSlider.value / 100));
        musSlider.addEventListener('input', () => Sound.setMusicVolume(musSlider.value / 100));

        function clampPlayer() {
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > W) player.x = W - player.width;
        }

        function spawnParticles(x, y, colors, count) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
                particles.push({
                    x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2,
                    life: 1, decay: 0.02 + Math.random()*0.03,
                    color: colors[(Math.random()*colors.length)|0],
                    size: 2 + Math.random()*5
                });
            }
        }
        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt * 60;
                p.y += p.vy * dt * 60;
                p.vy += 0.25 * dt * 60;
                p.vx *= 0.99;
                p.life -= p.decay * dt * 60;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }
        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function spawnObject() {
            const isCarrot = Math.random() > 0.3;
            objects.push({
                x: Math.random() * (W - 40), y: -40,
                width: 40, height: 40,
                speed: (3 + Math.random()*2.5) + difficulty * 0.6,
                type: isCarrot ? 'carrot' : 'block',
                wobble: Math.random() * Math.PI * 2
            });
        }
        function drawObjects() {
            for (const obj of objects) {
                const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                ctx.save(); ctx.translate(cx, cy);
                if (obj.type === 'carrot') {
                    ctx.rotate(Math.sin(obj.wobble) * 0.15);
                    ctx.fillStyle = '#FF8C00';
                    ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(0,22); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#FFA500';
                    ctx.beginPath(); ctx.moveTo(-5,-5); ctx.lineTo(5,-5); ctx.lineTo(0,18); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#228B22'; ctx.fillRect(-10,-22,20,12);
                    ctx.fillStyle = '#2ecc40'; ctx.fillRect(-4,-28,8,8);
                } else {
                    ctx.fillStyle = '#32CD32'; ctx.fillRect(-20,-20,40,40);
                    ctx.fillStyle = '#2bb52b'; ctx.fillRect(-20,-20,40,8);
                    ctx.fillStyle = '#1f8b1f'; ctx.fillRect(-20,12,40,8);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-12,-8,8,10); ctx.fillRect(4,-8,8,10);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-10,-6,4,6); ctx.fillRect(6,-6,4,6);
                    ctx.fillRect(-6,8,12,3);
                }
                ctx.restore();
            }
        }

        function drawPlayer() {
            const bob = player.onGround ? Math.sin(frames * 0.1) * 3 : 0;
            const px = player.x, py = player.y + bob;
            const w = player.width, h = player.height;

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(px + w/2, GROUND_Y + h + 5, w/2.5 * (player.onGround ? 1 : 0.6), 8, 0, 0, Math.PI*2);
            ctx.fill();

            if (hasCustomImg && customPlayerImg.complete) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(px + w/2, py + h/2, w/2, 0, Math.PI*2);
                ctx.clip();
                const imgRatio = customPlayerImg.width / customPlayerImg.height;
                let drawW = w, drawH = h;
                if (imgRatio > 1) drawH = w / imgRatio; else drawW = h * imgRatio;
                ctx.drawImage(customPlayerImg, px + (w - drawW)/2, py + (h - drawH)/2, drawW, drawH);
                ctx.restore();
            } else {
                ctx.fillStyle = '#6f6f6f';
                ctx.fillRect(px + 10, py - 22, 15, 32);
                ctx.fillRect(px + w - 25, py - 22, 15, 32);
                ctx.fillStyle = '#e8a0a0';
                ctx.fillRect(px + 14, py - 16, 7, 22);
                ctx.fillRect(px + w - 21, py - 16, 7, 22);
                ctx.fillStyle = '#8a8a8a'; ctx.fillRect(px, py, w, h);
                ctx.fillStyle = '#9c9c9c'; ctx.fillRect(px + 12, py + 22, w - 24, 42);
                ctx.fillStyle = '#fff';
                ctx.fillRect(px + 15, py + 20, 20, 22);
                ctx.fillRect(px + w - 35, py + 20, 20, 22);
                ctx.fillStyle = '#000';
                ctx.fillRect(px + 20, py + 26, 10, 12);
                ctx.fillRect(px + w - 30, py + 26, 10, 12);
                ctx.fillStyle = '#fff';
                ctx.fillRect(px + 22, py + 28, 4, 4);
                ctx.fillRect(px + w - 28, py + 28, 4, 4);
                ctx.fillStyle = '#ff9aa2'; ctx.fillRect(px + w/2 - 5, py + 46, 10, 7);
                ctx.fillStyle = '#555';    ctx.fillRect(px + w/2 - 10, py + 57, 20, 4);
            }
        }

        function updateClouds(dt) {
            for (const c of clouds) {
                c.x -= c.speed * dt;
                if (c.x < -100) { c.x = W + 100; c.y = 20 + Math.random() * 150; }
            }
        }
        function drawClouds() {
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            for (const c of clouds) {
                ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.scale, c.scale);
                ctx.beginPath();
                ctx.arc(0, 0, 25, 0, Math.PI*2);
                ctx.arc(25, -10, 20, 0, Math.PI*2);
                ctx.arc(50, 0, 25, 0, Math.PI*2);
                ctx.arc(25, 10, 25, 0, Math.PI*2);
                ctx.fill(); ctx.restore();
            }
        }

        function update(dt) {
            if (gameState !== 'playing') return;
            frames += dt * 60;

            if (keys['ArrowLeft'] || keys['KeyA'] || btnLeft) player.x -= player.speed * dt * 60;
            if (keys['ArrowRight'] || keys['KeyD'] || btnRight) player.x += player.speed * dt * 60;
            clampPlayer();

            player.vy += GRAVITY * dt * 60;
            player.y += player.vy * dt * 60;
            if (player.y >= GROUND_Y) { player.y = GROUND_Y; player.vy = 0; player.onGround = true; }

            difficulty = 1 + Math.floor(score / 100);
            if (difficulty > prevDifficulty) {
                Sound.sfx.boost();
                prevDifficulty = difficulty;
            }

            spawnTimer += dt * 60;
            const spawnInterval = Math.max(16, 50 - difficulty * 4);
            if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnObject(); }

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                obj.y += obj.speed * dt * 60;
                obj.wobble += 0.1 * dt * 60;

                const hit =
                    player.x < obj.x + obj.width &&
                    player.x + player.width > obj.x &&
                    player.y < obj.y + obj.height &&
                    player.y + player.height > obj.y;

                if (hit) {
                    const cx = obj.x + obj.width/2, cy = obj.y + obj.height/2;
                    if (obj.type === 'carrot') {
                        combo++;
                        let gained = 10;
                        if (combo === 3 || combo === 5 || combo === 10 || (combo > 10 && combo % 5 === 0)) {
                            Sound.sfx.combo();
                            gained += combo * 2;
                            spawnParticles(cx, cy, ['#FFD700','#FF8C00','#fff'], 20);
                        } else {
                            Sound.tone({freq: 880, type: 'square', dur: 0.06, vol: 0.05, slideTo: 1200});
                        }
                        score += gained;
                        scoreEl.innerText = score;
                        spawnParticles(cx, cy, ['#FF8C00','#FFD700','#228B22'], 12);
                    } else {
                        combo = 0;
                        lives--; if (lives < 0) lives = 0;
                        livesEl.innerText = lives;
                        Sound.sfx.hit();
                        spawnParticles(cx, cy, ['#32CD32','#ff4444','#ffffff'], 16);
                        screenShake = 15; flash = 0.5;
                        if (lives <= 0) gameOver();
                    }
                    objects.splice(i, 1);
                    continue;
                }
                if (obj.y > H + 20) objects.splice(i, 1);
            }

            updateParticles(dt);

            if (screenShake > 0) { screenShake *= 0.88; if (screenShake < 0.5) screenShake = 0; }
            if (flash > 0) flash = Math.max(0, flash - 0.04 * dt * 60);
        }

        // ============ ТЕРМИНАЛЬНЫЙ ЭКРАН СМЕРТИ ============
        let termGeneration = 0;

        function gameOver() {
            gameState = 'gameover';
            const isNewRecord = score > bestScore;
            if (isNewRecord) {
                bestScore = score;
                bestEl.innerText = bestScore;
                try { localStorage.setItem('kotozayac_best', String(bestScore)); } catch(e) {}
            }
            document.getElementById('game-over-screen').classList.remove('hidden');
            Sound.music.stop();

            if (isNewRecord) {
                setTimeout(() => Sound.sfx.record(), 600);
            } else {
                setTimeout(() => Sound.sfx.gameover(), 300);
            }

            showTerminalGameOver(isNewRecord);
        }

        function showTerminalGameOver(isNewRecord) {
            termGeneration++;
            const gen = termGeneration;

            const lines = [
                '> C:\\KOTOZAYAC\\GAME.EXE',
                '> system.halt();',
                '',
                `> FINAL_SCORE: ${String(score).padStart(6, '0')}`,
                `> BEST_SCORE:  ${String(bestScore).padStart(6, '0')}${isNewRecord ? '  ★ NEW RECORD ★' : ''}`,
                '',
                '> [ENTER] / клик / R — REBOOT',
                ''
            ];

            const container = document.getElementById('term-lines');
            container.innerHTML = '';

            const cursorLine = document.createElement('div');
            cursorLine.className = 'term-line';
            const cursor = document.createElement('span');
            cursor.className = 'term-cursor';
            cursorLine.appendChild(cursor);
            container.appendChild(cursorLine);

            let lineIdx = 0;

            function typeNextLine() {
                if (gen !== termGeneration || lineIdx >= lines.length) return;
                const text = lines[lineIdx];

                const lineEl = document.createElement('div');
                lineEl.className = 'term-line';
                container.insertBefore(lineEl, cursorLine);

                if (text.length === 0) {
                    lineIdx++;
                    setTimeout(typeNextLine, 80);
                    return;
                }

                let charIdx = 0;
                const interval = setInterval(() => {
                    if (gen !== termGeneration) { clearInterval(interval); return; }
                    charIdx++;
                    lineEl.textContent = text.slice(0, charIdx);
                    if (charIdx >= text.length) {
                        clearInterval(interval);
                        Sound.tone({ freq: 1200, type: 'square', dur: 0.015, vol: 0.015 });
                        lineIdx++;
                        setTimeout(typeNextLine, 100);
                    }
                }, 25);
            }

            setTimeout(typeNextLine, 300);
        }

        function resetGame() {
            score = 0; lives = 3;
            frames = 0; spawnTimer = 0; difficulty = 1; prevDifficulty = 1;
            combo = 0;
            objects = []; particles = [];
            screenShake = 0; flash = 0;
            btnLeft = btnRight = btnJump = false;
            player.x = W/2 - player.width/2;
            player.y = GROUND_Y;
            player.vy = 0; player.onGround = true;
            scoreEl.innerText = '0';
            livesEl.innerText = '3';
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('term-lines').innerHTML = '';
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            }
            drawClouds();
            drawObjects();
            drawPlayer();
            drawParticles();
            ctx.restore();

            if (flash > 0) {
                ctx.fillStyle = `rgba(255,40,40,${flash * 0.6})`;
                ctx.fillRect(0, 0, W, H);
            }
        }

        let lastTime = performance.now();
        function loop(now) {
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            if (dt > 0.1) dt = 0.1;
            updateClouds(dt);
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
